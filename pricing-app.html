// ── Penalty Calculator Screen ────────────────────────────────────────────────
function CalculatorScreen() {
  const [tab, setTab]           = React.useState('contract');
  // contract
  const [cn, setCn]             = React.useState('');
  const [cv, setCv]             = React.useState('');
  const [cc, setCc]             = React.useState('');
  const [ccon, setCcon]         = React.useState('');
  const [ctype, setCtype]       = React.useState('سكني');
  const [endDate, setEndDate]   = React.useState('');
  // penalty config
  const [enDelay, setEnDelay]   = React.useState(true);
  const [delayMode, setDelayMode] = React.useState('percentage'); // 'percentage' or 'fixed'
  const [rate, setRate]         = React.useState('0.1');
  const [capP, setCapP]         = React.useState('10');
  const [dailyPenalty, setDailyPenalty] = React.useState('');
  const [enQuality, setEnQuality] = React.useState(true);
  // delay & defects
  const [actualDate, setActualDate] = React.useState('');
  const [manDays, setManDays]   = React.useState('');
  const [defects, setDefects]   = React.useState([]);
  // settlement
  const [earned, setEarned]     = React.useState('');
  const [retention, setRet]     = React.useState('');
  const [advance, setAdv]       = React.useState('');
  const [otherDed, setOther]    = React.useState('');
  const [vars, setVars]         = React.useState('0');
  // results
  const [res, setRes]           = React.useState(null);

  const inp = { width:'100%', padding:'8px 10px', borderRadius:8, border:'1px solid var(--line)', background:'var(--bg)', color:'var(--ink)', fontSize:14, fontFamily:'inherit', boxSizing:'border-box' };
  const lbl = { display:'block', fontSize:12, color:'var(--ink-3)', marginBottom:4 };
  const row = { marginBottom:14 };

  function delayDays() {
    if (actualDate && endDate) return Math.max(0, Math.round((new Date(actualDate) - new Date(endDate)) / 86400000));
    return Math.max(0, parseInt(manDays) || 0);
  }

  function buildReport(r) {
    return [
      '═══════════════════════════════════════════',
      '   تقرير تقييم غرامات العقد الهندسي',
      '═══════════════════════════════════════════',
      'العقد:           ' + (r.cn || 'غير محدد'),
      'قيمة العقد:      ' + fmt(r.cv) + ' د.ك',
      'العميل:          ' + (r.cc || 'غير محدد'),
      'المقاول:         ' + (r.ccon || 'غير محدد'),
      'النوع:           ' + r.ctype,
      '───────────────────────────────────────────',
      'أيام التأخير:    ' + r.days + ' يوم',
      'غرامة التأخير:   ' + fmt(r.dFin) + ' د.ك',
      'غرامة الجودة:    ' + fmt(r.qTot) + ' د.ك',
      'إجمالي الغرامات: ' + fmt(r.totPen) + ' د.ك',
      '───────────────────────────────────────────',
      'المستحقات:       ' + fmt(r.earn) + ' د.ك',
      'الخصومات:        ' + fmt(r.totDed) + ' د.ك',
      'التغييرات:       ' + fmt(r.varsV) + ' د.ك',
      '───────────────────────────────────────────',
      'الرصيد النهائي:  ' + fmt(r.balance) + ' د.ك',
      'الحالة:          ' + (r.pos ? 'إيجابي ✅' : 'سالب 🔴'),
      '───────────────────────────────────────────',
      'تاريخ التقرير:   ' + new Date().toLocaleDateString('ar-KW'),
      'النظام:          حاسبة الغرامات الهندسية',
      '═══════════════════════════════════════════',
    ].join('\n');
  }

  function doCalc() {
    const value = parseFloat(cv) || 0;
    if (!value) { alert('الرجاء إدخال قيمة العقد'); setTab('contract'); return; }
    const days = delayDays();
    const mults = { simple:0.5, medium:1.0, critical:2.0 };
    const sevLbl = { simple:'بسيط', medium:'متوسط', critical:'خطير' };

    // delay
    let dGross=0, dFin=0, dCap=0;
    if (enDelay && days > 0) {
      if (delayMode === 'percentage') {
        dGross = value * (parseFloat(rate)||0) / 100 * days;
        dFin = dGross;
        const capAmt = value * (parseFloat(capP)||0) / 100;
        if (capAmt > 0 && dGross > capAmt) { dCap = dGross - capAmt; dFin = capAmt; }
      } else if (delayMode === 'fixed') {
        dGross = (parseFloat(dailyPenalty)||0) * days;
        dFin = dGross;
      }
    }

    // quality
    let qTot=0;
    const dds = enQuality ? defects.map(d => {
      const dp = value * 0.01 * (mults[d.sev]||1) * (parseInt(d.qty)||1);
      qTot += dp;
      return { ...d, pen: Math.round(dp*100)/100, sevL: sevLbl[d.sev] };
    }) : [];

    const totPen  = Math.round((dFin + qTot)*100)/100;
    const earn    = earned !== '' ? (parseFloat(earned) || 0) : value;
    const totDed  = (parseFloat(retention)||0) + (parseFloat(advance)||0) + (parseFloat(otherDed)||0);
    const varsV   = parseFloat(vars)||0;
    const balance = Math.round((earn - totDed - totPen + varsV)*100)/100;

    const r = {
      cn, cv:value, cc, ccon, ctype,
      days, delayMode, dailyPenaltyValue: delayMode==='fixed' ? parseFloat(dailyPenalty)||0 : null,
      dGross:Math.round(dGross*100)/100, dCap:Math.round(dCap*100)/100, dFin:Math.round(dFin*100)/100,
      qTot:Math.round(qTot*100)/100, dds,
      totPen, earn, totDed:Math.round(totDed*100)/100,
      dedBreak: [
        retention ? {l:'ضمان حسن التنفيذ', v:parseFloat(retention)} : null,
        advance   ? {l:'استرداد الدفعة المقدمة', v:parseFloat(advance)} : null,
        otherDed  ? {l:'خصومات أخرى', v:parseFloat(otherDed)} : null,
      ].filter(Boolean),
      varsV, balance, pos: balance >= 0
    };
    r.report = buildReport(r);
    setRes(r);
    setTab('results');
  }

  function addDef()          { setDefects(p => [...p, {id:Date.now(), desc:'', sev:'medium', qty:'1'}]); }
  function remDef(id)        { setDefects(p => p.filter(d => d.id !== id)); }
  function updDef(id, k, v)  { setDefects(p => p.map(d => d.id===id ? {...d,[k]:v} : d)); }

  const TABS = [{id:'contract',l:'📋 العقد'},{id:'penalties',l:'⚙️ الغرامات'},{id:'defects',l:'⏱ التأخير'},{id:'settlement',l:'💰 التصفية'}];

  return (
    <div style={{padding:16}}>
      <h2 style={{marginTop:0}}>🧮 حاسبة الغرامات الهندسية</h2>

      {/* Tab bar */}
      <div style={{display:'flex',gap:4,marginBottom:16,flexWrap:'wrap'}}>
        {[...TABS, ...(res?[{id:'results',l:'📊 النتائج'}]:[])].map(t => (
          <button key={t.id} onClick={()=>setTab(t.id)} style={{
            padding:'6px 11px', borderRadius:20, fontSize:11, fontFamily:'inherit',
            border:'none', cursor:'pointer',
            background: tab===t.id ? 'var(--accent)' : 'var(--bg-soft)',
            color: tab===t.id ? 'var(--bg)' : 'var(--ink-3)',
            fontWeight: tab===t.id ? 700 : 400
          }}>{t.l}</button>
        ))}
      </div>

      {/* ── Contract ── */}
      {tab==='contract' && (
        <div className="card">
          <h3 style={{marginTop:0}}>📋 بيانات العقد</h3>
          <div style={row}><label style={lbl}>اسم العقد / المشروع</label><input style={inp} value={cn} onChange={e=>setCn(e.target.value)} placeholder="مثال: عقد بناء فيلا سكنية"/></div>
          <div style={row}><label style={lbl}>قيمة العقد (د.ك) *</label><input style={inp} type="number" value={cv} onChange={e=>setCv(e.target.value)} placeholder="100000"/></div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:14}}>
            <div><label style={lbl}>العميل</label><input style={inp} value={cc} onChange={e=>setCc(e.target.value)} placeholder="جهة العميل"/></div>
            <div><label style={lbl}>المقاول</label><input style={inp} value={ccon} onChange={e=>setCcon(e.target.value)} placeholder="شركة المقاول"/></div>
          </div>
          <div style={row}><label style={lbl}>نوع المشروع</label>
            <select style={inp} value={ctype} onChange={e=>setCtype(e.target.value)}>
              {['سكني','تجاري','صناعي','بنية تحتية','خدمي'].map(t=><option key={t}>{t}</option>)}
            </select>
          </div>
          <div style={row}><label style={lbl}>تاريخ انتهاء العقد المتفق عليه</label><input style={inp} type="date" value={endDate} onChange={e=>setEndDate(e.target.value)}/></div>
          <button onClick={()=>setTab('penalties')} style={{width:'100%',padding:'10px',borderRadius:8,border:'none',background:'var(--accent)',color:'var(--bg)',fontWeight:600,cursor:'pointer',fontFamily:'inherit'}}>التالي: إعدادات الغرامات ←</button>
        </div>
      )}

      {/* ── Penalties config ── */}
      {tab==='penalties' && (
        <div className="card">
          <h3 style={{marginTop:0}}>⚙️ إعدادات الغرامات</h3>
          <div style={{padding:12,background:'var(--info-bg)',borderRadius:8,marginBottom:12}}>
            <label style={{display:'flex',alignItems:'center',gap:8,cursor:'pointer',fontWeight:600,marginBottom:enDelay?10:0}}>
              <input type="checkbox" checked={enDelay} onChange={e=>setEnDelay(e.target.checked)}/> تفعيل غرامة التأخير
            </label>
            {enDelay && (<>
              <div style={{marginBottom:12,padding:10,background:'white',borderRadius:6,border:'1px solid var(--line)'}}>
                <div style={{fontSize:12,fontWeight:600,marginBottom:8}}>اختر نوع الغرامة:</div>
                <div style={{display:'flex',gap:16}}>
                  <label style={{display:'flex',alignItems:'center',gap:6,cursor:'pointer',fontSize:14}}>
                    <input type="radio" name="delayPenaltyMode" value="percentage" checked={delayMode==='percentage'} onChange={e=>setDelayMode('percentage')}/>
                    النسبة المئوية
                  </label>
                  <label style={{display:'flex',alignItems:'center',gap:6,cursor:'pointer',fontSize:14}}>
                    <input type="radio" name="delayPenaltyMode" value="fixed" checked={delayMode==='fixed'} onChange={e=>setDelayMode('fixed')}/>
                    غرامة يومية ثابتة
                  </label>
                </div>
              </div>

              {delayMode==='percentage' ? (
                <>
                  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
                    <div><label style={lbl}>النسبة اليومية (%)</label><input style={inp} type="number" step="0.01" value={rate} onChange={e=>setRate(e.target.value)}/></div>
                    <div><label style={lbl}>الحد الأقصى (% من العقد)</label><input style={inp} type="number" step="0.5" value={capP} onChange={e=>setCapP(e.target.value)}/></div>
                  </div>
                  <div style={{marginTop:8,fontSize:11,color:'var(--ink-3)'}}>الصيغة: قيمة العقد × {rate||'0.1'}% × الأيام، الحد الأقصى {capP||'10'}%</div>
                </>
              ) : (
                <>
                  <div><label style={lbl}>الغرامة اليومية (د.ك)</label><input style={inp} type="number" step="0.01" value={dailyPenalty} onChange={e=>setDailyPenalty(e.target.value)} placeholder="مثال: 50"/></div>
                  <div style={{marginTop:8,fontSize:11,color:'var(--ink-3)'}}>الصيغة: {dailyPenalty||'0'} د.ك × الأيام</div>
                </>
              )}
            </>)}
          </div>
          <div style={{padding:12,background:'var(--warn-bg)',borderRadius:8}}>
            <label style={{display:'flex',alignItems:'center',gap:8,cursor:'pointer',fontWeight:600}}>
              <input type="checkbox" checked={enQuality} onChange={e=>setEnQuality(e.target.checked)}/> تفعيل غرامة الجودة والعيوب
            </label>
            {enQuality && (
              <div style={{marginTop:8,fontSize:11,color:'var(--ink-3)',lineHeight:1.9}}>
                • بسيط: قيمة العقد × 0.5% × الكمية<br/>
                • متوسط: قيمة العقد × 1% × الكمية<br/>
                • خطير: قيمة العقد × 2% × الكمية
              </div>
            )}
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginTop:14}}>
            <button onClick={()=>setTab('contract')} style={{padding:'10px',borderRadius:8,border:'1px solid var(--line)',background:'transparent',color:'var(--ink-3)',cursor:'pointer',fontFamily:'inherit'}}>→ السابق</button>
            <button onClick={()=>setTab('defects')}  style={{padding:'10px',borderRadius:8,border:'none',background:'var(--accent)',color:'var(--bg)',fontWeight:600,cursor:'pointer',fontFamily:'inherit'}}>التالي ←</button>
          </div>
        </div>
      )}

      {/* ── Delay & Defects ── */}
      {tab==='defects' && (
        <div>
          {enDelay && (
            <div className="card" style={{marginBottom:12}}>
              <h3 style={{marginTop:0}}>⏱ التأخير</h3>
              <div style={row}><label style={lbl}>تاريخ الانتهاء الفعلي</label><input style={inp} type="date" value={actualDate} onChange={e=>{setActualDate(e.target.value);setManDays('');}}/></div>
              <div style={row}><label style={lbl}>أو أدخل عدد أيام التأخير يدوياً</label><input style={inp} type="number" value={manDays} onChange={e=>{setManDays(e.target.value);setActualDate('');}} placeholder="0"/></div>
              {(actualDate||manDays) && <div style={{padding:10,background:'var(--neg-bg)',borderRadius:8,color:'var(--neg)',fontWeight:700,textAlign:'center'}}>⏱ أيام التأخير: {delayDays()} يوم</div>}
            </div>
          )}
          {enQuality && (
            <div className="card">
              <h3 style={{marginTop:0}}>🔍 العيوب المكتشفة</h3>
              {defects.map((d,i) => (
                <div key={d.id} style={{padding:10,background:'var(--bg-soft)',borderRadius:8,marginBottom:8,border:'1px solid var(--line)'}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
                    <span style={{fontSize:12,fontWeight:600,color:'var(--ink-3)'}}>عيب #{i+1}</span>
                    <button onClick={()=>remDef(d.id)} style={{background:'var(--neg-bg)',color:'var(--neg)',border:'none',borderRadius:6,padding:'2px 10px',cursor:'pointer',fontSize:12,fontFamily:'inherit'}}>حذف</button>
                  </div>
                  <div style={{marginBottom:8}}><input style={inp} value={d.desc} onChange={e=>updDef(d.id,'desc',e.target.value)} placeholder="وصف العيب"/></div>
                  <div style={{display:'grid',gridTemplateColumns:'2fr 1fr',gap:8}}>
                    <div><label style={lbl}>درجة الشدة</label>
                      <select style={inp} value={d.sev} onChange={e=>updDef(d.id,'sev',e.target.value)}>
                        <option value="simple">بسيط (×0.5)</option>
                        <option value="medium">متوسط (×1.0)</option>
                        <option value="critical">خطير (×2.0)</option>
                      </select>
                    </div>
                    <div><label style={lbl}>الكمية</label><input style={inp} type="number" min="1" value={d.qty} onChange={e=>updDef(d.id,'qty',e.target.value)}/></div>
                  </div>
                </div>
              ))}
              <button onClick={addDef} style={{width:'100%',padding:'8px',borderRadius:8,border:'2px dashed var(--line)',background:'transparent',color:'var(--ink-3)',cursor:'pointer',fontFamily:'inherit'}}>+ إضافة عيب</button>
            </div>
          )}
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginTop:12}}>
            <button onClick={()=>setTab('penalties')} style={{padding:'10px',borderRadius:8,border:'1px solid var(--line)',background:'transparent',color:'var(--ink-3)',cursor:'pointer',fontFamily:'inherit'}}>→ السابق</button>
            <button onClick={()=>setTab('settlement')} style={{padding:'10px',borderRadius:8,border:'none',background:'var(--accent)',color:'var(--bg)',fontWeight:600,cursor:'pointer',fontFamily:'inherit'}}>التالي ←</button>
          </div>
        </div>
      )}

      {/* ── Settlement ── */}
      {tab==='settlement' && (
        <div className="card">
          <h3 style={{marginTop:0}}>💰 التصفية والمستحقات</h3>
          <div style={row}><label style={lbl}>إجمالي المستحقات المكتسبة (د.ك)</label><input style={inp} type="number" value={earned} onChange={e=>setEarned(e.target.value)} placeholder={cv||'100000'}/></div>
          <h4 style={{color:'var(--ink-2)',margin:'0 0 10px'}}>الخصومات</h4>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:14}}>
            <div><label style={lbl}>ضمان حسن التنفيذ (د.ك)</label><input style={inp} type="number" value={retention} onChange={e=>setRet(e.target.value)} placeholder="0"/></div>
            <div><label style={lbl}>استرداد الدفعة المقدمة (د.ك)</label><input style={inp} type="number" value={advance} onChange={e=>setAdv(e.target.value)} placeholder="0"/></div>
          </div>
          <div style={row}><label style={lbl}>خصومات أخرى (د.ك)</label><input style={inp} type="number" value={otherDed} onChange={e=>setOther(e.target.value)} placeholder="0"/></div>
          <div style={row}><label style={lbl}>أوامر التغيير (+إضافة / -خصم)</label><input style={inp} type="number" value={vars} onChange={e=>setVars(e.target.value)} placeholder="0"/></div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginTop:8}}>
            <button onClick={()=>setTab('defects')} style={{padding:'10px',borderRadius:8,border:'1px solid var(--line)',background:'transparent',color:'var(--ink-3)',cursor:'pointer',fontFamily:'inherit'}}>→ السابق</button>
            <button onClick={doCalc} style={{padding:'11px',borderRadius:8,border:'none',background:'var(--pos)',color:'white',fontWeight:700,cursor:'pointer',fontFamily:'inherit',fontSize:14}}>🧮 احسب الآن</button>
          </div>
        </div>
      )}

      {/* ── Results ── */}
      {tab==='results' && res && (
        <div>
          <div style={{padding:16,borderRadius:12,background:res.pos?'var(--pos-bg)':'var(--neg-bg)',border:`1px solid ${res.pos?'var(--pos)':'var(--neg)'}`,marginBottom:14,textAlign:'center'}}>
            <div style={{fontSize:11,color:res.pos?'var(--pos)':'var(--neg)',marginBottom:4}}>الرصيد النهائي</div>
            <div style={{fontSize:28,fontWeight:800,color:res.pos?'var(--pos)':'var(--neg)'}}>{fmt(Math.abs(res.balance))} د.ك</div>
            <div style={{fontSize:12,marginTop:4,color:res.pos?'var(--pos)':'var(--neg)'}}>{res.pos?'✅ مستحقات إيجابية':'🔴 رصيد سالب — توجد مديونية'}</div>
          </div>

          {/* Penalty breakdown */}
          <div className="card" style={{marginBottom:14}}>
            <h3 style={{marginTop:0}}>📊 تفاصيل الغرامات</h3>
            {res.days > 0 && (
              <div style={{marginBottom:10,padding:10,background:'var(--bg-soft)',borderRadius:8}}>
                <div style={{fontWeight:600,marginBottom:6,fontSize:13}}>⏱ غرامة التأخير</div>
                {[
                  ['عدد الأيام', res.days + ' يوم'],
                  ['الغرامة الإجمالية', fmt(res.dGross) + ' د.ك'],
                  ...(res.dCap>0 ? [['الحد الأقصى المطبق', '- ' + fmt(res.dCap) + ' د.ك']] : []),
                  ['الغرامة النهائية', fmt(res.dFin) + ' د.ك'],
                ].map(([k,v],i) => (
                  <div key={i} style={{display:'flex',justifyContent:'space-between',fontSize:12,color:'var(--ink-3)',padding:'2px 0'}}>
                    <span>{k}</span><strong style={{color:i===([['عدد الأيام',''],[''],['',...(res.dCap>0?[['']]:[])]].length-1)?'var(--neg)':'var(--ink)'}}>{v}</strong>
                  </div>
                ))}
              </div>
            )}
            {res.dds.length > 0 && (
              <div style={{padding:10,background:'var(--bg-soft)',borderRadius:8,marginBottom:10}}>
                <div style={{fontWeight:600,marginBottom:6,fontSize:13}}>🔍 غرامة الجودة</div>
                {res.dds.map((d,i) => (
                  <div key={i} style={{display:'flex',justifyContent:'space-between',fontSize:12,color:'var(--ink-3)',padding:'3px 0',borderBottom:'1px solid var(--line)'}}>
                    <span>{d.desc||`عيب ${i+1}`} <span style={{color:'var(--warn)'}}>({d.sevL})</span></span>
                    <strong style={{color:'var(--neg)'}}>{fmt(d.pen)} د.ك</strong>
                  </div>
                ))}
                <div style={{display:'flex',justifyContent:'space-between',fontSize:12,fontWeight:700,marginTop:4}}>
                  <span>إجمالي غرامة الجودة</span><span style={{color:'var(--neg)'}}>{fmt(res.qTot)} د.ك</span>
                </div>
              </div>
            )}
            <div style={{display:'flex',justifyContent:'space-between',fontWeight:800,padding:'8px 0',borderTop:'2px solid var(--line)'}}>
              <span>إجمالي الغرامات</span><span style={{color:'var(--neg)'}}>{fmt(res.totPen)} د.ك</span>
            </div>
          </div>

          {/* Settlement summary */}
          <div className="card" style={{marginBottom:14}}>
            <h3 style={{marginTop:0}}>💰 ملخص التصفية</h3>
            {[
              {l:'إجمالي المستحقات', v:res.earn,     c:'var(--pos)', sign:'+'},
              {l:'إجمالي الخصومات', v:res.totDed,   c:'var(--warn)',sign:'-'},
              {l:'إجمالي الغرامات', v:res.totPen,   c:'var(--neg)', sign:'-'},
              {l:'أوامر التغيير',   v:res.varsV,    c:res.varsV>=0?'var(--pos)':'var(--neg)',sign:res.varsV>=0?'+':'-'},
            ].map((r,i)=>(
              <div key={i} style={{display:'flex',justifyContent:'space-between',padding:'6px 0',borderBottom:'1px solid var(--line)',fontSize:13}}>
                <span>{r.l}</span>
                <span style={{color:r.c,fontWeight:600}}>{r.sign} {fmt(Math.abs(r.v))} د.ك</span>
              </div>
            ))}
            <div style={{display:'flex',justifyContent:'space-between',padding:'10px 0',fontWeight:800,fontSize:15}}>
              <span>الرصيد النهائي</span>
              <span style={{color:res.pos?'var(--pos)':'var(--neg)'}}>{res.balance>=0?'':'-'} {fmt(Math.abs(res.balance))} د.ك</span>
            </div>
          </div>

          {/* Printable report */}
          <div className="card">
            <h3 style={{marginTop:0}}>📄 التقرير الرسمي</h3>
            <pre id="calc-report" style={{fontFamily:'inherit',fontSize:11,lineHeight:1.8,whiteSpace:'pre-wrap',wordBreak:'break-word',background:'var(--bg-soft)',padding:12,borderRadius:8,color:'var(--ink-2)',maxHeight:360,overflowY:'auto',margin:0}}>{res.report}</pre>
            <button onClick={()=>{const el=document.getElementById('calc-report');if(el&&navigator.clipboard)navigator.clipboard.writeText(el.innerText).then(()=>alert('✅ تم نسخ التقرير!'));}} style={{width:'100%',marginTop:8,padding:'9px',borderRadius:8,border:'1px solid var(--line)',background:'transparent',color:'var(--ink-3)',cursor:'pointer',fontFamily:'inherit'}}>📋 نسخ التقرير</button>
          </div>

          <button onClick={()=>{setTab('contract');setRes(null);}} style={{width:'100%',marginTop:12,padding:'10px',borderRadius:8,border:'1px solid var(--line)',background:'transparent',color:'var(--ink-3)',cursor:'pointer',fontFamily:'inherit'}}>🔄 حساب جديد</button>
        </div>
      )}
    </div>
  );
}

function SourceChatScreen() {
  var [sources,       setSources]       = React.useState([]);
  var [activeId,      setActiveId]      = React.useState(null);
  var [messages,      setMessages]      = React.useState([
    { id: 1, role: 'assistant', text: 'مرحباً! 🗂️\n\n① ارفع مستنداتك (PDF أو ملف نصي)\n② اسألني أي سؤال\n③ سأجيبك من واقع ما في المستند فقط\n\nابدأ بالضغط على زر "＋ رفع مصدر" 👆' }
  ]);
  var [input,         setInput]         = React.useState('');
  var [pdfReady,      setPdfReady]      = React.useState(false);
  var msgEndRef   = React.useRef(null);
  var fileInputRef = React.useRef(null);
  var sourcesRef  = React.useRef(sources);
  React.useEffect(function() { sourcesRef.current = sources; }, [sources]);

  // Load PDF.js once
  React.useEffect(function() {
    if (window.pdfjsLib) { setPdfReady(true); return; }
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js';
    s.onload = function() {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
      setPdfReady(true);
    };
    document.head.appendChild(s);
  }, []);

  React.useEffect(function() {
    if (msgEndRef.current) msgEndRef.current.scrollIntoView({ behavior: 'smooth' });
  }, [messages]);

  // ── استخراج بيانات ذكي من النص ──────────────────────────────────
  function extractKeyData(text) {
    var r = {};
    var vals = text.match(/[\d,\.]+\s*(دينار كويتي|دينار|KD|KWD|د\.ك)/gi);
    if (vals && vals.length) r.values = vals.slice(0, 5);
    var dates = text.match(/\d{1,2}[\/\-\.]\d{1,2}[\/\-\.]\d{2,4}/g);
    if (dates && dates.length) r.dates = dates.slice(0, 5);
    var penalties = text.match(/غرامة[^\n،.]{0,120}/gi);
    if (penalties && penalties.length) r.penalties = penalties.slice(0, 3);
    var qtys = text.match(/\d+[\d,\.]*\s*(متر مربع|متر طولي|م²|م٢|م3|قطعة|وحدة|طن|كجم|لفة)/gi);
    if (qtys && qtys.length) r.quantities = qtys.slice(0, 5);
    var contractors = text.match(/المقاول\s*[:\-]\s*([^\n،.]{3,50})/gi);
    if (contractors && contractors.length) r.contractors = contractors.slice(0, 2);
    var projects = text.match(/المشروع\s*[:\-]\s*([^\n،.]{3,80})/gi);
    if (projects && projects.length) r.projects = projects.slice(0, 2);
    var items = text.match(/\d+[\d\.]*\s*(د\.ك|KD)\s*[\/\-]\s*(متر|م|وحدة|قطعة)/gi);
    if (items && items.length) r.unitPrices = items.slice(0, 5);
    return r;
  }

  function buildAnalysisMsg(filename, ext, pageCount) {
    var src = sources.find(function(s) { return s.name === filename; }) || {};
    var text = src.text || '';
    var ext2 = extractKeyData(text);
    var lines = ['✅ تم قراءة **' + filename + '**'];
    if (pageCount) lines.push('📄 ' + pageCount + ' صفحة');
    lines.push('');
    lines.push('📊 **البيانات المستخرجة:**');
    if (ext2.projects   && ext2.projects.length)    lines.push('🏗️ المشروع: '   + ext2.projects.join(' | '));
    if (ext2.contractors && ext2.contractors.length) lines.push('👷 المقاول: '  + ext2.contractors.join(' | '));
    if (ext2.values     && ext2.values.length)       lines.push('💰 قيم مالية: '+ ext2.values.slice(0,3).join(' · '));
    if (ext2.dates      && ext2.dates.length)        lines.push('📅 تواريخ: '   + ext2.dates.join(' · '));
    if (ext2.penalties  && ext2.penalties.length)    lines.push('⚠️ غرامات: '   + ext2.penalties.join('\n   '));
    if (ext2.quantities && ext2.quantities.length)   lines.push('📦 كميات: '    + ext2.quantities.join(' · '));
    if (ext2.unitPrices && ext2.unitPrices.length)   lines.push('💲 أسعار: '    + ext2.unitPrices.join(' · '));
    if (!Object.keys(ext2).length) lines.push('لم أعثر على بيانات هيكلية — يمكنك سؤالي بلغة طبيعية.');
    lines.push('');
    lines.push('❓ اسألني عن أي تفصيل في هذا المصدر أو المصادر الأخرى!');
    return lines.join('\n');
  }

  // ── معالجة الملفات ───────────────────────────────────────────────
  function handleFiles(files) {
    Array.from(files).forEach(function(file) {
      var ext = file.name.split('.').pop().toLowerCase();
      if (ext === 'pdf') {
        processPDF(file);
      } else if (['jpg','jpeg','png','gif','webp','bmp'].indexOf(ext) !== -1) {
        processImage(file);
      } else if (['txt','csv','text'].indexOf(ext) !== -1) {
        processText(file);
      } else if (['doc','docx'].indexOf(ext) !== -1) {
        addMsg('⚠️ ملفات Word لا تُقرأ مباشرة. انسخ النص من الملف والصقه هنا كرسالة نصية.');
      }
    });
  }

  function processPDF(file) {
    if (!window.pdfjsLib) { addMsg('⏳ جاري تحميل قارئ PDF، انتظر لحظة...'); return; }
    addMsg('⏳ جاري قراءة ' + file.name + '...');
    var reader = new FileReader();
    reader.onload = function(e) {
      var buffer = e.target.result;
      window.pdfjsLib.getDocument({ data: buffer }).promise.then(function(pdf) {
        var totalPages = pdf.numPages;
        var allText = '';
        var pages = [];
        var chain = Promise.resolve();
        for (var i = 1; i <= totalPages; i++) {
          (function(pageNum) {
            chain = chain.then(function() {
              return pdf.getPage(pageNum).then(function(page) {
                return page.getTextContent().then(function(tc) {
                  var pageText = tc.items.map(function(it) { return it.str; }).join(' ');
                  allText += pageText + '\n';
                  var viewport = page.getViewport({ scale: 1.4 });
                  var canvas = document.createElement('canvas');
                  canvas.width = viewport.width;
                  canvas.height = viewport.height;
                  return page.render({ canvasContext: canvas.getContext('2d'), viewport: viewport }).promise.then(function() {
                    pages.push({ pageNum: pageNum, dataUrl: canvas.toDataURL('image/jpeg', 0.7), text: pageText });
                  });
                });
              });
            });
          })(i);
        }
        chain.then(function() {
          var src = { id: Date.now(), name: file.name, type: 'pdf', text: allText, pages: pages, thumb: pages[0] ? pages[0].dataUrl : null };
          setSources(function(prev) { return [...prev, src]; });
          setActiveId(src.id);
          // remove loading message and add analysis
          setMessages(function(prev) {
            var filtered = prev.filter(function(m) { return m.text.indexOf('جاري قراءة ' + file.name) === -1; });
            return [...filtered, { id: Date.now() + 1, role: 'assistant', text: buildAnalysisForSrc(src) }];
          });
        });
      }).catch(function(err) {
        addMsg('❌ تعذّر قراءة PDF: ' + err.message);
      });
    };
    reader.readAsArrayBuffer(file);
  }

  function buildAnalysisForSrc(src) {
    var ext = extractKeyData(src.text || '');
    var lines = ['✅ تم قراءة **' + src.name + '**'];
    if (src.pages) lines.push('📄 ' + src.pages.length + ' صفحة');
    lines.push('');
    lines.push('📊 **البيانات المستخرجة:**');
    if (ext.projects    && ext.projects.length)    lines.push('🏗️ المشروع: '   + ext.projects.join(' | '));
    if (ext.contractors && ext.contractors.length) lines.push('👷 المقاول: '   + ext.contractors.join(' | '));
    if (ext.values      && ext.values.length)      lines.push('💰 قيم مالية: ' + ext.values.slice(0,3).join(' · '));
    if (ext.dates       && ext.dates.length)       lines.push('📅 تواريخ: '    + ext.dates.join(' · '));
    if (ext.penalties   && ext.penalties.length)   lines.push('⚠️ غرامات: '    + ext.penalties.slice(0,2).join('\n   '));
    if (ext.quantities  && ext.quantities.length)  lines.push('📦 كميات: '     + ext.quantities.join(' · '));
    if (ext.unitPrices  && ext.unitPrices.length)  lines.push('💲 أسعار وحدة: '+ ext.unitPrices.join(' · '));
    if (!Object.keys(ext).length) lines.push('لم أجد بيانات هيكلية — اسألني بلغة طبيعية عن أي شيء في المستند.');
    lines.push('\n❓ اسألني عن أي تفصيل في هذا المصدر أو المصادر الأخرى!');
    return lines.join('\n');
  }

  function processImage(file) {
    var reader = new FileReader();
    reader.onload = function(e) {
      var src = { id: Date.now(), name: file.name, type: 'image', text: '', dataUrl: e.target.result };
      setSources(function(prev) { return [...prev, src]; });
      setActiveId(src.id);
      addMsg('🖼️ تم رفع الصورة **' + file.name + '**.\n\nلا أستطيع قراءة النص من الصور بدون API للذكاء الاصطناعي، لكن يمكنك:\n• وصف محتوى الصورة هنا بكلماتك\n• أو نسخ أي نص من الصورة ولصقه\n\nوسأساعدك في التحليل فوراً!');
    };
    reader.readAsDataURL(file);
  }

  function processText(file) {
    var reader = new FileReader();
    reader.onload = function(e) {
      var text = e.target.result;
      var src = { id: Date.now(), name: file.name, type: 'text', text: text };
      setSources(function(prev) { return [...prev, src]; });
      setActiveId(src.id);
      addMsg(buildAnalysisForSrc(src));
    };
    reader.readAsText(file, 'utf-8');
  }

  function addMsg(text) {
    setMessages(function(prev) { return [...prev, { id: Date.now(), role: 'assistant', text: text }]; });
  }

  // ── تطبيع النص العربي للبحث ─────────────────────────────────────
  function normalizeAr(text) {
    return text
      .replace(/أ|إ|آ/g, 'ا')
      .replace(/ة/g, 'ه')
      .replace(/ى/g, 'ي')
      .replace(/[ً-ٟ]/g, '') // remove tashkeel
      .replace(/\s+/g, ' ')
      .trim();
  }

  // ── محرك البحث في المستندات ──────────────────────────────────────
  function answerQuestion(q, srcsArg) {
    var srcs = srcsArg || sourcesRef.current || [];

    if (!srcs.length) {
      return 'ارفع مستنداً أولاً';
    }

    // ابنِ قائمة الفقرات مع تتبّع المصدر لكل فقرة
    var paragraphs = [];
    srcs.forEach(function(src) {
      var text = (src && src.text) || '';
      if (!text.trim()) return;

      // قسّم على فواصل الأسطر المزدوجة أولاً
      var rawParas = text.split(/\n\s*\n+/);
      rawParas.forEach(function(p) {
        var clean = p.replace(/\s+/g, ' ').trim();
        if (!clean) return;
        // إذا كانت الفقرة طويلة جداً، قسّمها لمجموعات من 3 جمل
        var sentences = clean.split(/(?<=[.!؟?])\s+|[،؛]\s+/).filter(function(s) { return s.trim().length > 0; });
        if (sentences.length <= 4) {
          paragraphs.push({ text: clean, source: src.name || '' });
        } else {
          // chunks بطول 3 جمل مع تداخل جملة واحدة
          for (var i = 0; i < sentences.length; i += 2) {
            var chunk = sentences.slice(i, i + 3).join(' ').trim();
            if (chunk.length > 10) paragraphs.push({ text: chunk, source: src.name || '' });
            if (i + 3 >= sentences.length) break;
          }
        }
      });
    });

    if (!paragraphs.length) {
      return 'ارفع مستنداً أولاً';
    }

    var qNorm = normalizeAr(q);
    var qWords = qNorm.split(/\s+/).filter(function(w) { return w.length > 1; });

    if (!qWords.length) {
      return 'لم أجد هذه المعلومة في مصادرك';
    }

    // سجّل نقاط كل فقرة بعدد الكلمات المطابقة
    var scored = paragraphs.map(function(p) {
      var pNorm = normalizeAr(p.text);
      var matched = 0;
      qWords.forEach(function(w) {
        if (pNorm.indexOf(w) !== -1) matched++;
      });
      return { text: p.text, source: p.source, score: matched };
    });

    scored.sort(function(a, b) { return b.score - a.score; });
    var top = scored.filter(function(x) { return x.score > 0; }).slice(0, 5);

    if (!top.length) {
      return 'لم أجد هذه المعلومة في مصادرك';
    }

    // اجمع أفضل النتائج وارفقها بأسماء المصادر
    var answer = '📋 من المصادر المرفوعة:\n\n';
    top.forEach(function(item, i) {
      answer += '📌 ' + (i + 1) + '. ' + item.text + '\n';
      if (item.source) answer += '   📄 المصدر: ' + item.source + '\n';
      answer += '\n';
    });

    return answer.trim();
  }

  function sendMessage() {
    if (!input.trim()) return;
    var userText = input.trim();
    setMessages(function(prev) { return [...prev, { id: Date.now(), role: 'user', text: userText }]; });
    setInput('');
    setTimeout(function() {
      addMsg(answerQuestion(userText, sourcesRef.current));
    }, 400);
  }

  var activeSource = sources.find(function(s) { return s.id === activeId; });

  // ── JSX ─────────────────────────────────────────────────────────
  return (
    <div style={{ display: 'flex', flexDirection: 'column', height: '100%', overflow: 'hidden' }}>

      {/* رأس الصفحة */}
      <div style={{ padding: '10px 16px', background: 'var(--surface)', borderBottom: '1px solid var(--line)', flexShrink: 0, display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <div>
          <div style={{ fontWeight: 700, fontSize: 15, color: 'var(--ink)' }}>🗂️ المستشار الذكي — من واقع المصادر</div>
          <div style={{ fontSize: 11, color: 'var(--ink-3)', marginTop: 2 }}>
            {sources.length === 0 ? 'ارفع مصادرك للبدء' : sources.length + ' مصدر مرفوع · ' + sources.filter(function(s){return s.type==='pdf';}).length + ' PDF · ' + sources.filter(function(s){return s.type==='image';}).length + ' صورة'}
          </div>
        </div>
        <div style={{ display: 'flex', gap: 8 }}>
          <button
            onClick={function() { fileInputRef.current && fileInputRef.current.click(); }}
            style={{ padding: '7px 16px', borderRadius: 8, border: 'none', background: 'var(--accent)', color: 'var(--bg)', fontFamily: 'inherit', fontWeight: 700, fontSize: 12, cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 6 }}
          >
            ＋ رفع مصدر
          </button>
          <input
            ref={fileInputRef}
            type="file"
            multiple
            accept=".pdf,.png,.jpg,.jpeg,.gif,.webp,.txt,.csv"
            style={{ display: 'none' }}
            onChange={function(e) { handleFiles(e.target.files); e.target.value = ''; }}
          />
        </div>
      </div>

      {/* المحتوى الرئيسي */}
      <div style={{ display: 'flex', flex: 1, overflow: 'hidden' }}>

        {/* يسار: المصادر + العارض */}
        <div style={{ width: '55%', display: 'flex', flexDirection: 'column', borderLeft: '1px solid var(--line)', overflow: 'hidden' }}>

          {/* شريط المصادر */}
          <div style={{ display: 'flex', gap: 4, padding: '6px 8px', background: 'var(--bg-soft)', borderBottom: '1px solid var(--line)', overflowX: 'auto', flexShrink: 0, alignItems: 'center' }}>
            {sources.length === 0 ? (
              <span style={{ fontSize: 11, color: 'var(--ink-4)', padding: '2px 4px' }}>لا توجد مصادر بعد</span>
            ) : sources.map(function(s) { return (
              <button
                key={s.id}
                onClick={function() { setActiveId(s.id); }}
                style={{
                  padding: '4px 10px', borderRadius: 6, border: 'none', cursor: 'pointer',
                  fontFamily: 'inherit', fontSize: 11, fontWeight: 600, flexShrink: 0,
                  background: s.id === activeId ? 'var(--accent)' : 'var(--surface)',
                  color: s.id === activeId ? 'var(--bg)' : 'var(--ink)',
                  boxShadow: s.id === activeId ? 'none' : '0 1px 2px rgba(0,0,0,.06)',
                }}
              >
                {s.type === 'pdf' ? '📄' : s.type === 'image' ? '🖼️' : '📝'} {s.name.length > 20 ? s.name.substring(0,18) + '…' : s.name}
              </button>
            ); })}
          </div>

          {/* عارض المستند */}
          <div style={{ flex: 1, overflowY: 'auto', background: '#f0f0ec', padding: activeSource ? 12 : 0 }}
            onDragOver={function(e) { e.preventDefault(); }}
            onDrop={function(e) { e.preventDefault(); handleFiles(e.dataTransfer.files); }}
          >
            {!activeSource ? (
              <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', height: '100%', gap: 14, padding: 24 }}>
                <div style={{ fontSize: 52 }}>📁</div>
                <div style={{ fontSize: 15, fontWeight: 700, color: 'var(--ink-2)' }}>ارفع مصادرك هنا</div>
                <div style={{ fontSize: 12, color: 'var(--ink-4)', textAlign: 'center', lineHeight: 1.7 }}>
                  PDF · صور · ملفات نصية<br/>اسحب وأفلت أو اضغط الزر أعلاه
                </div>
                <button
                  onClick={function() { fileInputRef.current && fileInputRef.current.click(); }}
                  style={{ padding: '10px 22px', borderRadius: 8, border: '2px dashed var(--line-strong)', background: 'transparent', color: 'var(--ink-2)', fontFamily: 'inherit', fontWeight: 700, fontSize: 13, cursor: 'pointer' }}
                >
                  ＋ اختر ملفات
                </button>
              </div>
            ) : activeSource.type === 'image' ? (
              <div style={{ textAlign: 'center' }}>
                <img src={activeSource.dataUrl} alt={activeSource.name} style={{ maxWidth: '100%', borderRadius: 8, boxShadow: '0 2px 12px rgba(0,0,0,.15)' }} />
              </div>
            ) : activeSource.type === 'pdf' ? (
              <div>
                {activeSource.pages && activeSource.pages.map(function(p) { return (
                  <div key={p.pageNum} style={{ marginBottom: 12, background: '#fff', borderRadius: 6, overflow: 'hidden', boxShadow: '0 1px 6px rgba(0,0,0,.12)' }}>
                    <img src={p.dataUrl} alt={'صفحة ' + p.pageNum} style={{ width: '100%', display: 'block' }} />
                    <div style={{ padding: '4px 8px', fontSize: 10, color: '#888', textAlign: 'center', borderTop: '1px solid #eee' }}>صفحة {p.pageNum}</div>
                  </div>
                ); })}
              </div>
            ) : (
              <div style={{ background: '#fff', borderRadius: 8, padding: 16, boxShadow: '0 1px 4px rgba(0,0,0,.08)' }}>
                <pre style={{ fontSize: 12, lineHeight: 1.7, color: 'var(--ink)', whiteSpace: 'pre-wrap', fontFamily: 'inherit', margin: 0 }}>{activeSource.text}</pre>
              </div>
            )}
          </div>
        </div>

        {/* يمين: الجات */}
        <div style={{ flex: 1, display: 'flex', flexDirection: 'column', background: 'var(--surface)', overflow: 'hidden' }}>

          <div style={{ padding: '8px 12px', background: 'var(--bg-soft)', borderBottom: '1px solid var(--line)', fontSize: 11, fontWeight: 700, color: 'var(--ink-2)', flexShrink: 0 }}>
            🤖 المستشار الذكي — {sources.length > 0 ? ('يقرأ ' + sources.length + ' مصدر') : 'في انتظار المصادر'}
          </div>

          {/* الرسائل */}
          <div style={{ flex: 1, overflowY: 'auto', padding: '14px 12px' }}>
            {messages.map(function(m) { return (
              <div key={m.id} style={{ marginBottom: 12, display: 'flex', justifyContent: m.role === 'assistant' ? 'flex-start' : 'flex-end' }}>
                <div style={{
                  maxWidth: '88%', padding: '10px 14px', borderRadius: 12,
                  background: m.role === 'assistant' ? 'var(--bg-soft)' : 'var(--accent)',
                  color: m.role === 'assistant' ? 'var(--ink)' : 'var(--bg)',
                  fontSize: 13, lineHeight: 1.65,
                  borderTopRightRadius: m.role === 'assistant' ? 12 : 2,
                  borderTopLeftRadius:  m.role === 'assistant' ? 2  : 12,
                  border: m.role === 'assistant' ? '1px solid var(--line)' : 'none',
                }}>
                  {m.role === 'assistant' && (
                    <div style={{ fontWeight: 700, fontSize: 11, color: 'var(--ink-3)', marginBottom: 5 }}>🤖 المستشار</div>
                  )}
                  <div style={{ whiteSpace: 'pre-wrap' }}>{m.text}</div>
                </div>
              </div>
            ); })}
            <div ref={msgEndRef} />
          </div>

          {/* حقل الإدخال */}
          <div style={{ padding: '10px 12px', background: 'var(--bg-soft)', borderTop: '1px solid var(--line)', flexShrink: 0 }}>
            <div style={{ display: 'flex', gap: 8, alignItems: 'flex-end' }}>
              <textarea
                style={{
                  flex: 1, padding: '9px 12px', borderRadius: 10, fontSize: 13,
                  border: '1px solid var(--line)', background: 'var(--surface)',
                  color: 'var(--ink)', fontFamily: 'inherit', resize: 'none',
                  minHeight: 40, maxHeight: 100, lineHeight: 1.5,
                  outline: 'none',
                }}
                placeholder={sources.length > 0 ? 'اسأل عن الغرامات، الكميات، الأسعار، التواريخ...' : 'ارفع مصدراً أولاً، أو الصق نصاً هنا مباشرة...'}
                value={input}
                onChange={function(e) { setInput(e.target.value); }}
                onKeyDown={function(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }}
              />
              <button
                onClick={sendMessage}
                style={{
                  width: 42, height: 42, borderRadius: 10, border: 'none', flexShrink: 0,
                  background: input.trim() ? 'var(--accent)' : 'var(--bg-soft)',
                  color: input.trim() ? 'var(--bg)' : 'var(--ink-4)',
                  cursor: input.trim() ? 'pointer' : 'default',
                  fontSize: 18, fontWeight: 700, transition: 'all .15s',
                }}
              >↑</button>
            </div>
            {sources.length > 0 && (
              <div style={{ marginTop: 6, display: 'flex', gap: 6, flexWrap: 'wrap' }}>
                {['ما هي الغرامات؟', 'أبرز الكميات', 'القيم المالية', 'التواريخ المهمة'].map(function(q) { return (
                  <button key={q} onClick={function() { setInput(q); }}
                    style={{ padding: '3px 10px', borderRadius: 20, border: '1px solid var(--line)', background: 'var(--surface)', color: 'var(--ink-2)', fontSize: 11, cursor: 'pointer', fontFamily: 'inherit' }}>
                    {q}
                  </button>
                ); })}
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

// Main app
function App({ session, onLogout }) {
  const [active, setActive] = useState('dashboard');
  const [theme, setTheme] = useState('light');
  const [colorScheme, setColorScheme] = useState('a');
  const [font, setFont] = useState('cairo');
  const [loading, setLoading] = useState(true);
  const [data, setData] = useState(APP_DATA);
  const isAdmin = session?.role === 'admin';

  React.useEffect(() => {
    loadRealData().then(() => {
      setData(APP_DATA);
      setLoading(false);
    });
  }, []);

  const fontMap = {
    plex: '"IBM Plex Sans Arabic"',
    cairo: '"Cairo"',
    tajawal: '"Tajawal"',
  };

  const themeClass = `theme-${colorScheme} ${theme === 'dark' ? 'dark' : ''}`;

  // Apply theme class to root element
  React.useEffect(() => {
    const root = document.getElementById('root');
    root.className = themeClass;
  }, [theme, colorScheme]);

  return (
    <div style={{ display:'flex', flexDirection:'column', height:'100vh', overflow:'hidden' }}>
      {/* ── User identity bar (top) ── */}
      <div className="auth-user-bar">
        <span style={{fontSize:'1rem'}}>⚡</span>
        <span className="u-name">{session?.name}</span>
        <span className={session?.role==='admin' ? 'u-role-admin' : 'u-role-user'}>
          {session?.role==='admin' ? '👑 مشرف' : '👤 مستخدم'}
        </span>
        <button className="u-logout" onClick={onLogout}>تسجيل الخروج</button>
      </div>

      <div className="app-container" style={{ fontFamily: fontMap[font], flex:1, overflow:'hidden' }}>
        <div className="app-content">
          {active === 'dashboard' && <DashboardScreen/>}
          {active === 'stores' && <WorkPricingScreen/>}
          {active === 'products' && <ProductsScreen/>}
          {active === 'materials' && <MaterialsTableScreen/>}
          {active === 'database' && <DatabaseScreen/>}
          {active === 'mindmap' && <MindMapScreen/>}
          {active === 'discussion' && <SourceChatScreen/>}
          {active === 'calculator' && <CalculatorScreen/>}
          {active === 'admin' && isAdmin && <AdminScreen onAdminAuth={()=>{}}/>}
          {active === 'settings' && <SettingsScreen onThemeChange={setTheme} onFontChange={setFont} theme={theme} font={font} onGoAdmin={() => isAdmin && setActive('admin')}/>}
        </div>

        <div className="bottom-bar">
          {/* Sidebar header — visible only on desktop via CSS media query */}
          <div className="sidebar-header">
            <div className="sidebar-logo">⚡</div>
            <div className="sidebar-title">برنامج التسعير</div>
            <div className="sidebar-sub">الكهربائي</div>
          </div>

          <button className={`nav-item ${active === 'dashboard' ? 'active' : ''}`} onClick={() => setActive('dashboard')} title="لوحة التحكم">
            📊<span>التحكم</span>
          </button>
          <button className={`nav-item ${active === 'products' ? 'active' : ''}`} onClick={() => setActive('products')} title="المنتجات">
            🔍<span>المنتجات</span>
          </button>
          <button className={`nav-item ${active === 'stores' ? 'active' : ''}`} onClick={() => setActive('stores')} title="نسبة الأعمال">
            ⚡<span>الأعمال</span>
          </button>
          <button className={`nav-item ${active === 'materials' ? 'active' : ''}`} onClick={() => setActive('materials')} title="جدول المواد">
            📋<span>الجدول</span>
          </button>
          <button className={`nav-item ${active === 'database' ? 'active' : ''}`} onClick={() => setActive('database')} title="قاعدة البيانات">
            💾<span>البيانات</span>
          </button>
          <button className={`nav-item ${active === 'mindmap' ? 'active' : ''}`} onClick={() => setActive('mindmap')} title="خريطة الأفكار القضائية">
            🗺️<span>الخريطة</span>
          </button>
          <button className={`nav-item ${active === 'discussion' ? 'active' : ''}`} onClick={() => setActive('discussion')} title="جلسة النقاش والتنظيم">
            💬<span>النقاش</span>
          </button>
          <button className={`nav-item ${active === 'calculator' ? 'active' : ''}`} onClick={() => setActive('calculator')} title="الحاسبة">
            🧮<span>الحاسبة</span>
          </button>
          {isAdmin && (
            <button className={`nav-item ${active === 'admin' ? 'active' : ''}`} onClick={() => setActive('admin')} title="إدارة المستخدمين">
              👥<span>الإدارة</span>
            </button>
          )}
          <button className={`nav-item ${active === 'settings' ? 'active' : ''}`} onClick={() => setActive('settings')} title="الإعدادات">
            ⚙️<span>الإعدادات</span>
          </button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <AuthWrapper><App/></AuthWrapper>
);
</script>
</body>
</html>
