        </span>
        <button className="u-logout" onClick={onLogout}>تسجيل الخروج</button>
      </div>

      <div className="app-container" style={{ fontFamily: fontMap[font], flex:1, overflow:'hidden' }}>
        <div className="app-content">
          {active === 'dashboard' && <DashboardScreen/>}
          {active === 'stores' && <WorkPricingScreen/>}
          {active === 'products' && <ProductsScreen/>}
          {active === 'materials' && <MaterialsTableScreen/>}
          {active === 'database' && <DatabaseScreen/>}
          {active === 'mindmap' && <MindMapScreen/>}
          {active === 'discussion' && <SourceChatScreen/>}
          {active === 'calculator' && <CalculatorScreen/>}
          {active === 'admin' && isAdmin && <AdminScreen onAdminAuth={()=>{}}/>}
        </div>

        <div className="bottom-bar">
          {/* Sidebar header — visible only on desktop via CSS media query */}
          <div className="sidebar-header">
            <div className="sidebar-logo">⚡</div>
            <div className="sidebar-title">برنامج التسعير</div>
            <div className="sidebar-sub">الكهربائي</div>
          </div>

          <button className={`nav-item ${active === 'dashboard' ? 'active' : ''}`} onClick={() => setActive('dashboard')} title="لوحة التحكم">
            <NavIcon icon="dashboard" /><span>التحكم</span>
          </button>
          <button className={`nav-item ${active === 'products' ? 'active' : ''}`} onClick={() => setActive('products')} title="المنتجات">
            <NavIcon icon="products" /><span>المنتجات</span>
          </button>
          <button className={`nav-item ${active === 'stores' ? 'active' : ''}`} onClick={() => setActive('stores')} title="نسبة الأعمال">
            <NavIcon icon="stores" /><span>الأعمال</span>
          </button>
          <button className={`nav-item ${active === 'materials' ? 'active' : ''}`} onClick={() => setActive('materials')} title="جدول المواد">
            <NavIcon icon="materials" /><span>الجدول</span>
          </button>
          <button className={`nav-item ${active === 'database' ? 'active' : ''}`} onClick={() => setActive('database')} title="قاعدة البيانات">
            <NavIcon icon="database" /><span>البيانات</span>
          </button>
          <button className={`nav-item ${active === 'mindmap' ? 'active' : ''}`} onClick={() => setActive('mindmap')} title="خريطة الأفكار القضائية">
            <NavIcon icon="mindmap" /><span>الخريطة</span>
          </button>
          <button className={`nav-item ${active === 'discussion' ? 'active' : ''}`} onClick={() => setActive('discussion')} title="جلسة النقاش والتنظيم">
            <NavIcon icon="discussion" /><span>النقاش</span>
          </button>
          <button className={`nav-item ${active === 'calculator' ? 'active' : ''}`} onClick={() => setActive('calculator')} title="الحاسبة">
            <NavIcon icon="calculator" /><span>الحاسبة</span>
          </button>
          {isAdmin && (
            <button className={`nav-item ${active === 'admin' ? 'active' : ''}`} onClick={() => setActive('admin')} title="إدارة المستخدمين">
              <NavIcon icon="admin" /><span>الإدارة</span>
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <AuthWrapper><App/></AuthWrapper>
);
</script>

<script>
(function(){
const EMOJIS=['⚡','🔧','📋','👷','🏗️','📞','💡','🔩','🛠️','📅','🚗','☕'];
const today=new Date();
const fmt=d=>d.toISOString().slice(0,10);
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};

let cwEvents={};
cwEvents[fmt(today)]=[
  {title:'Site Inspection',time:'09:00',emoji:'🏗️',note:'Block 4 Villa'},
  {title:'Client Meeting',time:'14:30',emoji:'📞',note:'Ahmed Al-Sabah'}
];
cwEvents[fmt(addDays(today,2))]=[{title:'Panel Installation',time:'08:00',emoji:'⚡',note:'MDB Room B'}];
cwEvents[fmt(addDays(today,-1))]=[{title:'BOQ Review',time:'11:00',emoji:'📋',note:''}];

let cwSelDate=null,cwSelEmoji=EMOJIS[0],cwIsDark=localStorage.getItem('cw_theme')==='dark',cwTodoNextId=5;
let cwTodos=[
  {id:1,text:'Review BOQ for Villa Block 4',tag:'work',done:false},
  {id:2,text:'Submit expert report to court',tag:'urgent',done:false},
  {id:3,text:'Call panel supplier',tag:'work',done:true},
  {id:4,text:'Update pricing app data',tag:'personal',done:false},
];
let cwCalCurrent='0',cwCalExpr='',cwCalOp=null,cwCalNew=true;

// ── Init ──
function cwInit(){
  cwRenderHeader();cwRenderWeek();cwRenderEvents(today);
  cwBuildEmojis();cwRenderTodos();cwUpdateStats();
  // Sync saved dark theme to whole app
  if(cwIsDark){
    document.documentElement.classList.add('dark');
    document.body.classList.add('dark');
    const root=document.getElementById('root');
    if(root)root.classList.add('dark');
  }
  // Apply saved theme
  if(cwIsDark){
    document.getElementById('cw-widget').classList.add('dark');
    const moon=document.getElementById('cw-moon-icon');
    const sun=document.getElementById('cw-sun-icon');
    if(moon)moon.classList.add('cw-ti-active');
    if(sun)sun.classList.remove('cw-ti-active');
  }
  // Ensure overlay panels start hidden
  document.getElementById('cw-calc-panel').classList.remove('cw-visible');
  document.getElementById('cw-profile-panel').classList.remove('cw-visible');
  document.getElementById('cw-add-modal').classList.remove('cw-visible');
  requestAnimationFrame(cwInitThumb);
  cwInjectNavBtn();
}

function cwInjectNavBtn(){
  if(document.getElementById('cw-nav-btn'))return;
  const bottomBar=document.querySelector('.bottom-bar');
  if(!bottomBar){
    // React hasn't mounted yet — wait for it
    const mo=new MutationObserver(function(_,ob){
      if(document.querySelector('.bottom-bar')){ob.disconnect();cwInjectNavBtn();}
    });
    mo.observe(document.body,{childList:true,subtree:true});
    return;
  }
  const widget=document.getElementById('cw-widget');
  const btn=document.createElement('button');
  btn.id='cw-nav-btn';
  btn.className='nav-item cw-nav-btn';
  btn.title='التقويم';
  btn.innerHTML=`<span class="nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span>`;
  btn.addEventListener('click',function(){
    const isVisible=widget.classList.contains('cw-visible');
    if(!isVisible){
      // Position widget above the button that was clicked
      const btnRect=btn.getBoundingClientRect();
      const ww=widget.offsetWidth||340;
      const wh=widget.offsetHeight||580;
      // Center widget horizontally over the button, clamp to viewport
      let left=btnRect.left+(btnRect.width/2)-(ww/2);
      left=Math.max(8,Math.min(left,window.innerWidth-ww-8));
      // Place above the button with 12px gap
      let top=btnRect.top-wh-12;
      if(top<8)top=8;
      widget.style.right='auto';
      widget.style.bottom='auto';
      widget.style.left=left+'px';
      widget.style.top=top+'px';
    }
    widget.classList.toggle('cw-visible',!isVisible);
    btn.classList.toggle('cw-open',!isVisible);
  });
  const obs=new MutationObserver(function(){
    btn.classList.toggle('cw-open',widget.classList.contains('cw-visible'));
  });
  obs.observe(widget,{attributes:true,attributeFilter:['class']});
  bottomBar.appendChild(btn);
}

function cwRenderHeader(){
  const months=['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('cw-date-label').textContent=`${months[today.getMonth()]} ${today.getDate()}, ${today.getFullYear()}`;
  const h=today.getHours();
  document.getElementById('cw-greeting').textContent=h<12?'Good morning':h<17?'Good afternoon':'Good evening';
}

function cwRenderWeek(base){
  base=base||today;
  const sow=new Date(base);sow.setDate(base.getDate()-base.getDay());
  const c=document.getElementById('cw-dates');c.innerHTML='';
  for(let i=0;i<7;i++){
    const d=addDays(sow,i),key=fmt(d);
    const isToday=key===fmt(today),isSel=cwSelDate?key===fmt(cwSelDate):isToday;
    const hasEv=cwEvents[key]&&cwEvents[key].length>0;
    const el=document.createElement('div');
    el.className='cw-day'+(isToday?' cw-today':'')+(isSel&&!isToday?' cw-sel':'')+(hasEv?' cw-has-ev':'');
    el.innerHTML=`<div class="cw-day-num">${d.getDate()}</div><div class="cw-day-dot"></div>`;
    el.addEventListener('click',()=>{cwSelDate=d;cwRenderWeek(base);cwRenderEvents(d);});
    c.appendChild(el);
  }
}

function cwRenderEvents(date){
  const key=fmt(date),isToday=key===fmt(today);
  document.getElementById('cw-sec-label').textContent=isToday?'Today':date.toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'});
  const list=document.getElementById('cw-events'),noEv=document.getElementById('cw-no-ev');
  const evs=cwEvents[key]||[];
  list.innerHTML='';
  if(!evs.length){list.style.display='none';noEv.style.display='block';}
  else{
    list.style.display='flex';noEv.style.display='none';
    evs.forEach((ev,i)=>{
      const c=document.createElement('div');
      c.className='cw-ev-card';c.style.animationDelay=`${i*.06}s`;
      c.innerHTML=`<div class="cw-ev-icon">${ev.emoji}</div><div class="cw-ev-info"><div class="cw-ev-title">${ev.title}</div><div class="cw-ev-meta">${cwFmtTime(ev.time)}${ev.note?' • '+ev.note:''}</div></div>`;
      list.appendChild(c);
    });
  }
}

function cwFmtTime(t){const[h,m]=t.split(':').map(Number);return`${h%12||12}:${String(m).padStart(2,'0')} ${h>=12?'PM':'AM'}`;}

function cwBuildEmojis(){
  const row=document.getElementById('cw-emoji-row');
  EMOJIS.forEach(em=>{
    const el=document.createElement('div');
    el.className='cw-emoji-opt'+(em===cwSelEmoji?' cw-sel':'');
    el.textContent=em;
    el.onclick=()=>{cwSelEmoji=em;row.querySelectorAll('.cw-emoji-opt').forEach(x=>x.classList.remove('cw-sel'));el.classList.add('cw-sel');};
    row.appendChild(el);
  });
}

// ── Drag ──
let cwDragging=false,cwDX,cwDY,cwWX,cwWY;
const cwW=document.getElementById('cw-widget');
document.getElementById('cw-drag').addEventListener('mousedown',e=>{
  cwDragging=true;const r=cwW.getBoundingClientRect();
  cwDX=e.clientX;cwDY=e.clientY;cwWX=r.left;cwWY=r.top;
  cwW.style.transition='none';document.body.style.userSelect='none';
});
document.addEventListener('mousemove',e=>{
  if(!cwDragging)return;
  cwW.style.right='auto';cwW.style.bottom='auto';
  cwW.style.left=Math.max(0,Math.min(cwWX+(e.clientX-cwDX),window.innerWidth-cwW.offsetWidth))+'px';
  cwW.style.top=Math.max(0,Math.min(cwWY+(e.clientY-cwDY),window.innerHeight-cwW.offsetHeight))+'px';
});
document.addEventListener('mouseup',()=>{cwDragging=false;cwW.style.transition='';document.body.style.userSelect='';});

// ── Theme ──
function cwInitThumb(){
  const thumb=document.getElementById('cw-toggle-thumb');
  thumb.style.transition='none';
  thumb.style.transform=cwIsDark?'translateX(22px)':'translateX(2px)';
  requestAnimationFrame(()=>{thumb.style.transition='transform .4s cubic-bezier(.34,1.56,.64,1)';});
}

// ── Public API ──
window.CW={
  toggleWidget(){
    cwW.classList.toggle('cw-visible');
    const nb=document.getElementById('cw-nav-btn');
    if(nb)nb.classList.toggle('cw-open',cwW.classList.contains('cw-visible'));
  },
  toggleTheme(){
    cwIsDark=!cwIsDark;
    localStorage.setItem('cw_theme',cwIsDark?'dark':'light');
    cwW.classList.toggle('dark',cwIsDark);
    // Apply dark to the whole app
    document.documentElement.classList.toggle('dark',cwIsDark);
    document.body.classList.toggle('dark',cwIsDark);
    const root=document.getElementById('root');
    if(root){if(cwIsDark)root.classList.add('dark');else root.classList.remove('dark');}
    const thumb=document.getElementById('cw-toggle-thumb');
    const moon=document.getElementById('cw-moon-icon');
    const sun=document.getElementById('cw-sun-icon');
    if(cwIsDark){
      thumb.style.transform='translateX(22px)';
      moon.classList.add('cw-ti-active');sun.classList.remove('cw-ti-active');
    }else{
      thumb.style.transform='translateX(2px)';
      sun.classList.add('cw-ti-active');moon.classList.remove('cw-ti-active');
    }
  },
  openProfile(){document.getElementById('cw-profile-panel').classList.add('cw-visible');cwUpdateStats();},
  closeProfile(){document.getElementById('cw-profile-panel').classList.remove('cw-visible');},
  openCalc(){document.getElementById('cw-calc-panel').classList.add('cw-visible');},
  closeCalc(){document.getElementById('cw-calc-panel').classList.remove('cw-visible');},
  toggleSci(){
    const row=document.getElementById('cw-sci-row');
    const btn=document.getElementById('cw-sci-btn');
    const panel=document.getElementById('cw-calc-panel');
    const on=row.classList.toggle('cw-sci-open');
    panel.classList.toggle('cw-sci-open',on);
    btn.classList.toggle('cw-sci-on',on);
    btn.textContent=on?'SIMPLE':'SCI';
  },
  calcInput(v){
    if(v==='AC'){cwCalCurrent='0';cwCalExpr='';cwCalOp=null;cwCalNew=true;}
    else if(v==='+/-'){cwCalCurrent=String(parseFloat(cwCalCurrent)*-1);}
    else if(v==='%'){cwCalCurrent=String(parseFloat(cwCalCurrent)/100);}
    else if(v==='='){
      if(cwCalOp&&!cwCalNew){
        const a=parseFloat(cwCalExpr.split(' ')[0]),b=parseFloat(cwCalCurrent);
        let r;if(cwCalOp==='+')r=a+b;else if(cwCalOp==='-')r=a-b;else if(cwCalOp==='×')r=a*b;else if(cwCalOp==='÷')r=b?a/b:'Error';
        cwCalExpr=`${cwCalExpr} ${cwCalCurrent} =`;
        cwCalCurrent=typeof r==='number'?(Number.isInteger(r)?String(r):parseFloat(r.toFixed(10)).toString()):r;
        cwCalOp=null;cwCalNew=true;
      }
    }else if(['+','-','×','÷'].includes(v)){cwCalOp=v;cwCalNew=true;cwCalExpr=`${cwCalCurrent} ${v}`;}
    else if(v==='.'){if(cwCalNew){cwCalCurrent='0.';cwCalNew=false;}else if(!cwCalCurrent.includes('.'))cwCalCurrent+='.';}
    else{if(cwCalNew||cwCalCurrent==='0'){cwCalCurrent=v;cwCalNew=false;}else cwCalCurrent+=v;}
    cwUpdateCalcDisplay();
  },
  calcSci(fn){
    const val=parseFloat(cwCalCurrent);let r;
    if(fn==='sin')r=Math.sin(val*Math.PI/180);else if(fn==='cos')r=Math.cos(val*Math.PI/180);
    else if(fn==='tan')r=Math.tan(val*Math.PI/180);else if(fn==='√')r=Math.sqrt(val);
    else if(fn==='x²')r=val*val;else if(fn==='log')r=Math.log10(val);
    else if(fn==='π'){cwCalCurrent=String(Math.PI);cwCalNew=false;cwUpdateCalcDisplay();return;}
    else if(fn==='e'){cwCalCurrent=String(Math.E);cwCalNew=false;cwUpdateCalcDisplay();return;}
    if(r!==undefined){cwCalExpr=`${fn}(${cwCalCurrent})`;cwCalCurrent=Number.isInteger(r)?String(r):parseFloat(r.toFixed(10)).toString();cwCalNew=true;}
    cwUpdateCalcDisplay();
  },
  openAddModal(){document.getElementById('cw-add-modal').classList.add('cw-visible');document.getElementById('cw-inp-title').focus();},
  closeAddModal(){document.getElementById('cw-add-modal').classList.remove('cw-visible');},
  saveEvent(){
    const title=document.getElementById('cw-inp-title').value.trim();
    if(!title){document.getElementById('cw-inp-title').style.borderColor='#e07040';return;}
    document.getElementById('cw-inp-title').style.borderColor='';
    const time=document.getElementById('cw-inp-time').value;
    const note=document.getElementById('cw-inp-note').value.trim();
    const date=cwSelDate||today,key=fmt(date);
    if(!cwEvents[key])cwEvents[key]=[];
    cwEvents[key].push({title,time,emoji:cwSelEmoji,note});
    cwEvents[key].sort((a,b)=>a.time.localeCompare(b.time));
    CW.closeAddModal();cwRenderWeek(date);cwRenderEvents(date);
    document.getElementById('cw-inp-title').value='';document.getElementById('cw-inp-time').value='09:00';document.getElementById('cw-inp-note').value='';
  },
  showTodoInput(){const w=document.getElementById('cw-todo-inp-wrap');const h=w.style.display==='none';w.style.display=h?'flex':'none';if(h)setTimeout(()=>document.getElementById('cw-todo-inp').focus(),50);},
  addTodo(){
    const inp=document.getElementById('cw-todo-inp'),text=inp.value.trim();if(!text)return;
    cwTodos.unshift({id:cwTodoNextId++,text,tag:'work',done:false});
    inp.value='';document.getElementById('cw-todo-inp-wrap').style.display='none';
    cwRenderTodos();
  },
};

function cwRenderTodos(){
  const list=document.getElementById('cw-todo-list');list.innerHTML='';
  cwTodos.forEach((t,i)=>{
    const el=document.createElement('div');
    el.className='cw-todo-item'+(t.done?' cw-done':'');
    el.style.animationDelay=`${i*.05}s`;
    el.innerHTML=`<div class="cw-todo-chk" onclick="event.stopPropagation();CW._toggleTodo(${t.id})"><svg width="9" height="9" viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="2,6 5,9 10,3"/></svg></div><div class="cw-todo-txt">${t.text}</div><span class="cw-todo-tag cw-tag-${t.tag}">${t.tag}</span>`;
    list.appendChild(el);
  });
  cwUpdateStats();
}
CW._toggleTodo=(id)=>{const t=cwTodos.find(x=>x.id===id);if(t){t.done=!t.done;cwRenderTodos();}};

function cwUpdateStats(){
  const totalEv=Object.values(cwEvents).reduce((s,a)=>s+a.length,0);
  document.getElementById('cw-stat-done').textContent=cwTodos.filter(t=>t.done).length;
  document.getElementById('cw-stat-ev').textContent=totalEv;
  document.getElementById('cw-stat-pend').textContent=cwTodos.filter(t=>!t.done).length;
}

function cwUpdateCalcDisplay(){
  const d=document.getElementById('cw-calc-result'),ex=document.getElementById('cw-calc-expr');
  const len=cwCalCurrent.length;
  d.style.fontSize=len>9?'24px':len>6?'32px':'38px';
  d.textContent=cwCalCurrent;ex.textContent=cwCalExpr;
  d.classList.remove('cw-pop');void d.offsetWidth;d.classList.add('cw-pop');
}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    document.getElementById('cw-add-modal').classList.remove('cw-visible');
    document.getElementById('cw-calc-panel').classList.remove('cw-visible');
    document.getElementById('cw-profile-panel').classList.remove('cw-visible');
  }
});

cwInit();
})();
</script>
</body>
</html>
