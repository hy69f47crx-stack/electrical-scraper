// Materials table screen
function MaterialsTableScreen() {
  const [materials, setMaterials] = React.useState([
    { id: Date.now(), product: '', quantity: 1, unitPrice: 0, total: 0 }
  ]);

  const addRow = () => {
    setMaterials([...materials, { id: Date.now(), product: '', quantity: 1, unitPrice: 0, total: 0 }]);
  };

  const removeRow = (id) => {
    setMaterials(materials.filter(m => m.id !== id));
  };

  const updateRow = (id, field, value) => {
    setMaterials(materials.map(m => {
      if (m.id === id) {
        const updated = { ...m, [field]: value };
        if (field === 'quantity' || field === 'unitPrice') {
          updated.total = (parseFloat(updated.quantity) || 0) * (parseFloat(updated.unitPrice) || 0);
        }
        return updated;
      }
      return m;
    }));
  };

  const updateProduct = (id, productName) => {
    const product = APP_DATA.materials.find(p => p.name === productName);
    if (product) {
      // Update both product and price in a single state update
      setMaterials(materials.map(m => {
        if (m.id === id) {
          const updated = {
            ...m,
            product: productName,
            unitPrice: product.price,
          };
          updated.total = (parseFloat(updated.quantity) || 0) * (parseFloat(updated.unitPrice) || 0);
          return updated;
        }
        return m;
      }));
    }
  };

  const total = materials.reduce((sum, m) => sum + (m.total || 0), 0);

  const exportWord = () => {
    const rows = materials.filter(m => m.product).map(m =>
      `<tr>
         <td align="right"  style="border:1px solid #ccc;padding:8px">${m.product}</td>
         <td align="center" style="border:1px solid #ccc;padding:8px">${m.quantity}</td>
         <td align="center" style="border:1px solid #ccc;padding:8px">${(parseFloat(m.unitPrice)||0).toFixed(3)}</td>
         <td align="center" style="border:1px solid #ccc;padding:8px;font-weight:bold">${(parseFloat(m.total)||0).toFixed(3)}</td>
       </tr>`
    ).join('');
    const html = `<html xmlns:o='urn:schemas-microsoft-com:office:office'
      xmlns:w='urn:schemas-microsoft-com:office:word'
      xmlns='http://www.w3.org/TR/REC-html40'>
      <head>
        <meta charset='utf-8'>
        <xml><w:WordDocument><w:View>Print</w:View></w:WordDocument></xml>
        <style>
          body{font-family:Arial,sans-serif;direction:rtl;padding:24px;font-size:11pt}
          h1{font-size:16pt;margin-bottom:6px}
          p{margin:3px 0}
          table{width:100%;border-collapse:collapse;margin-top:16px}
          th{background:#1a1a1a;color:#fff;border:1px solid #555;padding:9px;text-align:center}
        </style>
      </head>
      <body dir="rtl">
        <h1>📋 قائمة المواد الكهربائية</h1>
        <p><strong>التاريخ:</strong> ${new Date().toLocaleDateString('ar-KW')}</p>
        <p><strong>عدد البنود:</strong> ${materials.filter(m=>m.product).length}</p>
        <br>
        <table>
          <thead>
            <tr>
              <th>المنتج</th><th>الكمية</th>
              <th>السعر الفردي (د.ك)</th><th>المجموع (د.ك)</th>
            </tr>
          </thead>
          <tbody>
            ${rows}
            <tr style="background:#f0f0f0;font-weight:bold">
              <td colspan="3" align="right" style="border:1px solid #ccc;padding:9px;font-size:12pt">الإجمالي الكلي</td>
              <td align="center" style="border:1px solid #ccc;padding:9px;font-size:12pt">${total.toFixed(3)} د.ك</td>
            </tr>
          </tbody>
        </table>
      </body>
    </html>`;
    const blob = new Blob(['﻿'+html], {type:'application/msword'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'قائمة-المواد-'+new Date().toISOString().split('T')[0]+'.doc';
    a.click();
  };

  const exportExcel = () => {
    let csv = 'المنتج,الكمية,السعر (د.ك),المجموع (د.ك)\n';
    materials.forEach(m => {
      csv += `"${m.product}",${m.quantity},${m.unitPrice},${m.total}\n`;
    });
    csv += `,,الإجمالي,${total}`;

    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `materials-${new Date().toISOString().split('T')[0]}.csv`;
    link.click();
  };

  return (
    <div style={{ padding: '16px' }}>
      <h2 style={{ marginTop: 0 }}>📋 جدول المواد</h2>

      <div className="table-container">
        <table style={{ marginBottom: 16 }}>
          <thead>
            <tr>
              <th>المنتج</th>
              <th>الكمية</th>
              <th>السعر الفردي (د.ك)</th>
              <th>المجموع (د.ك)</th>
              <th>حذف</th>
            </tr>
          </thead>
          <tbody>
            {materials.map(m => (
              <tr key={m.id} style={{ background: m.product ? 'var(--info-bg)' : 'transparent', borderLeft: m.product ? '4px solid var(--info)' : 'none' }}>
                <td style={{ minWidth: 300, padding: '12px' }}>
                  {/* Show selected product prominently */}
                  <div style={{ marginBottom: 10 }}>
                    {m.product && (
                      <div style={{ background: 'linear-gradient(135deg, var(--info-bg) 0%, var(--surface) 100%)', padding: '8px 12px', borderRadius: 6, border: '2px solid var(--info)', display: 'block' }}>
                        <div style={{ fontSize: 10, color: 'var(--ink-3)', marginBottom: 3, fontWeight: 600 }}>✅ المنتج المختار</div>
                        <div style={{ fontSize: 15, fontWeight: 700, color: 'var(--info)' }}>{m.product}</div>
                      </div>
                    )}
                  </div>

                  {/* Dropdown for selection */}
                  <select
                    value={m.product || ''}
                    onChange={e => {
                      const selectedValue = e.target.value;
                      if (selectedValue) {
                        updateProduct(m.id, selectedValue);
                      }
                    }}
                    style={{
                      width: '100%',
                      padding: '10px',
                      borderRadius: '6px',
                      border: m.product ? '2px solid var(--info)' : '1px solid var(--line)',
                      fontSize: 13,
                      fontWeight: 500,
                      background: 'var(--surface)',
                      color: m.product ? 'var(--info)' : 'var(--ink)',
                    }}
                  >
                    <option value="">📦 اختر منتج...</option>
                    {APP_DATA.materials.map(p => <option key={p.id} value={p.name}>{p.name}</option>)}
                  </select>
                </td>
                <td style={{ textAlign: 'center' }}>
                  <input
                    type="number"
                    value={m.quantity}
                    onChange={e => updateRow(m.id, 'quantity', e.target.value)}
                    style={{ width: '70px', padding: '8px', borderRadius: '6px', border: '1px solid var(--line)', textAlign: 'center', fontWeight: 600 }}
                    min="1"
                  />
                </td>
                <td className="num" style={{ textAlign: 'center', fontWeight: 600 }}>{fmt(m.unitPrice)}</td>
                <td className="num" style={{ textAlign: 'center' }}>
                  <div style={{ fontSize: 16, fontWeight: 700, color: 'var(--accent)', background: 'var(--bg-soft)', padding: 8, borderRadius: 6 }}>{fmt(m.total)}</div>
                </td>
                <td style={{ textAlign: 'center' }}>
                  <button onClick={() => removeRow(m.id)} style={{ padding: '8px 12px', borderRadius: '6px', border: '1px solid var(--neg)', background: 'var(--neg-bg)', color: 'var(--neg)', cursor: 'pointer', fontWeight: 600 }}>حذف</button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {/* Total */}
      <div className="card" style={{ marginBottom: 16 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <div>
            <h3 style={{ margin: 0 }}>الإجمالي</h3>
            <p style={{ margin: '4px 0 0', color: 'var(--ink-3)', fontSize: 12 }}>عدد البنود: {materials.length}</p>
          </div>
          <div style={{ fontSize: 24, fontWeight: 700, color: 'var(--accent)' }} className="num">{fmt(total)} د.ك</div>
        </div>
      </div>

      {/* Buttons */}
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 8 }}>
        <button
          onClick={addRow}
          style={{ padding: '10px', borderRadius: '8px', border: 'none', background: 'var(--info-bg)', color: 'var(--info)', fontWeight: 600, cursor: 'pointer' }}
        >
          ➕ إضافة صف
        </button>
        <button
          onClick={exportExcel}
          style={{ padding: '10px', borderRadius: '8px', border: 'none', background: 'var(--pos-bg)', color: 'var(--pos)', fontWeight: 600, cursor: 'pointer' }}

          📊 تصدير Excel

        <button
          onClick={exportWord}
          style={{ padding: '10px', borderRadius: '8px', border: 'none', background: 'var(--warn-bg)', color: 'var(--warn)', fontWeight: 600, cursor: 'pointer' }}
        >
          📄 تصدير Word
        </button>
      </div>
    </div>
  );
}

      `✓ مرة واحدة كحد أقصى بالشهر\n` +
      `✓ يُسجَّل هذا الطلب برقم مرجعي وتاريخ كامل\n` +
      `✓ البيانات للاستخدام الشخصي/الاستشاري فقط\n` +

      `هل تقر بذلك وتؤكد المتابعة؟`
    );

    if (!confirmUpdate) return;

    // سجل قانوني كامل

    const isoTimestamp = now.toISOString();
    const refNumber = 'UPD-' + now.getFullYear() + String(now.getMonth()+1).padStart(2,'0') + String(now.getDate()).padStart(2,'0') + '-' + String(now.getHours()).padStart(2,'0') + String(now.getMinutes()).padStart(2,'0');

    const updateRecord = {
      ref: refNumber,
      date: displayTimestamp,
      isoDate: isoTimestamp,
      month: currentMonth,
      status: '✅ نجح',
      productsUpdated: APP_DATA.kpis.totalProducts,
      storesUpdated: APP_DATA.stores.length,
      adminId: 'admin_001',
      purpose: 'استخدام شخصي / استشاري',
      legalNote: 'تم بموافقة صريحة من الأدمن المصرح — ضمن الحد الشهري القانوني'
    };

    const newLog = [...updateLog, updateRecord];
    setLastUpdate(displayTimestamp);
    setUpdateLog(newLog);
    // ✅ نخزن الشهر ISO منفصلاً لضمان صحة التحقق
    localStorage.setItem('lastUpdateMonth', currentMonth);
    localStorage.setItem('lastDataUpdate', displayTimestamp);
    localStorage.setItem('updateLog', JSON.stringify(newLog));

    alert(`✅ تم التسجيل بنجاح\n\n` +
      `📋 الرقم المرجعي: ${refNumber}\n` +
      `📅 التاريخ: ${displayTimestamp}\n` +
      `📦 المنتجات: ${APP_DATA.kpis.totalProducts} | المتاجر: ${APP_DATA.stores.length}\n\n` +

  };

  // ✅ الوصول محمي بالكامل من AuthWrapper — هذا الـ render يظهر فقط للأدمن

    <div style={{ padding: '16px' }}>
      <h2 style={{ marginTop: 0 }}>🔐 لوحة التحكم الإدارية</h2>

      {/* Users Management */}

      {/* Data Update Section */}

        <p style={{color:'var(--ink)',fontWeight:600,marginBottom:8}}>🔐 حماية قانونية صارمة:</p>
        <div style={{background:'var(--bg)',padding:10,borderRadius:8,marginBottom:12,fontSize:12,color:'var(--ink-3)'}}>
          <p style={{margin:'4px 0'}}>✓ التحديثات مقتصرة على الأدمن فقط</p>
          <p style={{margin:'4px 0'}}>✓ مرة واحدة فقط بالشهر (لضمان الامتثال القانوني)</p>
          <p style={{margin:'4px 0'}}>✓ جميع التحديثات مسجلة برسمياً مع التواريخ والتفاصيل</p>
          <p style={{margin:'4px 0'}}>✓ محفوظة للمراجعة والتدقيق القانوني</p>
        </div>
        <p><strong>آخر تحديث:</strong> {lastUpdate}</p>

        <button
          onClick={handleDataUpdate}

          <p>• عدد المتاجر: {APP_DATA.stores.length}</p>

      </div>

      {/* Frequency Settings */}
      <div className="card" style={{ marginBottom: 16 }}>

      {/* Update Log - Legal Record */}

// ── Mind Map Screen for Engineering Cases ──────────────────────────────────
function MindMapScreen() {
  // === STATE ===
  const [plaintiff,    setPlaintiff]    = React.useState('شركة العمائر للمقاولات');
  const [defendant,    setDefendant]    = React.useState('المؤسسة العامة للكهرباء');
  const [caseNum,      setCaseNum]      = React.useState('ق.إ/2024/45');
  const [contractDate, setContractDate] = React.useState('2023-06-15');
  const [workStart,    setWorkStart]    = React.useState('2023-07-01');
  const [activeTab,    setActiveTab]    = React.useState('mindmap');
  const [customEvents, setCustomEvents] = React.useState([]);

  // === HELPERS ===
  function formatDate(s) {
    if (!s) return '';
    const [y,m,d] = s.split('-');
    return `${d}/${m}/${y}`;
  }
  function daysBetween(a, b) {
    if (!a || !b) return '-';
    return Math.floor(Math.abs(new Date(b) - new Date(a)) / 86400000);
  }
  function impFromType(type) {
    if (['عقد','نزاع'].some(w => type.includes(w)))    return { level:'حرج',        color:'#cc2222', bg:'#fff0f0' };
    if (['معاينة','فحص'].some(w => type.includes(w)))  return { level:'عالي جداً',  color:'#2244cc', bg:'#f0f0ff' };
    if (['دفعة','بدء'].some(w => type.includes(w)))    return { level:'عالي',        color:'#227722', bg:'#f0fff0' };
    return { level:'متوسط', color:'#888888', bg:'#f8f8f8' };
  }

  // Custom events CRUD
  function addCustom() { setCustomEvents(prev => [...prev, { id: Date.now(), date:'', label:'', type:'دفعة' }]); }
  function removeCustom(id) { setCustomEvents(prev => prev.filter(e => e.id !== id)); }
  function updateCustom(id, field, val) { setCustomEvents(prev => prev.map(e => e.id === id ? {...e,[field]:val} : e)); }

  // === ALL EVENTS (built-in + custom, sorted by date) ===
  const builtIn = [
    { date: contractDate, label: 'إبرام العقد',        type: 'عقد'     },
    { date: workStart,    label: 'بدء الأعمال',         type: 'بدء'    },
  ];
  const allEvents = [...builtIn, ...customEvents.filter(e => e.date && e.label)]
    .filter(e => e.date)
    .sort((a,b) => new Date(a.date) - new Date(b.date))
    .map((e, idx, arr) => ({
      ...e,
      order: idx + 1,
      daysFromPrev: idx === 0 ? '-' : daysBetween(arr[idx-1].date, e.date),
      imp: impFromType(e.type)
    }));

  // === WORD EXPORT ===
  function exportWord() {
    const rows = allEvents.map(e =>
      `<tr style="background:${e.imp.bg}">
         <td align="center" style="border:1px solid #ccc;padding:7px">${e.order}</td>
         <td align="center" style="border:1px solid #ccc;padding:7px;font-weight:bold">${formatDate(e.date)}</td>
         <td align="right"  style="border:1px solid #ccc;padding:7px">${e.label}</td>
         <td align="center" style="border:1px solid #ccc;padding:7px">${e.daysFromPrev}</td>
         <td align="center" style="border:1px solid #ccc;padding:7px;color:${e.imp.color};font-weight:bold">${e.imp.level}</td>
       </tr>`
    ).join('');
    const html = `<html xmlns:o='urn:schemas-microsoft-com:office:office'
      xmlns:w='urn:schemas-microsoft-com:office:word'
      xmlns='http://www.w3.org/TR/REC-html40'>
      <head>
        <meta charset='utf-8'>
        <xml><w:WordDocument><w:View>Print</w:View></w:WordDocument></xml>
        <style>
          body{font-family:Arial,sans-serif;direction:rtl;padding:24px;font-size:11pt}
          h1{font-size:16pt;margin-bottom:8px}
          p{margin:3px 0}
          table{width:100%;border-collapse:collapse;margin-top:18px}
          th{background:#1a1a1a;color:#fff;border:1px solid #555;padding:8px;text-align:center}
          td{font-size:10.5pt}
        </style>
      </head>
      <body dir="rtl">
        <h1>📋 جدول الأحداث الزمنية للقضية</h1>
        <p><strong>رقم القضية:</strong> ${caseNum}</p>
        <p><strong>المدعي:</strong> ${plaintiff}</p>
        <p><strong>المدعى عليه:</strong> ${defendant}</p>
        <br>
        <table>
          <thead>
            <tr>
              <th>الترتيب</th><th>التاريخ</th><th>الحدث</th>
              <th>المدة (أيام)</th><th>الأهمية</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </body>
    </html>`;
    const blob = new Blob(['﻿'+html], {type:'application/msword'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'تقرير-'+caseNum.replace(/\//g,'-')+'.doc';
    a.click();
  }

  // === SHARED STYLES ===
  const inpStyle = {
    width:'100%', padding:'7px 8px',
    border:'1px solid var(--line)', borderRadius:'4px',
    boxSizing:'border-box', fontFamily:'inherit',
    direction:'rtl', backgroundColor:'var(--surface)', color:'var(--ink)'
  };
  function tabBtn(id, label) {
    const active = activeTab === id;
    return (
      <button onClick={() => setActiveTab(id)} style={{
        padding:'7px 14px',
        backgroundColor: active ? 'var(--ink)' : 'var(--surface)',
        color: active ? 'var(--bg)' : 'var(--ink)',
        border: `2px solid ${active ? 'var(--ink)' : 'var(--line)'}`,
        borderRadius:'4px', cursor:'pointer',
        fontFamily:'inherit', fontWeight:'bold', fontSize:'0.88em'
      }}>{label}</button>
    );
  }

  // === RENDER ===
  return (
    <div style={{ padding:'16px' }}>
      <h2 style={{ marginTop:0, marginBottom:'14px' }}>🗺️ الخريطة الذهنية لإدارة القضايا</h2>

      {/* ── Main inputs ── */}
      <div style={{
        display:'grid', gridTemplateColumns:'1fr 1fr', gap:'10px',
        marginBottom:'10px', padding:'14px',
        backgroundColor:'var(--surface)', borderRadius:'8px', border:'1px solid var(--line)'
      }}>
        <div>
          <label style={{display:'block',marginBottom:'3px',fontSize:'0.83em',color:'var(--ink-3)'}}>المدعي</label>
          <input type="text" value={plaintiff} onChange={e=>setPlaintiff(e.target.value)} style={inpStyle}/>
        </div>
        <div>
          <label style={{display:'block',marginBottom:'3px',fontSize:'0.83em',color:'var(--ink-3)'}}>المدعى عليه</label>
          <input type="text" value={defendant} onChange={e=>setDefendant(e.target.value)} style={inpStyle}/>
        </div>
        <div style={{gridColumn:'1/-1'}}>
          <label style={{display:'block',marginBottom:'3px',fontSize:'0.83em',color:'var(--ink-3)'}}>رقم القضية</label>
          <input type="text" value={caseNum} onChange={e=>setCaseNum(e.target.value)} style={inpStyle}/>
        </div>
        <div>
          <label style={{display:'block',marginBottom:'3px',fontSize:'0.83em',color:'var(--ink-3)'}}>إبرام العقد</label>
          <input type="date" value={contractDate} onChange={e=>setContractDate(e.target.value)} style={inpStyle}/>
        </div>
        <div>
          <label style={{display:'block',marginBottom:'3px',fontSize:'0.83em',color:'var(--ink-3)'}}>بدء الأعمال</label>
          <input type="date" value={workStart} onChange={e=>setWorkStart(e.target.value)} style={inpStyle}/>
        </div>
      </div>

      {/* ── Custom events (compact rows) ── */}
      {customEvents.length > 0 && (
        <div style={{
          marginBottom:'8px', padding:'8px 12px',
          backgroundColor:'var(--bg-soft)', borderRadius:'6px', border:'1px solid var(--line)'
        }}>
          <div style={{fontSize:'0.78em',color:'var(--ink-3)',marginBottom:'6px',fontWeight:'bold'}}>
            📌 أحداث إضافية ({customEvents.length})
          </div>
          {customEvents.map(ev => (
            <div key={ev.id} style={{display:'flex',gap:'6px',marginBottom:'5px',alignItems:'center'}}>
              <input type="date" value={ev.date}
                onChange={e=>updateCustom(ev.id,'date',e.target.value)}
                style={{...inpStyle,width:'138px',padding:'4px 6px',fontSize:'0.82em'}}/>
              <input type="text" value={ev.label} placeholder="وصف الحدث..."
                onChange={e=>updateCustom(ev.id,'label',e.target.value)}
                style={{...inpStyle,flex:1,padding:'4px 8px',fontSize:'0.82em'}}/>
              <select value={ev.type} onChange={e=>updateCustom(ev.id,'type',e.target.value)}
                style={{...inpStyle,width:'110px',padding:'4px 6px',fontSize:'0.82em'}}>
                <option value="عقد">🔴 حرج</option>
                <option value="معاينة">🔵 عالي جداً</option>
                <option value="دفعة">🟢 عالي</option>
                <option value="__">⚪ متوسط</option>
              </select>
              <button onClick={()=>removeCustom(ev.id)} style={{
                padding:'4px 8px',border:'1px solid var(--line)',
                backgroundColor:'var(--surface)',color:'var(--ink)',
                borderRadius:'4px',cursor:'pointer',fontSize:'0.9em'
              }}>🗑</button>
            </div>
          ))}
        </div>
      )}

      {/* ── Action bar: add event | tabs | export ── */}
      <div style={{display:'flex',gap:'8px',marginBottom:'12px',flexWrap:'wrap',alignItems:'center'}}>
        <button onClick={addCustom} style={{
          padding:'7px 12px', backgroundColor:'var(--surface)', color:'var(--ink)',
          border:'1.5px dashed var(--line-strong)', borderRadius:'4px',
          cursor:'pointer', fontFamily:'inherit', fontSize:'0.85em'
        }}>➕ إضافة حدث</button>
        <div style={{width:'1px',height:'22px',backgroundColor:'var(--line)',margin:'0 2px'}}/>
        {tabBtn('mindmap',  '🧠 الخريطة الذهنية')}
        {tabBtn('timeline', '📊 جدول الأحداث')}
        <button onClick={exportWord} style={{
          padding:'7px 14px', backgroundColor:'#1a6b3c', color:'white',
          border:'none', borderRadius:'4px', cursor:'pointer',
          fontFamily:'inherit', fontWeight:'bold', fontSize:'0.88em'
        }}>📄 تصدير Word</button>
      </div>

      {/* ── Mind Map view ── */}
      {activeTab === 'mindmap' && (
        <div style={{
          border:'2px solid var(--line)', borderRadius:'8px', padding:'20px',
          backgroundColor:'var(--surface)', minHeight:'320px',
          display:'flex', flexDirection:'column', alignItems:'center', gap:'18px'
        }}>
          <div style={{fontSize:'1.1em',fontWeight:'bold',color:'var(--ink)',textAlign:'center'}}>
            🎯 {caseNum}
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'14px',width:'100%',maxWidth:'760px'}}>
            <div style={{padding:'12px',border:'1px solid var(--line)',borderRadius:'6px',backgroundColor:'var(--bg)'}}>
              <div style={{fontWeight:'bold',marginBottom:'6px',color:'var(--ink-2)'}}>👥 أطراف الدعوى</div>
              <div style={{fontSize:'0.88em',lineHeight:'1.7'}}>
                <div><strong>المدعي:</strong> {plaintiff}</div>
                <div><strong>المدعى عليه:</strong> {defendant}</div>
              </div>
            </div>
            <div style={{padding:'12px',border:'1px solid var(--line)',borderRadius:'6px',backgroundColor:'var(--bg)'}}>
              <div style={{fontWeight:'bold',marginBottom:'6px',color:'var(--ink-2)'}}>📅 التواريخ الحاسمة</div>
              <div style={{fontSize:'0.82em',lineHeight:'1.75'}}>
                {allEvents.slice(0,4).map(e => (
                  <div key={e.label+e.date}>
                    <span style={{color:e.imp.color}}>●</span> {e.label}: {formatDate(e.date)}

              <div style={{fontWeight:'bold',marginBottom:'6px',color:'var(--ink-2)'}}>✅ الالتزامات</div>

            </div>
            <div style={{padding:'12px',border:'1px solid var(--line)',borderRadius:'6px',backgroundColor:'var(--bg)'}}>
              <div style={{fontWeight:'bold',marginBottom:'6px',color:'var(--ink-2)'}}>📋 نطاق العقد</div>
              <div style={{fontSize:'0.88em',lineHeight:'1.7'}}>
                <div>• جداول الكميات</div>
                <div>• المواصفات الفنية</div>
                <div>• معايير الجودة</div>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* ── Timeline table ── */}
      {activeTab === 'timeline' && (
        <div style={{overflowX:'auto'}}>
          <table style={{width:'100%',borderCollapse:'collapse',border:'2px solid var(--line)'}}>
            <thead>
              <tr style={{backgroundColor:'var(--ink)',color:'var(--bg)'}}>
                <th style={{padding:'9px 10px',textAlign:'center',borderRight:'1px solid var(--line-strong)'}}>الترتيب</th>
                <th style={{padding:'9px 10px',textAlign:'center',borderRight:'1px solid var(--line-strong)'}}>التاريخ</th>
                <th style={{padding:'9px 10px',textAlign:'right', borderRight:'1px solid var(--line-strong)'}}>الحدث</th>
                <th style={{padding:'9px 10px',textAlign:'center',borderRight:'1px solid var(--line-strong)'}}>المدة (أيام)</th>
                <th style={{padding:'9px 10px',textAlign:'center'}}>الأهمية</th>
              </tr>
            </thead>
            <tbody>
              {allEvents.map((evt,idx) => (
                <tr key={idx} style={{backgroundColor:evt.imp.bg,borderBottom:'1px solid var(--line)'}}>
                  <td style={{padding:'7px 8px',textAlign:'center',borderRight:'1px solid var(--line)'}}>{evt.order}</td>
                  <td style={{padding:'7px 8px',textAlign:'center',borderRight:'1px solid var(--line)',fontWeight:'bold'}}>{formatDate(evt.date)}</td>
                  <td style={{padding:'7px 8px',textAlign:'right', borderRight:'1px solid var(--line)'}}>{evt.label}</td>
                  <td style={{padding:'7px 8px',textAlign:'center',borderRight:'1px solid var(--line)'}}>{evt.daysFromPrev}</td>
                  <td style={{padding:'7px 8px',textAlign:'center',color:evt.imp.color,fontWeight:'bold'}}>{evt.imp.level}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

// ── Penalty Calculator Screen ────────────────────────────────────────────────
function CalculatorScreen() {
  const [tab, setTab]           = React.useState('contract');
  // contract
  const [cn, setCn]             = React.useState('');
  const [cv, setCv]             = React.useState('');
  const [cc, setCc]             = React.useState('');
  const [ccon, setCcon]         = React.useState('');
  const [ctype, setCtype]       = React.useState('سكني');
  const [endDate, setEndDate]   = React.useState('');
  // penalty config
  const [enDelay, setEnDelay]   = React.useState(true);
  const [delayMode, setDelayMode] = React.useState('percentage'); // 'percentage' or 'fixed'
  const [rate, setRate]         = React.useState('0.1');
  const [capP, setCapP]         = React.useState('10');
  const [dailyPenalty, setDailyPenalty] = React.useState('');
  const [enQuality, setEnQuality] = React.useState(true);
  // delay & defects
  const [actualDate, setActualDate] = React.useState('');
  const [manDays, setManDays]   = React.useState('');
  const [defects, setDefects]   = React.useState([]);
  // settlement
  const [earned, setEarned]     = React.useState('');
  const [retention, setRet]     = React.useState('');
  const [advance, setAdv]       = React.useState('');
  const [otherDed, setOther]    = React.useState('');
  const [vars, setVars]         = React.useState('0');
  // results
  const [res, setRes]           = React.useState(null);

  const inp = { width:'100%', padding:'8px 10px', borderRadius:8, border:'1px solid var(--line)', background:'var(--bg)', color:'var(--ink)', fontSize:14, fontFamily:'inherit', boxSizing:'border-box' };
  const lbl = { display:'block', fontSize:12, color:'var(--ink-3)', marginBottom:4 };
  const row = { marginBottom:14 };

  function delayDays() {
    if (actualDate && endDate) return Math.max(0, Math.round((new Date(actualDate) - new Date(endDate)) / 86400000));
    return Math.max(0, parseInt(manDays) || 0);
  }

  function buildReport(r) {
    return [
      '═══════════════════════════════════════════',
      '   تقرير تقييم غرامات العقد الهندسي',
      '═══════════════════════════════════════════',
      'العقد:           ' + (r.cn || 'غير محدد'),
      'قيمة العقد:      ' + fmt(r.cv) + ' د.ك',
      'العميل:          ' + (r.cc || 'غير محدد'),
      'المقاول:         ' + (r.ccon || 'غير محدد'),
      'النوع:           ' + r.ctype,
      '───────────────────────────────────────────',
      'أيام التأخير:    ' + r.days + ' يوم',
      'غرامة التأخير:   ' + fmt(r.dFin) + ' د.ك',
      'غرامة الجودة:    ' + fmt(r.qTot) + ' د.ك',
      'إجمالي الغرامات: ' + fmt(r.totPen) + ' د.ك',
      '───────────────────────────────────────────',
      'المستحقات:       ' + fmt(r.earn) + ' د.ك',
      'الخصومات:        ' + fmt(r.totDed) + ' د.ك',
      'التغييرات:       ' + fmt(r.varsV) + ' د.ك',
      '───────────────────────────────────────────',
      'الرصيد النهائي:  ' + fmt(r.balance) + ' د.ك',
      'الحالة:          ' + (r.pos ? 'إيجابي ✅' : 'سالب 🔴'),
      '───────────────────────────────────────────',
      'تاريخ التقرير:   ' + new Date().toLocaleDateString('ar-KW'),
      'النظام:          حاسبة الغرامات الهندسية',
      '═══════════════════════════════════════════',
    ].join('\n');
  }

  function doCalc() {
    const value = parseFloat(cv) || 0;
    if (!value) { alert('الرجاء إدخال قيمة العقد'); setTab('contract'); return; }
    const days = delayDays();
    const mults = { simple:0.5, medium:1.0, critical:2.0 };
    const sevLbl = { simple:'بسيط', medium:'متوسط', critical:'خطير' };

    // delay
    let dGross=0, dFin=0, dCap=0;
    if (enDelay && days > 0) {
      if (delayMode === 'percentage') {
        dGross = value * (parseFloat(rate)||0) / 100 * days;
        dFin = dGross;
        const capAmt = value * (parseFloat(capP)||0) / 100;
        if (capAmt > 0 && dGross > capAmt) { dCap = dGross - capAmt; dFin = capAmt; }
      } else if (delayMode === 'fixed') {
        dGross = (parseFloat(dailyPenalty)||0) * days;
        dFin = dGross;
      }
    }

    // quality
    let qTot=0;
    const dds = enQuality ? defects.map(d => {
      const dp = value * 0.01 * (mults[d.sev]||1) * (parseInt(d.qty)||1);
      qTot += dp;
      return { ...d, pen: Math.round(dp*100)/100, sevL: sevLbl[d.sev] };
    }) : [];

    const totPen  = Math.round((dFin + qTot)*100)/100;
    const earn    = earned !== '' ? (parseFloat(earned) || 0) : value;
    const totDed  = (parseFloat(retention)||0) + (parseFloat(advance)||0) + (parseFloat(otherDed)||0);
    const varsV   = parseFloat(vars)||0;
    const balance = Math.round((earn - totDed - totPen + varsV)*100)/100;

    const r = {
      cn, cv:value, cc, ccon, ctype,
      days, delayMode, dailyPenaltyValue: delayMode==='fixed' ? parseFloat(dailyPenalty)||0 : null,
      dGross:Math.round(dGross*100)/100, dCap:Math.round(dCap*100)/100, dFin:Math.round(dFin*100)/100,
      qTot:Math.round(qTot*100)/100, dds,
      totPen, earn, totDed:Math.round(totDed*100)/100,
      dedBreak: [
        retention ? {l:'ضمان حسن التنفيذ', v:parseFloat(retention)} : null,
        advance   ? {l:'استرداد الدفعة المقدمة', v:parseFloat(advance)} : null,
        otherDed  ? {l:'خصومات أخرى', v:parseFloat(otherDed)} : null,
      ].filter(Boolean),
      varsV, balance, pos: balance >= 0
    };
    r.report = buildReport(r);
    setRes(r);
    setTab('results');
  }

  function addDef()          { setDefects(p => [...p, {id:Date.now(), desc:'', sev:'medium', qty:'1'}]); }
  function remDef(id)        { setDefects(p => p.filter(d => d.id !== id)); }
  function updDef(id, k, v)  { setDefects(p => p.map(d => d.id===id ? {...d,[k]:v} : d)); }

  const TABS = [{id:'contract',l:'📋 العقد'},{id:'penalties',l:'⚙️ الغرامات'},{id:'defects',l:'⏱ التأخير'},{id:'settlement',l:'💰 التصفية'}];

  return (
    <div style={{padding:16}}>
      <h2 style={{marginTop:0}}>🧮 حاسبة الغرامات الهندسية</h2>

      {/* Tab bar */}
      <div style={{display:'flex',gap:4,marginBottom:16,flexWrap:'wrap'}}>
        {[...TABS, ...(res?[{id:'results',l:'📊 النتائج'}]:[])].map(t => (
          <button key={t.id} onClick={()=>setTab(t.id)} style={{
            padding:'6px 11px', borderRadius:20, fontSize:11, fontFamily:'inherit',
            border:'none', cursor:'pointer',
            background: tab===t.id ? 'var(--accent)' : 'var(--bg-soft)',
            color: tab===t.id ? 'var(--bg)' : 'var(--ink-3)',
            fontWeight: tab===t.id ? 700 : 400
          }}>{t.l}</button>
        ))}
      </div>

      {/* ── Contract ── */}
      {tab==='contract' && (
        <div className="card">
          <h3 style={{marginTop:0}}>📋 بيانات العقد</h3>
          <div style={row}><label style={lbl}>اسم العقد / المشروع</label><input style={inp} value={cn} onChange={e=>setCn(e.target.value)} placeholder="مثال: عقد بناء فيلا سكنية"/></div>
          <div style={row}><label style={lbl}>قيمة العقد (د.ك) *</label><input style={inp} type="number" value={cv} onChange={e=>setCv(e.target.value)} placeholder="100000"/></div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:14}}>
            <div><label style={lbl}>العميل</label><input style={inp} value={cc} onChange={e=>setCc(e.target.value)} placeholder="جهة العميل"/></div>
            <div><label style={lbl}>المقاول</label><input style={inp} value={ccon} onChange={e=>setCcon(e.target.value)} placeholder="شركة المقاول"/></div>
          </div>
          <div style={row}><label style={lbl}>نوع المشروع</label>
            <select style={inp} value={ctype} onChange={e=>setCtype(e.target.value)}>
              {['سكني','تجاري','صناعي','بنية تحتية','خدمي'].map(t=><option key={t}>{t}</option>)}
            </select>
          </div>
          <div style={row}><label style={lbl}>تاريخ انتهاء العقد المتفق عليه</label><input style={inp} type="date" value={endDate} onChange={e=>setEndDate(e.target.value)}/></div>
          <button onClick={()=>setTab('penalties')} style={{width:'100%',padding:'10px',borderRadius:8,border:'none',background:'var(--accent)',color:'var(--bg)',fontWeight:600,cursor:'pointer',fontFamily:'inherit'}}>التالي: إعدادات الغرامات ←</button>
        </div>
      )}

      {/* ── Penalties config ── */}
      {tab==='penalties' && (
        <div className="card">
          <h3 style={{marginTop:0}}>⚙️ إعدادات الغرامات</h3>
          <div style={{padding:12,background:'var(--info-bg)',borderRadius:8,marginBottom:12}}>
            <label style={{display:'flex',alignItems:'center',gap:8,cursor:'pointer',fontWeight:600,marginBottom:enDelay?10:0}}>
              <input type="checkbox" checked={enDelay} onChange={e=>setEnDelay(e.target.checked)}/> تفعيل غرامة التأخير
            </label>
            {enDelay && (<>
              <div style={{marginBottom:12,padding:10,background:'white',borderRadius:6,border:'1px solid var(--line)'}}>
                <div style={{fontSize:12,fontWeight:600,marginBottom:8}}>اختر نوع الغرامة:</div>
                <div style={{display:'flex',gap:16}}>
                  <label style={{display:'flex',alignItems:'center',gap:6,cursor:'pointer',fontSize:14}}>
                    <input type="radio" name="delayPenaltyMode" value="percentage" checked={delayMode==='percentage'} onChange={e=>setDelayMode('percentage')}/>
                    النسبة المئوية
                  </label>
                  <label style={{display:'flex',alignItems:'center',gap:6,cursor:'pointer',fontSize:14}}>
                    <input type="radio" name="delayPenaltyMode" value="fixed" checked={delayMode==='fixed'} onChange={e=>setDelayMode('fixed')}/>
                    غرامة يومية ثابتة
                  </label>
                </div>
              </div>

              {delayMode==='percentage' ? (
                <>
                  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
                    <div><label style={lbl}>النسبة اليومية (%)</label><input style={inp} type="number" step="0.01" value={rate} onChange={e=>setRate(e.target.value)}/></div>
                    <div><label style={lbl}>الحد الأقصى (% من العقد)</label><input style={inp} type="number" step="0.5" value={capP} onChange={e=>setCapP(e.target.value)}/></div>
                  </div>
                  <div style={{marginTop:8,fontSize:11,color:'var(--ink-3)'}}>الصيغة: قيمة العقد × {rate||'0.1'}% × الأيام، الحد الأقصى {capP||'10'}%</div>
                </>
              ) : (
                <>
                  <div><label style={lbl}>الغرامة اليومية (د.ك)</label><input style={inp} type="number" step="0.01" value={dailyPenalty} onChange={e=>setDailyPenalty(e.target.value)} placeholder="مثال: 50"/></div>
                  <div style={{marginTop:8,fontSize:11,color:'var(--ink-3)'}}>الصيغة: {dailyPenalty||'0'} د.ك × الأيام</div>
                </>
              )}
            </>)}
          </div>
          <div style={{padding:12,background:'var(--warn-bg)',borderRadius:8}}>
            <label style={{display:'flex',alignItems:'center',gap:8,cursor:'pointer',fontWeight:600}}>
              <input type="checkbox" checked={enQuality} onChange={e=>setEnQuality(e.target.checked)}/> تفعيل غرامة الجودة والعيوب
            </label>
            {enQuality && (
              <div style={{marginTop:8,fontSize:11,color:'var(--ink-3)',lineHeight:1.9}}>
                • بسيط: قيمة العقد × 0.5% × الكمية<br/>
                • متوسط: قيمة العقد × 1% × الكمية<br/>
                • خطير: قيمة العقد × 2% × الكمية
              </div>
            )}
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginTop:14}}>
            <button onClick={()=>setTab('contract')} style={{padding:'10px',borderRadius:8,border:'1px solid var(--line)',background:'transparent',color:'var(--ink-3)',cursor:'pointer',fontFamily:'inherit'}}>→ السابق</button>
            <button onClick={()=>setTab('defects')}  style={{padding:'10px',borderRadius:8,border:'none',background:'var(--accent)',color:'var(--bg)',fontWeight:600,cursor:'pointer',fontFamily:'inherit'}}>التالي ←</button>
          </div>
        </div>
      )}

      {/* ── Delay & Defects ── */}
      {tab==='defects' && (
        <div>
          {enDelay && (
            <div className="card" style={{marginBottom:12}}>
              <h3 style={{marginTop:0}}>⏱ التأخير</h3>
              <div style={row}><label style={lbl}>تاريخ الانتهاء الفعلي</label><input style={inp} type="date" value={actualDate} onChange={e=>{setActualDate(e.target.value);setManDays('');}}/></div>
              <div style={row}><label style={lbl}>أو أدخل عدد أيام التأخير يدوياً</label><input style={inp} type="number" value={manDays} onChange={e=>{setManDays(e.target.value);setActualDate('');}} placeholder="0"/></div>
              {(actualDate||manDays) && <div style={{padding:10,background:'var(--neg-bg)',borderRadius:8,color:'var(--neg)',fontWeight:700,textAlign:'center'}}>⏱ أيام التأخير: {delayDays()} يوم</div>}
            </div>
          )}
          {enQuality && (
            <div className="card">
              <h3 style={{marginTop:0}}>🔍 العيوب المكتشفة</h3>
              {defects.map((d,i) => (
                <div key={d.id} style={{padding:10,background:'var(--bg-soft)',borderRadius:8,marginBottom:8,border:'1px solid var(--line)'}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
                    <span style={{fontSize:12,fontWeight:600,color:'var(--ink-3)'}}>عيب #{i+1}</span>
                    <button onClick={()=>remDef(d.id)} style={{background:'var(--neg-bg)',color:'var(--neg)',border:'none',borderRadius:6,padding:'2px 10px',cursor:'pointer',fontSize:12,fontFamily:'inherit'}}>حذف</button>
                  </div>
                  <div style={{marginBottom:8}}><input style={inp} value={d.desc} onChange={e=>updDef(d.id,'desc',e.target.value)} placeholder="وصف العيب"/></div>
                  <div style={{display:'grid',gridTemplateColumns:'2fr 1fr',gap:8}}>
                    <div><label style={lbl}>درجة الشدة</label>
                      <select style={inp} value={d.sev} onChange={e=>updDef(d.id,'sev',e.target.value)}>
                        <option value="simple">بسيط (×0.5)</option>
                        <option value="medium">متوسط (×1.0)</option>
                        <option value="critical">خطير (×2.0)</option>
                      </select>
                    </div>
                    <div><label style={lbl}>الكمية</label><input style={inp} type="number" min="1" value={d.qty} onChange={e=>updDef(d.id,'qty',e.target.value)}/></div>
                  </div>
                </div>
              ))}
              <button onClick={addDef} style={{width:'100%',padding:'8px',borderRadius:8,border:'2px dashed var(--line)',background:'transparent',color:'var(--ink-3)',cursor:'pointer',fontFamily:'inherit'}}>+ إضافة عيب</button>
            </div>
          )}
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginTop:12}}>
            <button onClick={()=>setTab('penalties')} style={{padding:'10px',borderRadius:8,border:'1px solid var(--line)',background:'transparent',color:'var(--ink-3)',cursor:'pointer',fontFamily:'inherit'}}>→ السابق</button>
            <button onClick={()=>setTab('settlement')} style={{padding:'10px',borderRadius:8,border:'none',background:'var(--accent)',color:'var(--bg)',fontWeight:600,cursor:'pointer',fontFamily:'inherit'}}>التالي ←</button>
          </div>
        </div>
      )}

      {/* ── Settlement ── */}
      {tab==='settlement' && (
        <div className="card">
          <h3 style={{marginTop:0}}>💰 التصفية والمستحقات</h3>
          <div style={row}><label style={lbl}>إجمالي المستحقات المكتسبة (د.ك)</label><input style={inp} type="number" value={earned} onChange={e=>setEarned(e.target.value)} placeholder={cv||'100000'}/></div>
          <h4 style={{color:'var(--ink-2)',margin:'0 0 10px'}}>الخصومات</h4>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:14}}>
            <div><label style={lbl}>ضمان حسن التنفيذ (د.ك)</label><input style={inp} type="number" value={retention} onChange={e=>setRet(e.target.value)} placeholder="0"/></div>
            <div><label style={lbl}>استرداد الدفعة المقدمة (د.ك)</label><input style={inp} type="number" value={advance} onChange={e=>setAdv(e.target.value)} placeholder="0"/></div>
          </div>
          <div style={row}><label style={lbl}>خصومات أخرى (د.ك)</label><input style={inp} type="number" value={otherDed} onChange={e=>setOther(e.target.value)} placeholder="0"/></div>
          <div style={row}><label style={lbl}>أوامر التغيير (+إضافة / -خصم)</label><input style={inp} type="number" value={vars} onChange={e=>setVars(e.target.value)} placeholder="0"/></div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginTop:8}}>
            <button onClick={()=>setTab('defects')} style={{padding:'10px',borderRadius:8,border:'1px solid var(--line)',background:'transparent',color:'var(--ink-3)',cursor:'pointer',fontFamily:'inherit'}}>→ السابق</button>
            <button onClick={doCalc} style={{padding:'11px',borderRadius:8,border:'none',background:'var(--pos)',color:'white',fontWeight:700,cursor:'pointer',fontFamily:'inherit',fontSize:14}}>🧮 احسب الآن</button>
          </div>
        </div>
      )}

      {/* ── Results ── */}
      {tab==='results' && res && (
        <div>
          <div style={{padding:16,borderRadius:12,background:res.pos?'var(--pos-bg)':'var(--neg-bg)',border:`1px solid ${res.pos?'var(--pos)':'var(--neg)'}`,marginBottom:14,textAlign:'center'}}>
            <div style={{fontSize:11,color:res.pos?'var(--pos)':'var(--neg)',marginBottom:4}}>الرصيد النهائي</div>
            <div style={{fontSize:28,fontWeight:800,color:res.pos?'var(--pos)':'var(--neg)'}}>{fmt(Math.abs(res.balance))} د.ك</div>
            <div style={{fontSize:12,marginTop:4,color:res.pos?'var(--pos)':'var(--neg)'}}>{res.pos?'✅ مستحقات إيجابية':'🔴 رصيد سالب — توجد مديونية'}</div>
          </div>

          {/* Penalty breakdown */}
          <div className="card" style={{marginBottom:14}}>
            <h3 style={{marginTop:0}}>📊 تفاصيل الغرامات</h3>
            {res.days > 0 && (
              <div style={{marginBottom:10,padding:10,background:'var(--bg-soft)',borderRadius:8}}>
                <div style={{fontWeight:600,marginBottom:6,fontSize:13}}>⏱ غرامة التأخير</div>
                {[
                  ['عدد الأيام', res.days + ' يوم'],
                  ['الغرامة الإجمالية', fmt(res.dGross) + ' د.ك'],
                  ...(res.dCap>0 ? [['الحد الأقصى المطبق', '- ' + fmt(res.dCap) + ' د.ك']] : []),
                  ['الغرامة النهائية', fmt(res.dFin) + ' د.ك'],
                ].map(([k,v],i) => (
                  <div key={i} style={{display:'flex',justifyContent:'space-between',fontSize:12,color:'var(--ink-3)',padding:'2px 0'}}>
                    <span>{k}</span><strong style={{color:i===([['عدد الأيام',''],[''],['',...(res.dCap>0?[['']]:[])]].length-1)?'var(--neg)':'var(--ink)'}}>{v}</strong>
                  </div>
                ))}
              </div>
            )}
            {res.dds.length > 0 && (
              <div style={{padding:10,background:'var(--bg-soft)',borderRadius:8,marginBottom:10}}>
                <div style={{fontWeight:600,marginBottom:6,fontSize:13}}>🔍 غرامة الجودة</div>
                {res.dds.map((d,i) => (
                  <div key={i} style={{display:'flex',justifyContent:'space-between',fontSize:12,color:'var(--ink-3)',padding:'3px 0',borderBottom:'1px solid var(--line)'}}>

          <div className="card" style={{marginBottom:14}}>
            <h3 style={{marginTop:0}}>💰 ملخص التصفية</h3>
            {[
              {l:'إجمالي المستحقات', v:res.earn,     c:'var(--pos)', sign:'+'},
              {l:'إجمالي الخصومات', v:res.totDed,   c:'var(--warn)',sign:'-'},

            <div style={{display:'flex',justifyContent:'space-between',padding:'10px 0',fontWeight:800,fontSize:15}}>
              <span>الرصيد النهائي</span>
              <span style={{color:res.pos?'var(--pos)':'var(--neg)'}}>{res.balance>=0?'':'-'} {fmt(Math.abs(res.balance))} د.ك</span>
            </div>

          {/* Printable report */}
          <div className="card">
            <h3 style={{marginTop:0}}>📄 التقرير الرسمي</h3>
            <pre id="calc-report" style={{fontFamily:'inherit',fontSize:11,lineHeight:1.8,whiteSpace:'pre-wrap',wordBreak:'break-word',background:'var(--bg-soft)',padding:12,borderRadius:8,color:'var(--ink-2)',maxHeight:360,overflowY:'auto',margin:0}}>{res.report}</pre>
            <button onClick={()=>{const el=document.getElementById('calc-report');if(el&&navigator.clipboard)navigator.clipboard.writeText(el.innerText).then(()=>alert('✅ تم نسخ التقرير!'));}} style={{width:'100%',marginTop:8,padding:'9px',borderRadius:8,border:'1px solid var(--line)',background:'transparent',color:'var(--ink-3)',cursor:'pointer',fontFamily:'inherit'}}>📋 نسخ التقرير</button>
          </div>

          <button onClick={()=>{setTab('contract');setRes(null);}} style={{width:'100%',marginTop:12,padding:'10px',borderRadius:8,border:'1px solid var(--line)',background:'transparent',color:'var(--ink-3)',cursor:'pointer',fontFamily:'inherit'}}>🔄 حساب جديد</button>
        </div>
      )}
    </div>
  );
}

function SourceChatScreen() {
  var [sources,       setSources]       = React.useState([]);
  var [activeId,      setActiveId]      = React.useState(null);
  var [messages,      setMessages]      = React.useState([
    { id: 1, role: 'assistant', text: 'مرحباً! 🗂️\n\n① ارفع مستنداتك (PDF أو ملف نصي)\n② اسألني أي سؤال\n③ سأجيبك من واقع ما في المستند فقط\n\nابدأ بالضغط على زر "＋ رفع مصدر" 👆' }
  ]);
  var [input,         setInput]         = React.useState('');
  var [pdfReady,      setPdfReady]      = React.useState(false);
  var msgEndRef   = React.useRef(null);
  var fileInputRef = React.useRef(null);
  var sourcesRef  = React.useRef(sources);
  React.useEffect(function() { sourcesRef.current = sources; }, [sources]);

  // Load PDF.js once
  React.useEffect(function() {
    if (window.pdfjsLib) { setPdfReady(true); return; }
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js';
    s.onload = function() {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
      setPdfReady(true);
    };
    document.head.appendChild(s);
  }, []);

  React.useEffect(function() {
    if (msgEndRef.current) msgEndRef.current.scrollIntoView({ behavior: 'smooth' });
  }, [messages]);

  // ── استخراج بيانات ذكي من النص ──────────────────────────────────
  function extractKeyData(text) {
    var r = {};
    var vals = text.match(/[\d,\.]+\s*(دينار كويتي|دينار|KD|KWD|د\.ك)/gi);
    if (vals && vals.length) r.values = vals.slice(0, 5);
    var dates = text.match(/\d{1,2}[\/\-\.]\d{1,2}[\/\-\.]\d{2,4}/g);
    if (dates && dates.length) r.dates = dates.slice(0, 5);
    var penalties = text.match(/غرامة[^\n،.]{0,120}/gi);
    if (penalties && penalties.length) r.penalties = penalties.slice(0, 3);
    var qtys = text.match(/\d+[\d,\.]*\s*(متر مربع|متر طولي|م²|م٢|م3|قطعة|وحدة|طن|كجم|لفة)/gi);
    if (qtys && qtys.length) r.quantities = qtys.slice(0, 5);
    var contractors = text.match(/المقاول\s*[:\-]\s*([^\n،.]{3,50})/gi);
    if (contractors && contractors.length) r.contractors = contractors.slice(0, 2);
    var projects = text.match(/المشروع\s*[:\-]\s*([^\n،.]{3,80})/gi);
    if (projects && projects.length) r.projects = projects.slice(0, 2);
    var items = text.match(/\d+[\d\.]*\s*(د\.ك|KD)\s*[\/\-]\s*(متر|م|وحدة|قطعة)/gi);
    if (items && items.length) r.unitPrices = items.slice(0, 5);
    return r;
  }

  function buildAnalysisMsg(filename, ext, pageCount) {
    var src = sources.find(function(s) { return s.name === filename; }) || {};
    var text = src.text || '';
    var ext2 = extractKeyData(text);
    var lines = ['✅ تم قراءة **' + filename + '**'];
    if (pageCount) lines.push('📄 ' + pageCount + ' صفحة');
    lines.push('');
    lines.push('📊 **البيانات المستخرجة:**');
    if (ext2.projects   && ext2.projects.length)    lines.push('🏗️ المشروع: '   + ext2.projects.join(' | '));
    if (ext2.contractors && ext2.contractors.length) lines.push('👷 المقاول: '  + ext2.contractors.join(' | '));
    if (ext2.values     && ext2.values.length)       lines.push('💰 قيم مالية: '+ ext2.values.slice(0,3).join(' · '));
    if (ext2.dates      && ext2.dates.length)        lines.push('📅 تواريخ: '   + ext2.dates.join(' · '));
    if (ext2.penalties  && ext2.penalties.length)    lines.push('⚠️ غرامات: '   + ext2.penalties.join('\n   '));
    if (ext2.quantities && ext2.quantities.length)   lines.push('📦 كميات: '    + ext2.quantities.join(' · '));
    if (ext2.unitPrices && ext2.unitPrices.length)   lines.push('💲 أسعار: '    + ext2.unitPrices.join(' · '));
    if (!Object.keys(ext2).length) lines.push('لم أعثر على بيانات هيكلية — يمكنك سؤالي بلغة طبيعية.');
    lines.push('');
    lines.push('❓ اسألني عن أي تفصيل في هذا المصدر أو المصادر الأخرى!');
    return lines.join('\n');
  }

  // ── معالجة الملفات ───────────────────────────────────────────────
  function handleFiles(files) {
    Array.from(files).forEach(function(file) {
      var ext = file.name.split('.').pop().toLowerCase();
      if (ext === 'pdf') {
        processPDF(file);
      } else if (['jpg','jpeg','png','gif','webp','bmp'].indexOf(ext) !== -1) {
        processImage(file);
      } else if (['txt','csv','text'].indexOf(ext) !== -1) {
        processText(file);
      } else if (['doc','docx'].indexOf(ext) !== -1) {
        addMsg('⚠️ ملفات Word لا تُقرأ مباشرة. انسخ النص من الملف والصقه هنا كرسالة نصية.');
      }
    });
  }

  function processPDF(file) {
    if (!window.pdfjsLib) { addMsg('⏳ جاري تحميل قارئ PDF، انتظر لحظة...'); return; }
    addMsg('⏳ جاري قراءة ' + file.name + '...');
    var reader = new FileReader();
    reader.onload = function(e) {
      var buffer = e.target.result;
      window.pdfjsLib.getDocument({ data: buffer }).promise.then(function(pdf) {
        var totalPages = pdf.numPages;
        var allText = '';
        var pages = [];
        var chain = Promise.resolve();
        for (var i = 1; i <= totalPages; i++) {
          (function(pageNum) {
            chain = chain.then(function() {
              return pdf.getPage(pageNum).then(function(page) {
                return page.getTextContent().then(function(tc) {
                  var pageText = tc.items.map(function(it) { return it.str; }).join(' ');
                  allText += pageText + '\n';
                  var viewport = page.getViewport({ scale: 1.4 });
                  var canvas = document.createElement('canvas');
                  canvas.width = viewport.width;
                  canvas.height = viewport.height;
                  return page.render({ canvasContext: canvas.getContext('2d'), viewport: viewport }).promise.then(function() {
                    pages.push({ pageNum: pageNum, dataUrl: canvas.toDataURL('image/jpeg', 0.7), text: pageText });
                  });
                });
              });
            });
          })(i);
        }
        chain.then(function() {
          var src = { id: Date.now(), name: file.name, type: 'pdf', text: allText, pages: pages, thumb: pages[0] ? pages[0].dataUrl : null };
          setSources(function(prev) { return [...prev, src]; });
          setActiveId(src.id);
          // remove loading message and add analysis
          setMessages(function(prev) {
            var filtered = prev.filter(function(m) { return m.text.indexOf('جاري قراءة ' + file.name) === -1; });
            return [...filtered, { id: Date.now() + 1, role: 'assistant', text: buildAnalysisForSrc(src) }];
          });
        });
      }).catch(function(err) {
        addMsg('❌ تعذّر قراءة PDF: ' + err.message);
      });
    };
    reader.readAsArrayBuffer(file);
  }

  function buildAnalysisForSrc(src) {
    var ext = extractKeyData(src.text || '');
    var lines = ['✅ تم قراءة **' + src.name + '**'];
    if (src.pages) lines.push('📄 ' + src.pages.length + ' صفحة');
    lines.push('');
    lines.push('📊 **البيانات المستخرجة:**');
    if (ext.projects    && ext.projects.length)    lines.push('🏗️ المشروع: '   + ext.projects.join(' | '));
    if (ext.contractors && ext.contractors.length) lines.push('👷 المقاول: '   + ext.contractors.join(' | '));
    if (ext.values      && ext.values.length)      lines.push('💰 قيم مالية: ' + ext.values.slice(0,3).join(' · '));
    if (ext.dates       && ext.dates.length)       lines.push('📅 تواريخ: '    + ext.dates.join(' · '));
    if (ext.penalties   && ext.penalties.length)   lines.push('⚠️ غرامات: '    + ext.penalties.slice(0,2).join('\n   '));
    if (ext.quantities  && ext.quantities.length)  lines.push('📦 كميات: '     + ext.quantities.join(' · '));
    if (ext.unitPrices  && ext.unitPrices.length)  lines.push('💲 أسعار وحدة: '+ ext.unitPrices.join(' · '));
    if (!Object.keys(ext).length) lines.push('لم أجد بيانات هيكلية — اسألني بلغة طبيعية عن أي شيء في المستند.');
    lines.push('\n❓ اسألني عن أي تفصيل في هذا المصدر أو المصادر الأخرى!');
    return lines.join('\n');
  }

  function processImage(file) {
    var reader = new FileReader();
    reader.onload = function(e) {
      var src = { id: Date.now(), name: file.name, type: 'image', text: '', dataUrl: e.target.result };
      setSources(function(prev) { return [...prev, src]; });
      setActiveId(src.id);
      addMsg('🖼️ تم رفع الصورة **' + file.name + '**.\n\nلا أستطيع قراءة النص من الصور بدون API للذكاء الاصطناعي، لكن يمكنك:\n• وصف محتوى الصورة هنا بكلماتك\n• أو نسخ أي نص من الصورة ولصقه\n\nوسأساعدك في التحليل فوراً!');
    };
    reader.readAsDataURL(file);
  }

  function processText(file) {
    var reader = new FileReader();
    reader.onload = function(e) {
      var text = e.target.result;
      var src = { id: Date.now(), name: file.name, type: 'text', text: text };
      setSources(function(prev) { return [...prev, src]; });
      setActiveId(src.id);
      addMsg(buildAnalysisForSrc(src));
    };
    reader.readAsText(file, 'utf-8');
  }

  function addMsg(text) {
    setMessages(function(prev) { return [...prev, { id: Date.now(), role: 'assistant', text: text }]; });
  }

  // ── تطبيع النص العربي للبحث ─────────────────────────────────────
  function normalizeAr(text) {
    return text
      .replace(/أ|إ|آ/g, 'ا')
      .replace(/ة/g, 'ه')
      .replace(/ى/g, 'ي')
      .replace(/[ً-ٟ]/g, '') // remove tashkeel
      .replace(/\s+/g, ' ')
      .trim();
  }

  // ── محرك البحث في المستندات ──────────────────────────────────────
  function answerQuestion(q, srcsArg) {
    var srcs = srcsArg || sourcesRef.current || [];

    if (!srcs.length) {
      return 'ارفع مستنداً أولاً';
    }

    // ابنِ قائمة الفقرات مع تتبّع المصدر لكل فقرة
    var paragraphs = [];
    srcs.forEach(function(src) {
      var text = (src && src.text) || '';
      if (!text.trim()) return;

      // قسّم على فواصل الأسطر المزدوجة أولاً
      var rawParas = text.split(/\n\s*\n+/);
      rawParas.forEach(function(p) {
        var clean = p.replace(/\s+/g, ' ').trim();
        if (!clean) return;
        // إذا كانت الفقرة طويلة جداً، قسّمها لمجموعات من 3 جمل
        var sentences = clean.split(/(?<=[.!؟?])\s+|[،؛]\s+/).filter(function(s) { return s.trim().length > 0; });
        if (sentences.length <= 4) {
          paragraphs.push({ text: clean, source: src.name || '' });
        } else {
          // chunks بطول 3 جمل مع تداخل جملة واحدة
          for (var i = 0; i < sentences.length; i += 2) {
            var chunk = sentences.slice(i, i + 3).join(' ').trim();
            if (chunk.length > 10) paragraphs.push({ text: chunk, source: src.name || '' });
            if (i + 3 >= sentences.length) break;
          }
        }
      });
    });

    if (!paragraphs.length) {
      return 'ارفع مستنداً أولاً';
    }

    var qNorm = normalizeAr(q);
    var qWords = qNorm.split(/\s+/).filter(function(w) { return w.length > 1; });

    if (!qWords.length) {
      return 'لم أجد هذه المعلومة في مصادرك';
    }

    // سجّل نقاط كل فقرة بعدد الكلمات المطابقة
    var scored = paragraphs.map(function(p) {
      var pNorm = normalizeAr(p.text);
      var matched = 0;
      qWords.forEach(function(w) {
        if (pNorm.indexOf(w) !== -1) matched++;
      });
      return { text: p.text, source: p.source, score: matched };
    });

    scored.sort(function(a, b) { return b.score - a.score; });
    var top = scored.filter(function(x) { return x.score > 0; }).slice(0, 5);

    if (!top.length) {
      return 'لم أجد هذه المعلومة في مصادرك';
    }

    // اجمع أفضل النتائج وارفقها بأسماء المصادر
    var answer = '📋 من المصادر المرفوعة:\n\n';
    top.forEach(function(item, i) {
      answer += '📌 ' + (i + 1) + '. ' + item.text + '\n';
      if (item.source) answer += '   📄 المصدر: ' + item.source + '\n';
      answer += '\n';
    });

    return answer.trim();
  }

  function sendMessage() {
    if (!input.trim()) return;
    var userText = input.trim();
    setMessages(function(prev) { return [...prev, { id: Date.now(), role: 'user', text: userText }]; });
    setInput('');
    setTimeout(function() {
      addMsg(answerQuestion(userText, sourcesRef.current));
    }, 400);
  }

  var activeSource = sources.find(function(s) { return s.id === activeId; });

  // ── JSX ─────────────────────────────────────────────────────────
  return (
    <div style={{ display: 'flex', flexDirection: 'column', height: '100%', overflow: 'hidden' }}>

      {/* رأس الصفحة */}
      <div style={{ padding: '10px 16px', background: 'var(--surface)', borderBottom: '1px solid var(--line)', flexShrink: 0, display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <div>
          <div style={{ fontWeight: 700, fontSize: 15, color: 'var(--ink)' }}>🗂️ المستشار الذكي — من واقع المصادر</div>
          <div style={{ fontSize: 11, color: 'var(--ink-3)', marginTop: 2 }}>
            {sources.length === 0 ? 'ارفع مصادرك للبدء' : sources.length + ' مصدر مرفوع · ' + sources.filter(function(s){return s.type==='pdf';}).length + ' PDF · ' + sources.filter(function(s){return s.type==='image';}).length + ' صورة'}
          </div>
        </div>
        <div style={{ display: 'flex', gap: 8 }}>
          <button
            onClick={function() { fileInputRef.current && fileInputRef.current.click(); }}
            style={{ padding: '7px 16px', borderRadius: 8, border: 'none', background: 'var(--accent)', color: 'var(--bg)', fontFamily: 'inherit', fontWeight: 700, fontSize: 12, cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 6 }}
          >
            ＋ رفع مصدر
          </button>
          <input
            ref={fileInputRef}
            type="file"
            multiple
            accept=".pdf,.png,.jpg,.jpeg,.gif,.webp,.txt,.csv"
            style={{ display: 'none' }}
            onChange={function(e) { handleFiles(e.target.files); e.target.value = ''; }}
          />
        </div>
      </div>

      {/* المحتوى الرئيسي */}
      <div className="source-chat-layout" style={{ display: 'flex', flex: 1, overflow: 'hidden' }}>

        {/* يسار: المصادر + العارض */}
        <div className="source-panel" style={{ width: '55%', display: 'flex', flexDirection: 'column', borderLeft: '1px solid var(--line)', overflow: 'hidden' }}>

          {/* شريط المصادر */}
          <div style={{ display: 'flex', gap: 4, padding: '6px 8px', background: 'var(--bg-soft)', borderBottom: '1px solid var(--line)', overflowX: 'auto', flexShrink: 0, alignItems: 'center' }}>
            {sources.length === 0 ? (
              <span style={{ fontSize: 11, color: 'var(--ink-4)', padding: '2px 4px' }}>لا توجد مصادر بعد</span>
            ) : sources.map(function(s) { return (
              <button
                key={s.id}
                onClick={function() { setActiveId(s.id); }}
                style={{
                  padding: '4px 10px', borderRadius: 6, border: 'none', cursor: 'pointer',
                  fontFamily: 'inherit', fontSize: 11, fontWeight: 600, flexShrink: 0,
                  background: s.id === activeId ? 'var(--accent)' : 'var(--surface)',
                  color: s.id === activeId ? 'var(--bg)' : 'var(--ink)',
                  boxShadow: s.id === activeId ? 'none' : '0 1px 2px rgba(0,0,0,.06)',
                }}
              >
                {s.type === 'pdf' ? '📄' : s.type === 'image' ? '🖼️' : '📝'} {s.name.length > 20 ? s.name.substring(0,18) + '…' : s.name}
              </button>

          <div style={{ flex: 1, overflowY: 'auto', background: 'var(--bg-soft)', padding: activeSource ? 12 : 0, display: 'flex', flexDirection: 'column' }}

                  <div style={{ fontSize: 12, color: 'var(--ink-4)', textAlign: 'center', lineHeight: 1.8 }}>
                    PDF · صور · ملفات نصية<br/>اسحب وأفلت أو اضغط الزر أدناه
                  </div>
                  <button

              </div>
            ) : activeSource.type === 'pdf' ? (
              <div>

                    <img src={p.dataUrl} alt={'صفحة ' + p.pageNum} style={{ width: '100%', display: 'block' }} />
                    <div style={{ padding: '4px 8px', fontSize: 10, color: 'var(--ink-4)', textAlign: 'center', borderTop: '1px solid var(--line)' }}>صفحة {p.pageNum}</div>
                  </div>
                ); })}
              </div>
            ) : (
              <div style={{ background: 'var(--surface)', borderRadius: 8, padding: 16, boxShadow: '0 1px 4px rgba(0,0,0,.08)' }}>
                <pre style={{ fontSize: 12, lineHeight: 1.7, color: 'var(--ink)', whiteSpace: 'pre-wrap', fontFamily: 'inherit', margin: 0 }}>{activeSource.text}</pre>
              </div>
            )}
          </div>
        </div>

        {/* يمين: الجات */}
        <div className="chat-panel" style={{ flex: 1, display: 'flex', flexDirection: 'column', background: 'var(--surface)', overflow: 'hidden' }}>

          <div style={{ padding: '8px 12px', background: 'var(--bg-soft)', borderBottom: '1px solid var(--line)', fontSize: 11, fontWeight: 700, color: 'var(--ink-2)', flexShrink: 0 }}>
            🤖 المستشار الذكي — {sources.length > 0 ? ('يقرأ ' + sources.length + ' مصدر') : 'في انتظار المصادر'}
          </div>

          {/* الرسائل */}
          <div style={{ flex: 1, overflowY: 'auto', padding: '14px 12px' }}>
            {messages.map(function(m) { return (
              <div key={m.id} style={{ marginBottom: 12, display: 'flex', justifyContent: m.role === 'assistant' ? 'flex-start' : 'flex-end' }}>

                }}>

            <div ref={msgEndRef} />

          {/* حقل الإدخال */}
          <div style={{ padding: '10px 12px', background: 'var(--bg-soft)', borderTop: '1px solid var(--line)', flexShrink: 0 }}>

                value={input}

              />
              <button
                onClick={sendMessage}
                style={{

            )}

        </div>
      </div>
    </div>
  );
}

// CALENDAR SCREEN — التقويم
// ─────────────────────────────────────────────────────────────────
function CalendarScreen() {
  var STORAGE_KEY = 'ea_calendar_v1';
  var EVENT_COLORS = ['#6C8EF5', '#50C878', '#F5A623', '#9B59B6', '#F05A7E'];
  var EVENT_CATEGORIES = ['شخصي', 'عمل', 'مشروع', 'موعد'];
  var MONTH_NAMES = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  var DAY_NAMES = ['أح','اث','ثل','أر','خم','جم','سب'];
  var DAY_NAMES_FULL = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];

  var todayObj = new Date();
  todayObj.setHours(0,0,0,0);
  var todayStr = todayObj.getFullYear() + '-' + String(todayObj.getMonth()+1).padStart(2,'0') + '-' + String(todayObj.getDate()).padStart(2,'0');

  var [events, setEvents] = React.useState(function() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch(e) { return []; }
  });
  var [viewYear, setViewYear] = React.useState(todayObj.getFullYear());
  var [viewMonth, setViewMonth] = React.useState(todayObj.getMonth());
  var [selectedDate, setSelectedDate] = React.useState(todayStr);
  var [newTitle, setNewTitle] = React.useState('');
  var [newTime, setNewTime] = React.useState('');
  var [newColor, setNewColor] = React.useState(EVENT_COLORS[0]);
  var [newCategory, setNewCategory] = React.useState(EVENT_CATEGORIES[0]);

  React.useEffect(function() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
  }, [events]);

  function getDateStr(y, m, d) {
    return y + '-' + String(m+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
  }
  function eventsForDate(ds) { return events.filter(function(e) { return e.date === ds; }); }
  function totalEventsInMonth() {
    return events.filter(function(e) {
      var d = new Date(e.date + 'T00:00:00');
      return d.getFullYear() === viewYear && d.getMonth() === viewMonth;
    }).length;
  }
  function addEvent() {
    if (!newTitle.trim()) return;
    var ev = { id: Date.now(), title: newTitle.trim(), date: selectedDate, time: newTime || '', color: newColor, category: newCategory };
    setEvents(function(prev) { return prev.concat([ev]); });
    setNewTitle('');
    setNewTime('');
  }
  function removeEvent(id) { setEvents(function(prev) { return prev.filter(function(e) { return e.id !== id; }); }); }
  function goToToday() {
    var t = new Date();
    setViewYear(t.getFullYear());
    setViewMonth(t.getMonth());
    setSelectedDate(todayStr);
  }
  function prevMonth() {
    if (viewMonth === 0) { setViewMonth(11); setViewYear(function(y) { return y - 1; }); }
    else setViewMonth(function(m) { return m - 1; });
  }
  function nextMonth() {
    if (viewMonth === 11) { setViewMonth(0); setViewYear(function(y) { return y + 1; }); }
    else setViewMonth(function(m) { return m + 1; });
  }

  var firstDay = new Date(viewYear, viewMonth, 1).getDay();
  var daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
  var daysInPrev = new Date(viewYear, viewMonth, 0).getDate();

  var cells = [];
  for (var i = 0; i < firstDay; i++) cells.push({ day: daysInPrev - firstDay + 1 + i, current: false });
  for (var d = 1; d <= daysInMonth; d++) cells.push({ day: d, current: true, dateStr: getDateStr(viewYear, viewMonth, d) });
  var rem = 42 - cells.length;
  for (var nd = 1; nd <= rem; nd++) cells.push({ day: nd, current: false });

  var selectedEvts = eventsForDate(selectedDate);
  var selDateLabel = (function() {
    if (!selectedDate) return '';
    var parts = selectedDate.split('-');
    var dt = new Date(+parts[0], +parts[1]-1, +parts[2]);
    return DAY_NAMES_FULL[dt.getDay()] + '، ' + +parts[2] + ' ' + MONTH_NAMES[+parts[1]-1];
  })();

  var cardStyle = { background:'var(--surface)', borderRadius:18, border:'1px solid var(--line)', overflow:'hidden', boxShadow:'0 4px 24px rgba(0,0,0,0.06)', maxWidth:540, margin:'0 auto' };
  var btnBase = { border:'1px solid var(--line)', background:'var(--surface)', cursor:'pointer', fontFamily:'inherit' };

  return (
    <div style={{ display:'flex', flexDirection:'row-reverse', height:'calc(100vh - 56px)', overflow:'hidden', fontFamily:'inherit' }}>

      {/* ── Right panel: events + add form ── */}
      <div style={{ width:280, flexShrink:0, display:'flex', flexDirection:'column', borderLeft:'1px solid var(--line)', background:'var(--bg-soft)', overflow:'hidden' }}>

        {/* Selected day header */}
        <div style={{ padding:'18px 16px 12px', borderBottom:'1px solid var(--line)', background:'var(--surface)' }}>
          <div style={{ fontSize:13, fontWeight:700, color:'var(--ink)', marginBottom:2 }}>{selDateLabel}</div>
          <div style={{ fontSize:11, color:'var(--ink-3)' }}>{selectedEvts.length} {selectedEvts.length === 1 ? 'حدث' : 'أحداث'}</div>
        </div>

        {/* Events list */}
        <div style={{ flex:1, overflowY:'auto', padding:'10px 12px', display:'flex', flexDirection:'column', gap:6 }}>
          {selectedEvts.length === 0 && (
            <div style={{ color:'var(--ink-4)', fontSize:12, textAlign:'center', padding:'24px 0', fontStyle:'italic' }}>لا توجد أحداث</div>
          )}
          {selectedEvts.map(function(ev) {
            return (
              <div key={ev.id} style={{ background:'var(--surface)', borderRadius:12, padding:'10px 12px', border:'1px solid var(--line)', display:'flex', alignItems:'center', gap:8 }}>
                <div style={{ width:8, height:8, borderRadius:'50%', background:ev.color, flexShrink:0 }}/>
                <div style={{ flex:1, minWidth:0 }}>
                  {ev.time && <div style={{ fontSize:10, color:'var(--ink-4)', direction:'ltr', fontVariantNumeric:'tabular-nums', marginBottom:1 }}>{ev.time}</div>}
                  <div style={{ fontSize:12, fontWeight:600, color:'var(--ink)', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{ev.title}</div>
                  <span style={{ background:ev.color+'22', color:ev.color, padding:'1px 7px', borderRadius:20, fontSize:9, fontWeight:700 }}>{ev.category}</span>
                </div>
                <button onClick={function() { removeEvent(ev.id); }}
                  style={{ background:'none', border:'none', cursor:'pointer', color:'var(--ink-4)', fontSize:16, lineHeight:1, padding:'0 2px', opacity:0.5 }}
                  onMouseEnter={function(e){e.currentTarget.style.opacity='1';}}
                  onMouseLeave={function(e){e.currentTarget.style.opacity='0.5';}}>×</button>
              </div>
            );
          })}
        </div>

        {/* Add event form */}
        <div style={{ padding:'12px', borderTop:'1px solid var(--line)', background:'var(--surface)' }}>
          <input type="text" placeholder="عنوان الحدث..." value={newTitle}
            onChange={function(e){setNewTitle(e.target.value);}}
            onKeyDown={function(e){if(e.key==='Enter')addEvent();}}
            style={{ width:'100%', padding:'8px 10px', borderRadius:8, border:'1px solid var(--line)', background:'var(--bg-soft)', color:'var(--ink)', fontSize:12, fontFamily:'inherit', outline:'none', marginBottom:8, boxSizing:'border-box' }}
          />
          <div style={{ display:'flex', gap:6, marginBottom:8, alignItems:'center' }}>
            <input type="time" value={newTime} onChange={function(e){setNewTime(e.target.value);}}
              style={{ flex:1, padding:'6px 8px', borderRadius:8, border:'1px solid var(--line)', background:'var(--bg-soft)', color:'var(--ink)', fontSize:11, fontFamily:'inherit', outline:'none' }}
            />
            <select value={newCategory} onChange={function(e){setNewCategory(e.target.value);}}
              style={{ flex:1, padding:'6px 8px', borderRadius:8, border:'1px solid var(--line)', background:'var(--bg-soft)', color:newColor, fontSize:11, fontFamily:'inherit', fontWeight:700, cursor:'pointer', outline:'none' }}>
              {EVENT_CATEGORIES.map(function(cat){return <option key={cat} value={cat}>{cat}</option>;})}
            </select>
          </div>
          <div style={{ display:'flex', gap:5, alignItems:'center', marginBottom:10 }}>
            {EVENT_COLORS.map(function(c){
              return <button key={c} onClick={function(){setNewColor(c);}} style={{ width:22, height:22, borderRadius:'50%', background:c, cursor:'pointer', padding:0, border: newColor===c ? '3px solid var(--ink)' : '2px solid transparent', flexShrink:0 }}/>;
            })}
          </div>
          <button onClick={addEvent}
            style={{ width:'100%', padding:'8px', borderRadius:8, background:'var(--ink)', color:'var(--bg)', border:'none', fontSize:12, fontWeight:700, cursor:'pointer', fontFamily:'inherit' }}>
            + إضافة حدث
          </button>
        </div>
      </div>

      {/* ── Left panel: month calendar ── */}
      <div style={{ flex:1, display:'flex', flexDirection:'column', overflow:'hidden', background:'var(--surface)' }}>

        {/* Month navigation header */}
        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', padding:'16px 20px 12px', borderBottom:'1px solid var(--line)', flexShrink:0 }}>
          <div style={{ display:'flex', alignItems:'center', gap:10 }}>
            <span style={{ fontSize:18, fontWeight:800, color:'var(--ink)' }}>{MONTH_NAMES[viewMonth]}</span>
            <span style={{ fontSize:18, fontWeight:400, color:'var(--ink-3)' }}>{viewYear}</span>
            <span style={{ background:'var(--bg-soft)', color:'var(--ink-3)', borderRadius:20, padding:'2px 10px', fontSize:11, fontWeight:600 }}>{totalEventsInMonth()} حدث</span>
          </div>
          <div style={{ display:'flex', gap:6, alignItems:'center' }}>
            <button onClick={goToToday} style={{ padding:'5px 14px', borderRadius:20, border:'1px solid var(--line)', background:'var(--surface)', color:'var(--ink-2)', fontSize:12, fontWeight:600, cursor:'pointer', fontFamily:'inherit' }}>اليوم</button>
            <button onClick={prevMonth} style={{ width:30, height:30, borderRadius:8, border:'1px solid var(--line)', background:'var(--surface)', display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer' }}>
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <button onClick={nextMonth} style={{ width:30, height:30, borderRadius:8, border:'1px solid var(--line)', background:'var(--surface)', display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer' }}>
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><path d="M9 18l6-6-6-6"/></svg>
            </button>
          </div>
        </div>

        {/* Day headers */}
        <div style={{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', padding:'10px 16px 0', flexShrink:0 }}>
          {DAY_NAMES.map(function(dn){
            return <div key={dn} style={{ textAlign:'center', fontSize:11, fontWeight:700, color:'var(--ink-4)', paddingBottom:6 }}>{dn}</div>;
          })}
        </div>

        {/* Day grid */}
        <div style={{ flex:1, display:'grid', gridTemplateColumns:'repeat(7,1fr)', gridTemplateRows:'repeat(6,1fr)', padding:'0 12px 12px', gap:'1px', overflow:'hidden' }}>
          {cells.map(function(cell, idx){
            if(!cell.current){
              return <div key={idx} style={{ display:'flex', alignItems:'center', justifyContent:'center' }}><span style={{ fontSize:12, color:'var(--ink-4)', opacity:0.3 }}>{cell.day}</span></div>;
            }
            var isToday = cell.dateStr === todayStr;
            var isSel = cell.dateStr === selectedDate;
            var dots = eventsForDate(cell.dateStr).slice(0,3);
            return (
              <div key={idx} onClick={function(){setSelectedDate(cell.dateStr);}}
                style={{ display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', cursor:'pointer', borderRadius:10, transition:'background 0.15s',
                  background: isSel ? 'var(--ink)' : isToday ? 'var(--bg-soft)' : 'transparent' }}
                onMouseEnter={function(e){if(!isSel)e.currentTarget.style.background='var(--bg-soft)';}}
                onMouseLeave={function(e){if(!isSel)e.currentTarget.style.background=isToday?'var(--bg-soft)':'transparent';}}>
                <span style={{ fontSize:13, fontWeight:(isToday||isSel)?700:400, lineHeight:1, color: isSel?'var(--bg)':isToday?'var(--ink)':'var(--ink-2)' }}>{cell.day}</span>
                {dots.length>0 && (
                  <div style={{ display:'flex', gap:2, marginTop:3 }}>
                    {dots.map(function(ev,ei){return <div key={ei} style={{ width:4, height:4, borderRadius:'50%', background: isSel?'rgba(255,255,255,0.65)':ev.color }}/>;}) }
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

    tajawal: '"Tajawal"',
  };

  const themeClass = `theme-${colorScheme} ${theme === 'dark' ? 'dark' : ''}`;

  // Apply theme class to root element
  React.useEffect(() => {
    const root = document.getElementById('root');
    root.className = themeClass;
    // Sync html/body so CSS vars on html.dark / body.dark activate
    document.documentElement.classList.toggle('dark', theme === 'dark');
    document.body.classList.toggle('dark', theme === 'dark');
  }, [theme, colorScheme]);


  return (
    <div style={{ display:'flex', flexDirection:'column', height:'100vh', overflow:'hidden' }}>
      {/* ── User identity bar (top) ── */}
      <div className="auth-user-bar">
        <span style={{fontSize:'1rem'}}>⚡</span>

        <span className={session?.role==='admin' ? 'u-role-admin' : 'u-role-user'}>
