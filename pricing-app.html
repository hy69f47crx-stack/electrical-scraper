// Dashboard screen
function DashboardScreen() {
  // Pricing Engine state
  const [items, setItems] = React.useState([
    { id:1, name:'كيبل كهربائي NYY 3×2.5mm', cQty:'100', eQty:'80', cPrice:'2.50', mPrice:'1.85' },
    { id:2, name:'مفتاح كهربائي مفرد 16A Legrand', cQty:'50', eQty:'45', cPrice:'3.50', mPrice:'2.75' },
    { id:3, name:'برياز مزدوج 13A Schneider', cQty:'30', eQty:'30', cPrice:'2.90', mPrice:'3.20' },
  ]);
  const [activeItem, setActiveItem]   = React.useState(null);
  // Products table state
  const [searchTerm, setSearchTerm]   = React.useState('');
  const [sortHighest, setSortHighest] = React.useState(true);

  if (APP_DATA.loading) {
    return <div style={{ padding: '40px', textAlign: 'center', color: 'var(--ink-3)' }}>⚡ جاري التحميل...</div>;
  }

  // ── Pricing Engine helpers ────────────────────────────────────────────────
  function addRow() {
    var newId = Date.now();
    setItems(function(prev) { return prev.concat([{ id:newId, name:'', cQty:'', eQty:'', cPrice:'', mPrice:'' }]); });
  }
  function removeRow(id) {
    setItems(function(prev) { return prev.length > 1 ? prev.filter(function(x){ return x.id !== id; }) : prev; });
    if (activeItem && activeItem.id === id) setActiveItem(null);
  }
  function updateRow(id, field, val) {
    setItems(function(prev) {
      return prev.map(function(item) {
        if (item.id !== id) return item;
        var u = { id:item.id, name:item.name, cQty:item.cQty, eQty:item.eQty, cPrice:item.cPrice, mPrice:item.mPrice };
        u[field] = val;
        return u;
      });
    });
  }
  function calcDev(item) {
    var cp = parseFloat(item.cPrice)||0, mp = parseFloat(item.mPrice)||0;
    if (!cp || !mp) return null;
    return (cp - mp) / mp * 100;
  }
  function findMarketPrices(name) {
    if (!name || name.trim().length < 3) return [];
    var words = name.toLowerCase().trim().split(/\s+/).filter(function(w){ return w.length > 2; });
    var sourceMap = {};
    EMBEDDED_PRODUCTS.forEach(function(p) {
      var matched = words.filter(function(w){ return p.name.toLowerCase().includes(w); }).length;
      if (matched >= 2) {
        if (!sourceMap[p.store]) sourceMap[p.store] = [];
        sourceMap[p.store].push(p.price);
      }
    });
    return Object.keys(sourceMap).slice(0,3).map(function(store) {
      var prices = sourceMap[store];
      return { store:store, price:Math.round(prices.reduce(function(a,b){return a+b;},0)/prices.length*100)/100 };
    });
  }

  // ── Pricing summary ───────────────────────────────────────────────────────
  var overItems  = items.filter(function(i){ var d=calcDev(i); return d!==null && d>5; });
  var underItems = items.filter(function(i){ var d=calcDev(i); return d!==null && d<-5; });
  var fairItems  = items.filter(function(i){ var d=calcDev(i); return d!==null && Math.abs(d)<=5; });
  var totalContractVal = items.reduce(function(s,i){ return s+(parseFloat(i.cPrice)||0)*(parseFloat(i.eQty)||0); },0);
  var totalMarketVal   = items.reduce(function(s,i){ return s+(parseFloat(i.mPrice)||0)*(parseFloat(i.eQty)||0); },0);
  var totalDiff        = Math.round((totalContractVal - totalMarketVal)*100)/100;
  var activePrices     = activeItem ? findMarketPrices(activeItem.name) : [];

  var products = EMBEDDED_PRODUCTS;
  var allPrices = products.map(function(p) { return p.price; });
  var maxPriceVal = allPrices.length > 0 ? Math.max.apply(null, allPrices) : 0;

  // ── Category detection ──────────────────────────────────────────────────────
  var CAT_RULES = [
    { key: 'كابلات',  label: 'كابلات',  color: '#4A90D9', test: function(n) { return /كيبل|كابل|cable|nyy/i.test(n); } },
    { key: 'إضاءة',  label: 'إضاءة',   color: '#F5A623', test: function(n) { return /لمب|led|اضاء|إضاء|ضوء|سبوت|تراك|شريط/i.test(n); } },
    { key: 'تكييف',  label: 'تكييف',   color: '#4ECDC4', test: function(n) { return /مكيف|تكييف|ترموستات|thermostat/i.test(n); } },
    { key: 'حماية',  label: 'حماية',   color: '#FF6B6B', test: function(n) { return /قاطع|mcb|rcd|حماية|رله|انذار|حريق|دخان/i.test(n); } },
    { key: 'مقابس',  label: 'مقابس',   color: '#7ED321', test: function(n) { return /برياز|مقبس|مفتاح|وصلة|socket|switch/i.test(n); } },
    { key: 'لوحات',  label: 'لوحات',   color: '#F8632B', test: function(n) { return /لوحة|panel/i.test(n); } },
    { key: 'طاقة',   label: 'طاقة',    color: '#9B59B6', test: function(n) { return /ups|مولد|طاقة|شمس|power|battery/i.test(n); } },
  ];

  function detectCategory(name) {
    for (var ci = 0; ci < CAT_RULES.length; ci++) {
      if (CAT_RULES[ci].test(name)) return CAT_RULES[ci];
    }
    return { key: 'أخرى', label: 'أخرى', color: '#9E9E9E' };
  }

  // ── Filtered & sorted table products ────────────────────────────────────────
  var lowerSearch = searchTerm.toLowerCase();
  var filtered = products.filter(function(p) {
    if (!lowerSearch) return true;
    return p.name.toLowerCase().includes(lowerSearch) || p.store.toLowerCase().includes(lowerSearch);
  });
  var sorted = filtered.slice().sort(function(a, b) {
    return sortHighest ? b.price - a.price : a.price - b.price;
  });
  var tableRows = sorted.slice(0, 12);

  // ── KPI values ───────────────────────────────────────────────────────────────
  var totalProducts = products.length;
  var uniqueStores = APP_DATA.stores.length;
  var avgPrice = APP_DATA.kpis.avgPrice;
  var highestPrice = maxPriceVal;

  // ── Bar chart: products per store ────────────────────────────────────────────
  var storeColors = ['#FF6B6B', '#4ECDC4', '#AA96DA', '#F5A623', '#7ED321', '#4A90D9', '#F8632B'];
  var storeChartData = APP_DATA.stores.map(function(s, si) {
    return { name: s.name, count: s.productCount, color: storeColors[si % storeColors.length] };
  });
  var maxStoreCount = storeChartData.length > 0 ? Math.max.apply(null, storeChartData.map(function(d) { return d.count; })) : 1;
  var barW = 600;
  var barH = 200;
  var barPad = 40;
  var barSlot = storeChartData.length > 0 ? Math.floor((barW - barPad * 2) / storeChartData.length) : 60;
  var barWidth = Math.max(10, barSlot - 12);

  // ── Histogram: price distribution ────────────────────────────────────────────
  var buckets = [
    { label: '0-5',    min: 0,   max: 5,        color: '#4ECDC4' },
    { label: '5-20',   min: 5,   max: 20,       color: '#AA96DA' },
    { label: '20-50',  min: 20,  max: 50,       color: '#F5A623' },
    { label: '50-100', min: 50,  max: 100,      color: '#FF6B6B' },
    { label: '100+',   min: 100, max: Infinity, color: '#F8632B' },
  ];
  buckets.forEach(function(b) {
    b.count = products.filter(function(p) { return p.price >= b.min && p.price < b.max; }).length;
  });
  var maxBucketCount = Math.max.apply(null, buckets.map(function(b) { return b.count; })) || 1;
  var histSlot = Math.floor((barW - barPad * 2) / buckets.length);
  var histBarW = histSlot - 12;

  // ── Category breakdown ────────────────────────────────────────────────────────
  var catMap = {};
  products.forEach(function(p) {
    var cat = detectCategory(p.name);
    if (!catMap[cat.key]) catMap[cat.key] = { label: cat.label, color: cat.color, count: 0 };
    catMap[cat.key].count++;
  });
  var catList = Object.values(catMap).sort(function(a, b) { return b.count - a.count; });
  var maxCatCount = catList.length > 0 ? catList[0].count : 1;

  return (
    <div style={{ padding:'14px 14px 36px' }}>

      {/* ══════════════════════════════════════════════════════ */}
      {/*  ⚡ PRICING ENGINE — محرك التسعير                     */}
      {/* ══════════════════════════════════════════════════════ */}

      {/* Header */}
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:14 }}>
        <div>
          <div style={{ fontSize:17, fontWeight:800, color:'var(--ink)', letterSpacing:'-0.3px' }}>⚡ محرك التسعير</div>
          <div style={{ fontSize:11, color:'var(--ink-4)', marginTop:2 }}>أثبت المبالغة · قارن السوق · احسب الانحراف</div>
        </div>
        <button onClick={addRow} style={{
          padding:'8px 16px', borderRadius:99, background:'var(--accent)', color:'var(--bg)',
          fontSize:12, fontWeight:700, border:'none', cursor:'pointer', fontFamily:'inherit',
        }}>+ إضافة بند</button>
      </div>

      {/* Summary KPIs */}
      <div style={{ display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:10, marginBottom:14 }}>
        <div style={{ borderRadius:12, padding:'12px 12px', background:'rgba(255,107,107,0.07)', border:'1px solid rgba(255,107,107,0.25)', borderRight:'3px solid #FF6B6B' }}>
          <div style={{ fontSize:22, fontWeight:800, color:'#FF6B6B', lineHeight:1 }} className="num">{toEnglishNumbers(String(overItems.length))}</div>
          <div style={{ fontSize:10, color:'var(--ink-4)', marginTop:5, lineHeight:1.4 }}>بند مبالغ فيه<br/><span style={{fontSize:9}}>Overpriced</span></div>
        </div>
        <div style={{ borderRadius:12, padding:'12px 12px', background:'rgba(126,211,33,0.07)', border:'1px solid rgba(126,211,33,0.25)', borderRight:'3px solid #7ED321' }}>
          <div style={{ fontSize:22, fontWeight:800, color:'#7ED321', lineHeight:1 }} className="num">{toEnglishNumbers(String(underItems.length))}</div>
          <div style={{ fontSize:10, color:'var(--ink-4)', marginTop:5, lineHeight:1.4 }}>بند أقل سعراً<br/><span style={{fontSize:9}}>Underpriced</span></div>
        </div>
        <div style={{ borderRadius:12, padding:'12px 12px', background:'rgba(245,166,35,0.07)', border:'1px solid rgba(245,166,35,0.25)', borderRight:'3px solid #F5A623' }}>
          <div style={{ fontSize:22, fontWeight:800, color:'#F5A623', lineHeight:1 }} className="num">{toEnglishNumbers(String(fairItems.length))}</div>
          <div style={{ fontSize:10, color:'var(--ink-4)', marginTop:5, lineHeight:1.4 }}>بند عادل<br/><span style={{fontSize:9}}>Fair Price</span></div>
        </div>
        <div style={{ borderRadius:12, padding:'12px 12px', background: totalDiff>0?'rgba(255,107,107,0.07)':'rgba(126,211,33,0.07)', border: '1px solid '+(totalDiff>0?'rgba(255,107,107,0.25)':'rgba(126,211,33,0.25)'), borderRight:'3px solid '+(totalDiff>0?'#FF6B6B':'#7ED321') }}>
          <div style={{ fontSize:18, fontWeight:800, color: totalDiff>0?'#FF6B6B':'#7ED321', lineHeight:1 }} className="num">
            {totalDiff>0?'+':''}{toEnglishNumbers(fmt(Math.abs(totalDiff)))}
          </div>
          <div style={{ fontSize:10, color:'var(--ink-4)', marginTop:5, lineHeight:1.4 }}>
            {totalDiff>0?'لصالح المقاول':'لصالح الجهة'}<br/><span style={{fontSize:9}}>د.ك إجمالي فرق</span>
          </div>
        </div>
      </div>

      {/* ── Pricing Table ── */}
      <div style={{ background:'var(--surface)', borderRadius:14, border:'1px solid var(--line)', overflow:'hidden', marginBottom:14 }}>
        <div style={{ overflowX:'auto' }}>
          <table style={{ width:'100%', borderCollapse:'collapse', fontSize:12 }}>
            <thead>
              <tr style={{ background:'var(--bg-soft)', borderBottom:'2px solid var(--line)' }}>
                <th style={{ padding:'10px 8px', textAlign:'right', color:'var(--ink-4)', fontWeight:600, fontSize:10, width:28 }}>#</th>
                <th style={{ padding:'10px 8px', textAlign:'right', color:'var(--ink-4)', fontWeight:600, fontSize:10, minWidth:170 }}>اسم البند / المادة</th>
                <th style={{ padding:'10px 6px', textAlign:'center', color:'var(--ink-4)', fontWeight:600, fontSize:10, whiteSpace:'nowrap' }}>الكمية<br/><span style={{fontWeight:400,fontSize:9,color:'var(--ink-4)'}}>التعاقدية</span></th>
                <th style={{ padding:'10px 6px', textAlign:'center', color:'var(--ink-4)', fontWeight:600, fontSize:10, whiteSpace:'nowrap' }}>الكمية<br/><span style={{fontWeight:400,fontSize:9,color:'var(--ink-4)'}}>المنفذة</span></th>
                <th style={{ padding:'10px 6px', textAlign:'center', color:'var(--ink-4)', fontWeight:600, fontSize:10, whiteSpace:'nowrap', background:'rgba(255,107,107,0.04)' }}>السعر<br/><span style={{fontWeight:400,fontSize:9,color:'var(--ink-4)'}}>التعاقدي</span></th>
                <th style={{ padding:'10px 6px', textAlign:'center', color:'var(--ink-4)', fontWeight:600, fontSize:10, whiteSpace:'nowrap', background:'rgba(78,205,196,0.05)' }}>السعر<br/><span style={{fontWeight:400,fontSize:9,color:'var(--ink-4)'}}>السوقي</span></th>
                <th style={{ padding:'10px 6px', textAlign:'center', color:'var(--ink-4)', fontWeight:600, fontSize:10 }}>الانحراف %</th>
                <th style={{ padding:'10px 6px', textAlign:'center', color:'var(--ink-4)', fontWeight:600, fontSize:10 }}>المؤشر</th>
                <th style={{ padding:'10px 6px', textAlign:'center', color:'var(--ink-4)', fontWeight:600, fontSize:10, width:50 }}>مقارنة</th>
                <th style={{ width:28 }}></th>
              </tr>
            </thead>
            <tbody>
              {items.map(function(item, ri) {
                var dev = calcDev(item);
                var isOver  = dev !== null && dev > 5;
                var isUnder = dev !== null && dev < -5;
                var isFair  = dev !== null && Math.abs(dev) <= 5;
                var devColor = isOver ? '#FF6B6B' : isUnder ? '#7ED321' : isFair ? '#F5A623' : 'var(--ink-4)';
                var isActive = activeItem && activeItem.id === item.id;
                var rowBg = isActive ? 'rgba(78,205,196,0.07)' : (ri%2===0 ? 'transparent' : 'var(--bg-soft)');
                return (
                  <tr key={item.id}
                    style={{ borderBottom:'1px solid var(--line)', background:rowBg, transition:'background 0.1s' }}
                    onMouseEnter={function(e){ if(!isActive) e.currentTarget.style.background='rgba(0,0,0,0.03)'; }}
                    onMouseLeave={function(e){ e.currentTarget.style.background=rowBg; }}
                  >
                    {/* # */}
                    <td style={{ padding:'8px 8px', color:'var(--ink-4)', fontSize:11, fontWeight:600 }}>{toEnglishNumbers(String(ri+1))}</td>

                    {/* Name input */}
                    <td style={{ padding:'6px 8px' }}>
                      <input value={item.name}
                        onChange={function(e){ updateRow(item.id,'name',e.target.value); }}
                        placeholder="اسم البند أو المادة..."
                        style={{ width:'100%', padding:'6px 8px', borderRadius:7, border:'1px solid var(--line)', background:'var(--bg)', color:'var(--ink)', fontSize:12, fontFamily:'inherit', outline:'none' }}
                      />
                    </td>

                    {/* Contract Qty */}
                    <td style={{ padding:'6px 4px', background:'rgba(255,107,107,0.02)' }}>
                      <input type="number" min="0" value={item.cQty}
                        onChange={function(e){ updateRow(item.id,'cQty',e.target.value); }}
                        style={{ width:64, padding:'6px 6px', borderRadius:7, border:'1px solid var(--line)', background:'var(--bg)', color:'var(--ink)', fontSize:12, textAlign:'center', fontFamily:'inherit', outline:'none' }}
                      />
                    </td>

                    {/* Executed Qty */}
                    <td style={{ padding:'6px 4px' }}>
                      <input type="number" min="0" value={item.eQty}
                        onChange={function(e){ updateRow(item.id,'eQty',e.target.value); }}
                        style={{ width:64, padding:'6px 6px', borderRadius:7, border:'1px solid var(--line)', background:'var(--bg)', color:'var(--ink)', fontSize:12, textAlign:'center', fontFamily:'inherit', outline:'none' }}
                      />
                    </td>

                    {/* Contract Price */}
                    <td style={{ padding:'6px 4px', background:'rgba(255,107,107,0.02)' }}>
                      <div style={{ display:'flex', alignItems:'center', gap:2, justifyContent:'center' }}>
                        <input type="number" min="0" step="0.01" value={item.cPrice}
                          onChange={function(e){ updateRow(item.id,'cPrice',e.target.value); }}
                          style={{ width:68, padding:'6px 6px', borderRadius:7, border:'1px solid rgba(255,107,107,0.3)', background:'rgba(255,107,107,0.04)', color:'var(--ink)', fontSize:12, textAlign:'center', fontFamily:'inherit', outline:'none' }}
                        />
                      </div>
                    </td>

                    {/* Market Price */}
                    <td style={{ padding:'6px 4px', background:'rgba(78,205,196,0.03)' }}>
                      <input type="number" min="0" step="0.01" value={item.mPrice}
                        onChange={function(e){ updateRow(item.id,'mPrice',e.target.value); }}
                        style={{ width:68, padding:'6px 6px', borderRadius:7, border:'1px solid rgba(78,205,196,0.35)', background:'rgba(78,205,196,0.06)', color:'var(--ink)', fontSize:12, textAlign:'center', fontFamily:'inherit', outline:'none' }}
                      />
                    </td>

                    {/* Deviation */}
                    <td style={{ padding:'8px 6px', textAlign:'center' }}>
                      {dev !== null ? (
                        <div style={{ fontWeight:800, fontSize:14, color:devColor }} className="num">
                          {dev>0?'+':''}{toEnglishNumbers(dev.toFixed(1))}%
                        </div>
                      ) : <span style={{ color:'var(--ink-4)', fontSize:13 }}>—</span>}
                    </td>

                    {/* Indicator badge */}
                    <td style={{ padding:'8px 6px', textAlign:'center', whiteSpace:'nowrap' }}>
                      {isOver  && <span style={{ display:'inline-flex', alignItems:'center', gap:3, padding:'4px 9px', borderRadius:99, background:'rgba(255,107,107,0.15)', color:'#FF6B6B', fontSize:10, fontWeight:700, border:'1px solid rgba(255,107,107,0.3)' }}>↑ مبالغ</span>}
                      {isUnder && <span style={{ display:'inline-flex', alignItems:'center', gap:3, padding:'4px 9px', borderRadius:99, background:'rgba(126,211,33,0.15)', color:'#7ED321', fontSize:10, fontWeight:700, border:'1px solid rgba(126,211,33,0.3)' }}>↓ أقل</span>}
                      {isFair  && <span style={{ display:'inline-flex', alignItems:'center', gap:3, padding:'4px 9px', borderRadius:99, background:'rgba(245,166,35,0.15)', color:'#F5A623', fontSize:10, fontWeight:700, border:'1px solid rgba(245,166,35,0.3)' }}>✓ عادل</span>}
                      {dev === null && <span style={{ color:'var(--ink-4)', fontSize:12 }}>—</span>}
                    </td>

                    {/* Compare toggle */}
                    <td style={{ padding:'8px 4px', textAlign:'center' }}>
                      <button
                        onClick={function(){ setActiveItem(isActive ? null : item); }}
                        style={{ padding:'5px 10px', borderRadius:99, border: isActive?'1.5px solid #4ECDC4':'1px solid var(--line)', background: isActive?'rgba(78,205,196,0.15)':'transparent', color: isActive?'#4ECDC4':'var(--ink-3)', fontSize:11, cursor:'pointer', fontFamily:'inherit', fontWeight:700 }}
                      >{isActive ? '✕' : '🔍'}</button>
                    </td>

                    {/* Delete */}
                    <td style={{ padding:'8px 4px', textAlign:'center' }}>
                      <button onClick={function(){ removeRow(item.id); }}
                        style={{ padding:'4px 8px', borderRadius:6, border:'none', background:'rgba(255,107,107,0.1)', color:'#FF6B6B', fontSize:11, cursor:'pointer', fontFamily:'inherit' }}>✕</button>
                    </td>
                  </tr>
                );
              })}
            </tbody>
            {/* Totals footer */}
            {(totalContractVal > 0 || totalMarketVal > 0) && (
              <tfoot>
                <tr style={{ background:'var(--bg-soft)', borderTop:'2px solid var(--line)' }}>
                  <td colSpan="4" style={{ padding:'9px 8px', fontWeight:700, color:'var(--ink-3)', fontSize:11 }}>الإجمالي</td>
                  <td style={{ padding:'9px 6px', textAlign:'center', fontWeight:800, color:'#FF6B6B', fontSize:13 }} className="num">
                    {toEnglishNumbers(fmt(totalContractVal))} <span style={{fontSize:9,fontWeight:400,color:'var(--ink-4)'}}>د.ك</span>
                  </td>
                  <td style={{ padding:'9px 6px', textAlign:'center', fontWeight:800, color:'#4ECDC4', fontSize:13 }} className="num">
                    {toEnglishNumbers(fmt(totalMarketVal))} <span style={{fontSize:9,fontWeight:400,color:'var(--ink-4)'}}>د.ك</span>
                  </td>
                  <td colSpan="4" style={{ padding:'9px 8px', textAlign:'center', fontWeight:800, color: totalDiff>0?'#FF6B6B':'#7ED321', fontSize:13 }} className="num">
                    {totalDiff!==0 ? ((totalDiff>0?'زيادة +':'وفر ')+toEnglishNumbers(fmt(Math.abs(totalDiff)))+' د.ك') : '—'}
                  </td>
                </tr>
              </tfoot>
            )}
          </table>
        </div>
        <div style={{ padding:'10px 12px', borderTop:'1px solid var(--line)' }}>
          <button onClick={addRow} style={{ width:'100%', padding:'8px', borderRadius:8, border:'2px dashed var(--line)', background:'transparent', color:'var(--ink-3)', fontSize:12, cursor:'pointer', fontFamily:'inherit', fontWeight:600 }}>
            + إضافة بند جديد
          </button>
        </div>
      </div>

      {/* ── Market Comparison Panel ── */}
      {activeItem && (
        <div style={{ background:'var(--surface)', borderRadius:14, border:'1.5px solid #4ECDC4', padding:'14px 16px', marginBottom:14, animation:'fadeSlideDown 0.2s ease' }}>
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:12 }}>
            <div>
              <div style={{ fontSize:12, fontWeight:700, color:'#4ECDC4' }}>🔍 مقارنة الأسعار السوقية</div>
              <div style={{ fontSize:11, color:'var(--ink-4)', marginTop:2 }}>{activeItem.name || 'أدخل اسم البند أولاً'}</div>
            </div>
            <button onClick={function(){setActiveItem(null);}} style={{ background:'none', border:'none', color:'var(--ink-4)', cursor:'pointer', fontSize:15, padding:4 }}>✕</button>
          </div>

          {activePrices.length > 0 ? (
            <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:10 }}>
              {activePrices.map(function(src, si) {
                var cp = parseFloat(activeItem.cPrice)||0;
                var diff = cp > 0 ? (cp - src.price) / src.price * 100 : null;
                var sColor = si===0?'#FF6B6B':si===1?'#4ECDC4':'#AA96DA';
                return (
                  <div key={si} style={{ borderRadius:10, padding:'12px 14px', background:'var(--bg-soft)', border:'1px solid var(--line)', borderTop:'3px solid '+sColor }}>
                    <div style={{ fontSize:11, fontWeight:700, color:'var(--ink-2)', marginBottom:8, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>🏪 {src.store}</div>
                    <div style={{ fontSize:22, fontWeight:800, color:sColor, lineHeight:1 }} className="num">{toEnglishNumbers(src.price.toFixed(2))}</div>
                    <div style={{ fontSize:10, color:'var(--ink-4)', marginTop:3 }}>د.ك / وحدة</div>
                    {diff !== null && (
                      <div style={{ marginTop:10, padding:'4px 10px', borderRadius:99, display:'inline-block', background:diff>0?'rgba(255,107,107,0.15)':'rgba(126,211,33,0.15)', color:diff>0?'#FF6B6B':'#7ED321', fontSize:11, fontWeight:700, border:'1px solid '+(diff>0?'rgba(255,107,107,0.3)':'rgba(126,211,33,0.3)') }} className="num">
                        {diff>0?'أعلى بـ +':'أدنى بـ '}{toEnglishNumbers(Math.abs(diff).toFixed(1))}%
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          ) : (
            <div style={{ textAlign:'center', padding:'20px 10px', color:'var(--ink-3)', fontSize:12 }}>
              <div style={{ fontSize:24, marginBottom:8 }}>🔍</div>
              {activeItem.name && activeItem.name.trim().length > 2
                ? 'لم يُعثر على منتج مطابق في قاعدة البيانات — جرّب اسماً أبسط'
                : 'أدخل اسم البند في الجدول ثم اضغط 🔍 للمقارنة'}
            </div>
          )}
        </div>
      )}

      {/* ── Category Breakdown ── */}
      <div style={{ background:'var(--surface)', borderRadius:14, padding:'14px 16px', border:'1px solid var(--line)', marginBottom:14 }}>
        <div style={{ fontSize:12, fontWeight:700, color:'var(--ink)', marginBottom:12 }}>🗂️ تصنيف المنتجات</div>
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:'8px 20px' }}>
          {catList.map(function(cat, ci) {
            var pct = Math.round((cat.count / totalProducts) * 100);
            return (
              <div key={ci}>
                <div style={{ display:'flex', justifyContent:'space-between', marginBottom:3 }}>
                  <span style={{ fontSize:11, fontWeight:600, color:'var(--ink)' }}>{cat.label}</span>
                  <span style={{ fontSize:10, color:'var(--ink-4)' }}>{toEnglishNumbers(String(cat.count))} · {toEnglishNumbers(String(pct))}%</span>
                </div>
                <div style={{ height:6, borderRadius:3, background:'var(--bg-soft)', overflow:'hidden' }}>
                  <div style={{ height:'100%', width:pct+'%', background:cat.color, borderRadius:3 }} />
                </div>
              </div>
            );
          })}
        </div>
      </div>

      {/* ── Products Table ── */}
      <div style={{ background:'var(--surface)', borderRadius:14, padding:'14px 14px', border:'1px solid var(--line)' }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:12, gap:8, flexWrap:'wrap' }}>
          <div style={{ fontSize:12, fontWeight:700, color:'var(--ink)' }}>📋 قائمة المنتجات</div>
          <div style={{ display:'flex', gap:8, alignItems:'center' }}>
            <input
              type="text"
              placeholder="بحث..."
              value={searchTerm}
              onChange={function(e) { setSearchTerm(e.target.value); }}
              style={{ padding:'6px 10px', borderRadius:8, border:'1px solid var(--line)', background:'var(--bg)', color:'var(--ink)', fontSize:12, width:130, fontFamily:'inherit' }}
            />
            <button
              onClick={function() { setSortHighest(!sortHighest); }}
              style={{ padding:'6px 10px', borderRadius:8, border:'none', background: sortHighest ? '#FF6B6B' : '#4ECDC4', color:'white', fontSize:10, fontWeight:700, cursor:'pointer', fontFamily:'inherit', whiteSpace:'nowrap' }}
            >
              {sortHighest ? '↓ أعلى سعر' : '↑ أدنى سعر'}
            </button>
          </div>
        </div>

        <div style={{ overflowX:'auto' }}>
          <table style={{ width:'100%', borderCollapse:'collapse', fontSize:12 }}>
            <thead>
              <tr>
                <th style={{ padding:'8px 8px', textAlign:'right', color:'var(--ink-4)', fontWeight:600, borderBottom:'2px solid var(--line)', fontSize:11 }}>#</th>
                <th style={{ padding:'8px 8px', textAlign:'right', color:'var(--ink-4)', fontWeight:600, borderBottom:'2px solid var(--line)', fontSize:11 }}>المنتج</th>
                <th style={{ padding:'8px 8px', textAlign:'right', color:'var(--ink-4)', fontWeight:600, borderBottom:'2px solid var(--line)', fontSize:11 }}>المتجر</th>
                <th style={{ padding:'8px 8px', textAlign:'right', color:'var(--ink-4)', fontWeight:600, borderBottom:'2px solid var(--line)', fontSize:11 }}>الفئة</th>
                <th style={{ padding:'8px 8px', textAlign:'left',  color:'var(--ink-4)', fontWeight:600, borderBottom:'2px solid var(--line)', fontSize:11 }}>السعر</th>
              </tr>
            </thead>
            <tbody>
              {tableRows.map(function(p, ri) {
                var cat = detectCategory(p.name);
                var priceColor = p.price > 50 ? '#FF6B6B' : p.price > 10 ? '#F5A623' : '#7ED321';
                return (
                  <tr key={ri}
                    onMouseEnter={function(e) { e.currentTarget.style.background='var(--bg-soft)'; }}
                    onMouseLeave={function(e) { e.currentTarget.style.background='transparent'; }}
                    style={{ transition:'background 0.1s' }}
                  >
                    <td style={{ padding:'7px 8px', color:'var(--ink-4)', borderBottom:'1px solid var(--line)' }}>{toEnglishNumbers(String(ri+1))}</td>
                    <td style={{ padding:'7px 8px', color:'var(--ink)', fontWeight:500, borderBottom:'1px solid var(--line)', maxWidth:180, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{p.name}</td>
                    <td style={{ padding:'7px 8px', color:'var(--ink-3)', borderBottom:'1px solid var(--line)', whiteSpace:'nowrap', fontSize:11 }}>{p.store}</td>
                    <td style={{ padding:'7px 8px', borderBottom:'1px solid var(--line)' }}>
                      <span style={{ display:'inline-block', padding:'2px 7px', borderRadius:99, background:cat.color+'18', color:cat.color, fontSize:10, fontWeight:700, border:'1px solid '+cat.color+'30' }}>{cat.label}</span>
                    </td>
                    <td style={{ padding:'7px 8px', color:priceColor, fontWeight:800, borderBottom:'1px solid var(--line)', textAlign:'left', direction:'ltr', fontSize:12 }} className="num">
                      {toEnglishNumbers(p.price.toFixed(2))} <span style={{ fontSize:9, fontWeight:400, color:'var(--ink-4)' }}>د.ك</span>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>

        {filtered.length > 12 && (
          <div style={{ marginTop:10, textAlign:'center', fontSize:11, color:'var(--ink-4)' }}>
            عرض {toEnglishNumbers('12')} من {toEnglishNumbers(String(filtered.length))} منتج
          </div>
        )}
      </div>

    </div>
  );
}

// ── Work Pricing Screen ────────────────────────────────────────────────────────
function WorkPricingScreen() {
  const [size,     setSize]     = React.useState('medium');
  const [ptype,    setPtype]    = React.useState('residential');
  const [total,    setTotal]    = React.useState('');
  const [excluded, setExcluded] = React.useState(new Set());   // IDs of excluded items

  const sk  = size==='small'?'s':size==='medium'?'m':'l';
  const tk  = ptype==='residential'?'r':ptype==='commercial'?'c':'i';
  const key = sk+'_'+tk;

  const totalVal = parseFloat(total) || 0;

  // ── Inclusion logic ────────────────────────────────────────────────────────
  function toggleItem(id) {
    setExcluded(prev => {
      const n = new Set(prev);
      n.has(id) ? n.delete(id) : n.add(id);
      return n;
    });
  }
  function isIncluded(id)  { return !excluded.has(id); }

  // Sum of original pcts for INCLUDED items only
  const inclPctSum = WORK_DIST.reduce((s, item) =>
    isIncluded(item.id) ? s + item.pcts[key] : s, 0);

  // Adjusted (proportionally rescaled) pct for an included item — display only
  function adjPct(item) {
    if (!isIncluded(item.id) || inclPctSum === 0) return 0;
    return Math.round(item.pcts[key] / inclPctSum * 1000) / 10;  // 1 decimal
  }
  // KD value — calculated from RAW ratio (not rounded pct) to avoid accumulation error
  function adjVal(item) {
    if (!isIncluded(item.id) || !totalVal || inclPctSum === 0) return null;
    return Math.round(totalVal * item.pcts[key] / inclPctSum * 100) / 100;
  }

  const includedCount  = WORK_DIST.length - excluded.size;
  const excludedCount  = excluded.size;
  const totalIncluded  = WORK_DIST.reduce((s, item) => {
    const v = adjVal(item);
    return v !== null ? s + v : s;
  }, 0);

  const sizeLabel  = {small:'صغير  (<500 م²)', medium:'متوسط  (500–2000 م²)', large:'كبير  (>2000 م²)'};
  const typeLabel  = {residential:'سكني', commercial:'تجاري', industrial:'صناعي'};
  const sizeColors = {small:'#2F6F4E', medium:'#2C5A8A', large:'#6B3F9E'};
  const typeColors = {residential:'#B25D2B', commercial:'#2C5A8A', industrial:'#9F2D2D'};

  const badge = (active, lbl, fn, col) => (
    <button onClick={fn} style={{
      padding:'7px 14px', borderRadius:20, fontSize:12,
      border:`2px solid ${active ? col : 'var(--line)'}`,
      cursor:'pointer', fontFamily:'inherit', fontWeight:active?700:400,
      background:active?col:'transparent', color:active?'#fff':'var(--ink-2)',
      transition:'all .15s', whiteSpace:'nowrap'
    }}>{lbl}</button>
  );

  function copyReport() {
    if (!totalVal) { alert('أدخل قيمة الأعمال أولاً'); return; }
    const included = WORK_DIST.filter(i => isIncluded(i.id));
    let idx = 0;
    const lines = [
      '════════════════════════════════════════════════════',
      '          توزيع نسب الأعمال الكهربائية',
      '════════════════════════════════════════════════════',
      'المشروع : ' + sizeLabel[size] + '  —  ' + typeLabel[ptype],
      'الإجمالي: ' + fmt(totalVal) + ' د.ك',
      'البنود  : ' + includedCount + ' بنداً مضمّناً' + (excludedCount ? ' (' + excludedCount + ' مستثنى)' : ''),
      'التاريخ : ' + new Date().toLocaleDateString('ar-KW'),
      '────────────────────────────────────────────────────',
      '#   البند                               النسبة   القيمة (د.ك)',
      '────────────────────────────────────────────────────',
      ...included.map(item => {
        idx++;
        const ap  = adjPct(item);
        const val = adjVal(item);
        return String(idx).padEnd(4) + item.name.padEnd(36) + (ap+'%').padEnd(9) + fmt(val||0);
      }),
      '────────────────────────────────────────────────────',
      'الإجمالي' + ''.padEnd(32) + '100%     ' + fmt(Math.round(totalIncluded*100)/100),
      '════════════════════════════════════════════════════',
    ].join('\n');
    if (navigator.clipboard) navigator.clipboard.writeText(lines).then(() => alert('✅ تم نسخ التقرير!'));
  }

  return (
    <div style={{padding:16}}>
      <h2 style={{marginTop:0, fontSize:18}}>⚡ نسبة الأعمال الكهربائية</h2>
      <p style={{marginTop:-4, marginBottom:14, fontSize:12, color:'var(--ink-2)'}}>
        أدخل القيمة الإجمالية وصنّف المشروع، ثم فعّل أو استثنِ أي بند — تُعاد النسب تلقائياً.
      </p>

      {/* ── Classification + Input ── */}
      <div className="card" style={{marginBottom:14}}>
        <h3 style={{marginTop:0, marginBottom:14, fontSize:14}}>🏗️ تصنيف المشروع</h3>
        <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:16, marginBottom:16}}>
          <div>
            <div style={{fontSize:11, color:'var(--ink-2)', marginBottom:8, fontWeight:600}}>حجم المشروع</div>
            <div style={{display:'flex', flexWrap:'wrap', gap:6}}>
              {['small','medium','large'].map(s =>
                badge(size===s, sizeLabel[s], ()=>setSize(s), sizeColors[s])
              )}
            </div>
          </div>
          <div>
            <div style={{fontSize:11, color:'var(--ink-2)', marginBottom:8, fontWeight:600}}>نوع المشروع</div>
            <div style={{display:'flex', flexWrap:'wrap', gap:6}}>
              {['residential','commercial','industrial'].map(t =>
                badge(ptype===t, typeLabel[t], ()=>setPtype(t), typeColors[t])
              )}
            </div>
          </div>
        </div>

        {/* Total value input */}
        <div style={{background:'var(--bg-soft)', borderRadius:10, padding:'14px 16px', border:'2px solid var(--line)'}}>
          <div style={{fontSize:12, color:'var(--ink-2)', marginBottom:6, fontWeight:600}}>💰 إجمالي قيمة الأعمال الكهربائية</div>
          <div style={{display:'flex', alignItems:'center', gap:10}}>
            <input
              type="number" min="0" step="100"
              value={total}
              onChange={e => setTotal(e.target.value)}
              placeholder="مثال: 7000"
              style={{flex:1, padding:'10px 14px', borderRadius:8, border:'2px solid var(--line)',
                background:'var(--surface)', color:'var(--ink)', fontSize:18, fontFamily:'inherit',
                fontWeight:700, outline:'none'}}
            />
            <div style={{fontSize:16, fontWeight:700, color:'var(--ink-2)', whiteSpace:'nowrap'}}>د.ك</div>
          </div>
          {totalVal > 0 && (
            <div style={{marginTop:8, fontSize:12, color:'var(--pos)', fontWeight:600}}>
              ✅ {fmt(totalVal)} د.ك موزّعة على {includedCount} بنداً
              {excludedCount > 0 && <span style={{color:'var(--warn)', marginRight:8}}>({excludedCount} مستثنى)</span>}
            </div>
          )}
        </div>
      </div>

      {/* ── Distribution Table ── */}
      <div className="card" style={{marginBottom:14}}>
        <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:12}}>
          <h3 style={{margin:0, fontSize:14}}>
            📊 توزيع الأعمال — {sizeLabel[size].trim()} / {typeLabel[ptype]}
            {excludedCount > 0 && (
              <span style={{fontSize:11, fontWeight:400, color:'var(--warn)', marginRight:8}}>
                (نسب معدّلة — {excludedCount} مستثنى)
              </span>
            )}
          </h3>
          <div style={{display:'flex', gap:8, alignItems:'center'}}>
            {excludedCount > 0 && (
              <button onClick={() => setExcluded(new Set())} style={{padding:'5px 10px', borderRadius:8,
                border:'1px solid var(--warn)', background:'transparent', color:'var(--warn)',
                cursor:'pointer', fontFamily:'inherit', fontSize:11}}>↺ إعادة الكل</button>
            )}
            {totalVal > 0 && (
              <button onClick={copyReport} style={{padding:'6px 14px', borderRadius:8, border:'none',
                background:'var(--accent)', color:'var(--bg)', fontWeight:600, cursor:'pointer',
                fontFamily:'inherit', fontSize:11}}>📋 نسخ التقرير</button>
            )}
          </div>
        </div>
        <div style={{overflowX:'auto'}}>
          <table style={{width:'100%', borderCollapse:'collapse', fontSize:12}}>
            <thead>
              <tr style={{background:'var(--accent)', color:'var(--bg)'}}>
                <th style={{padding:'8px 10px', textAlign:'center', width:44}}>✓</th>
                <th style={{padding:'8px 10px', textAlign:'right', width:36}}>#</th>
                <th style={{padding:'8px 10px', textAlign:'right', width:90}}>الفئة</th>
                <th style={{padding:'8px 10px', textAlign:'right'}}>البند الكهربائي</th>
                <th style={{padding:'8px 16px', textAlign:'center', width:130}}>النسبة %</th>
                <th style={{padding:'8px 14px', textAlign:'left', width:130}}>القيمة (د.ك)</th>
              </tr>
            </thead>
            <tbody>
              {WORK_DIST.map((item, i) => {
                const inc  = isIncluded(item.id);
                const ap   = adjPct(item);
                const val  = adjVal(item);
                const origPct = item.pcts[key];
                const barW = inc ? Math.round(ap * 3.5) : 0;
                const changed = inc && excludedCount > 0;  // pct was rescaled
                return (
                  <tr key={item.id} style={{
                    background: !inc ? 'var(--neg-bg)' : i%2===0 ? 'transparent' : 'var(--bg-soft)',
                    borderBottom:'1px solid var(--line)',
                    opacity: inc ? 1 : 0.55,
                    transition:'all .2s'
                  }}>
                    {/* Checkbox */}
                    <td style={{padding:'8px 10px', textAlign:'center'}}>
                      <input
                        type="checkbox"
                        checked={inc}
                        onChange={() => toggleItem(item.id)}
                        style={{width:16, height:16, cursor:'pointer', accentColor:'var(--pos)'}}
                      />
                    </td>
                    <td style={{padding:'8px 10px', color:'var(--ink-4)', fontWeight:600}}>{i+1}</td>
                    <td style={{padding:'8px 10px'}}>
                      <span style={{fontSize:10, padding:'2px 7px', borderRadius:10,
                        background:'var(--accent-soft)', color:'var(--ink-3)', whiteSpace:'nowrap'}}>{item.cat}</span>
                    </td>
                    <td style={{padding:'8px 10px', fontWeight:600,
                      color: inc ? 'var(--ink)' : 'var(--ink-4)',
                      textDecoration: inc ? 'none' : 'line-through'}}>
                      {item.name}
                    </td>
                    <td style={{padding:'8px 16px', textAlign:'center'}}>
                      {inc ? (
                        <div style={{display:'flex', alignItems:'center', gap:5, justifyContent:'center'}}>
                          <div style={{width:barW, height:6, borderRadius:3,
                            background: changed ? 'var(--warn)' : 'var(--info)',
                            opacity:0.7, flexShrink:0, transition:'width .3s'}}></div>
                          <span style={{fontWeight:700,
                            color: changed ? 'var(--warn)' : 'var(--info)', minWidth:34}}>
                            {ap}%
                          </span>
                          {changed && (
                            <span style={{fontSize:9, color:'var(--ink-4)'}}>(أصل {origPct}%)</span>
                          )}
                        </div>
                      ) : (
                        <span style={{fontSize:11, color:'var(--neg)', fontWeight:600}}>مستثنى</span>
                      )}
                    </td>
                    <td style={{padding:'8px 14px', textAlign:'left', fontWeight:700, fontSize:13,
                      color: inc && val!==null ? 'var(--pos)' : 'var(--ink-4)'}}>
                      {inc && val !== null
                        ? fmt(val) + ' د.ك'
                        : <span style={{fontSize:11, fontWeight:400, color:'var(--ink-4)'}}>
                            {inc ? 'أدخل القيمة' : '—'}
                          </span>}
                    </td>
                  </tr>
                );
              })}
            </tbody>
            <tfoot>
              <tr style={{background:'var(--accent-soft)', borderTop:'2px solid var(--line-strong)'}}>
                <td colSpan={4} style={{padding:'10px 10px', fontWeight:800, fontSize:14}}>
                  الإجمالي
                  <span style={{fontSize:11, fontWeight:400, color:'var(--ink-3)', marginRight:8}}>
                    ({includedCount} بند)
                  </span>
                </td>
                <td style={{padding:'10px 16px', textAlign:'center', fontWeight:800,
                  color: excludedCount > 0 ? 'var(--warn)' : 'var(--accent)', fontSize:15}}>
                  100%
                </td>
                <td style={{padding:'10px 14px', textAlign:'left', fontWeight:800, color:'var(--pos)', fontSize:15}}>
                  {totalVal > 0
                    ? fmt(totalVal) + ' د.ك'
                    : <span style={{color:'var(--ink-4)', fontSize:12, fontWeight:400}}>—</span>}
                </td>
              </tr>
            </tfoot>
          </table>
        </div>
      </div>

      {/* ── Summary cards ── */}
      {totalVal > 0 && (
        <div style={{display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:10, marginBottom:14}}>
          {[
            {lbl:'البنود المضمّنة',  col:'var(--pos)',  val: includedCount + ' / ' + WORK_DIST.length + ' بنداً'},
            {lbl:'البنود المستثناة', col:'var(--warn)', val: excludedCount > 0 ? excludedCount + ' بنود' : 'لا يوجد'},
            {lbl:'إجمالي المضمّن',   col:'var(--info)', val: totalVal > 0 ? fmt(totalVal) + ' د.ك' : '—'},
          ].map(c => (
            <div key={c.lbl} className="card" style={{padding:'10px 12px', textAlign:'center'}}>
              <div style={{fontSize:11, color:'var(--ink-3)', marginBottom:4}}>{c.lbl}</div>
              <div style={{fontSize:12, fontWeight:700, color:c.col}}>{c.val}</div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// Products search screen
function ProductsScreen() {
  const [searchTerm, setSearchTerm] = React.useState('');
  const [selectedStore, setSelectedStore] = React.useState('');
  const [minPrice, setMinPrice] = React.useState('');
  const [maxPrice, setMaxPrice] = React.useState('');

  const filtered = APP_DATA.materials.filter(m => {
    const matchesSearch = m.name.includes(searchTerm);
    const matchesStore = !selectedStore || m.store === selectedStore;
    const matchesPrice = (!minPrice || m.price >= parseFloat(minPrice)) &&
                         (!maxPrice || m.price <= parseFloat(maxPrice));
    return matchesSearch && matchesStore && matchesPrice;
  });

  return (
    <div style={{ padding: '16px' }}>
      <h2 style={{ marginTop: 0 }}>🔍 المنتجات</h2>

      {/* Search Filters */}
      <div className="card" style={{ marginBottom: 16 }}>
        <h3 style={{ marginTop: 0 }}>البحث والتصفية</h3>
        <input
          type="text"
          placeholder="ابحث عن منتج..."
          value={searchTerm}
          onChange={e => setSearchTerm(e.target.value)}
          style={{ width: '100%', padding: '8px', marginBottom: 10, borderRadius: '8px', border: '1px solid var(--line)' }}
        />

        <select
          value={selectedStore}
          onChange={e => setSelectedStore(e.target.value)}
          style={{ width: '100%', padding: '8px', marginBottom: 10, borderRadius: '8px', border: '1px solid var(--line)' }}
        >
          <option value="">جميع المتاجر</option>
          {APP_DATA.stores.map(s => <option key={s.id} value={s.name}>{s.name}</option>)}
        </select>

        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8 }}>
          <input
            type="number"
            placeholder="السعر من"
            value={minPrice}
            onChange={e => setMinPrice(e.target.value)}
            style={{ padding: '8px', borderRadius: '8px', border: '1px solid var(--line)' }}
          />
          <input
            type="number"
            placeholder="السعر إلى"
            value={maxPrice}
            onChange={e => setMaxPrice(e.target.value)}
            style={{ padding: '8px', borderRadius: '8px', border: '1px solid var(--line)' }}
          />
        </div>
      </div>

      {/* Results */}
      <div className="table-container">
        <table>
          <thead>
            <tr>
              <th>المنتج</th>
              <th>المتجر</th>
              <th>السعر</th>
              <th>المخزون</th>
            </tr>
          </thead>
          <tbody>
            {filtered.map(m => (

// Materials table screen
function MaterialsTableScreen() {
  const [materials, setMaterials] = React.useState([
    { id: Date.now(), product: '', quantity: 1, unitPrice: 0, total: 0 }
  ]);

  const addRow = () => {
    setMaterials([...materials, { id: Date.now(), product: '', quantity: 1, unitPrice: 0, total: 0 }]);
  };

  const removeRow = (id) => {
    setMaterials(materials.filter(m => m.id !== id));
  };

  const updateRow = (id, field, value) => {
    setMaterials(materials.map(m => {
      if (m.id === id) {
        const updated = { ...m, [field]: value };
        if (field === 'quantity' || field === 'unitPrice') {
          updated.total = (parseFloat(updated.quantity) || 0) * (parseFloat(updated.unitPrice) || 0);
        }
        return updated;
      }
      return m;
    }));
  };

  const updateProduct = (id, productName) => {
    const product = APP_DATA.materials.find(p => p.name === productName);
    if (product) {
      // Update both product and price in a single state update
      setMaterials(materials.map(m => {
        if (m.id === id) {
          const updated = {
            ...m,
            product: productName,
            unitPrice: product.price,
          };
          updated.total = (parseFloat(updated.quantity) || 0) * (parseFloat(updated.unitPrice) || 0);
          return updated;
        }
        return m;
      }));
    }
  };

  const total = materials.reduce((sum, m) => sum + (m.total || 0), 0);

  const exportWord = () => {
    const rows = materials.filter(m => m.product).map(m =>
      `<tr>
         <td align="right"  style="border:1px solid #ccc;padding:8px">${m.product}</td>
         <td align="center" style="border:1px solid #ccc;padding:8px">${m.quantity}</td>
         <td align="center" style="border:1px solid #ccc;padding:8px">${(parseFloat(m.unitPrice)||0).toFixed(3)}</td>
         <td align="center" style="border:1px solid #ccc;padding:8px;font-weight:bold">${(parseFloat(m.total)||0).toFixed(3)}</td>
       </tr>`
    ).join('');
    const html = `<html xmlns:o='urn:schemas-microsoft-com:office:office'
      xmlns:w='urn:schemas-microsoft-com:office:word'
      xmlns='http://www.w3.org/TR/REC-html40'>
      <head>
        <meta charset='utf-8'>
        <xml><w:WordDocument><w:View>Print</w:View></w:WordDocument></xml>
        <style>
          body{font-family:Arial,sans-serif;direction:rtl;padding:24px;font-size:11pt}
          h1{font-size:16pt;margin-bottom:6px}
          p{margin:3px 0}
          table{width:100%;border-collapse:collapse;margin-top:16px}
          th{background:#1a1a1a;color:#fff;border:1px solid #555;padding:9px;text-align:center}
        </style>
      </head>
      <body dir="rtl">
        <h1>📋 قائمة المواد الكهربائية</h1>
        <p><strong>التاريخ:</strong> ${new Date().toLocaleDateString('ar-KW')}</p>
        <p><strong>عدد البنود:</strong> ${materials.filter(m=>m.product).length}</p>
        <br>
        <table>
          <thead>
            <tr>
              <th>المنتج</th><th>الكمية</th>
              <th>السعر الفردي (د.ك)</th><th>المجموع (د.ك)</th>
            </tr>
          </thead>
          <tbody>
            ${rows}
            <tr style="background:#f0f0f0;font-weight:bold">
              <td colspan="3" align="right" style="border:1px solid #ccc;padding:9px;font-size:12pt">الإجمالي الكلي</td>
              <td align="center" style="border:1px solid #ccc;padding:9px;font-size:12pt">${total.toFixed(3)} د.ك</td>
            </tr>
          </tbody>
        </table>
      </body>
    </html>`;
    const blob = new Blob(['﻿'+html], {type:'application/msword'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'قائمة-المواد-'+new Date().toISOString().split('T')[0]+'.doc';
    a.click();
  };

  const exportExcel = () => {
    let csv = 'المنتج,الكمية,السعر (د.ك),المجموع (د.ك)\n';
    materials.forEach(m => {
      csv += `"${m.product}",${m.quantity},${m.unitPrice},${m.total}\n`;
    });
    csv += `,,الإجمالي,${total}`;

    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `materials-${new Date().toISOString().split('T')[0]}.csv`;
    link.click();
  };

  return (
    <div style={{ padding: '16px' }}>
      <h2 style={{ marginTop: 0 }}>📋 جدول المواد</h2>

      <div className="table-container">
        <table style={{ marginBottom: 16 }}>
          <thead>
            <tr>
              <th>المنتج</th>
              <th>الكمية</th>
              <th>السعر الفردي (د.ك)</th>
              <th>المجموع (د.ك)</th>
              <th>حذف</th>
            </tr>
          </thead>
          <tbody>
            {materials.map(m => (
              <tr key={m.id} style={{ background: m.product ? 'var(--info-bg)' : 'transparent', borderLeft: m.product ? '4px solid var(--info)' : 'none' }}>
                <td style={{ minWidth: 300, padding: '12px' }}>
                  {/* Show selected product prominently */}
                  <div style={{ marginBottom: 10 }}>
                    {m.product && (
                      <div style={{ background: 'linear-gradient(135deg, var(--info-bg) 0%, var(--surface) 100%)', padding: '8px 12px', borderRadius: 6, border: '2px solid var(--info)', display: 'block' }}>
                        <div style={{ fontSize: 10, color: 'var(--ink-3)', marginBottom: 3, fontWeight: 600 }}>✅ المنتج المختار</div>
                        <div style={{ fontSize: 15, fontWeight: 700, color: 'var(--info)' }}>{m.product}</div>
                      </div>
                    )}
                  </div>

                  {/* Dropdown for selection */}
                  <select
                    value={m.product || ''}
                    onChange={e => {
                      const selectedValue = e.target.value;
                      if (selectedValue) {
                        updateProduct(m.id, selectedValue);
                      }
                    }}
                    style={{
                      width: '100%',
                      padding: '10px',
                      borderRadius: '6px',
                      border: m.product ? '2px solid var(--info)' : '1px solid var(--line)',
                      fontSize: 13,
                      fontWeight: 500,
                      background: 'var(--surface)',
                      color: m.product ? 'var(--info)' : 'var(--ink)',
                    }}
                  >
                    <option value="">📦 اختر منتج...</option>
                    {APP_DATA.materials.map(p => <option key={p.id} value={p.name}>{p.name}</option>)}
                  </select>
                </td>
                <td style={{ textAlign: 'center' }}>
                  <input
                    type="number"
                    value={m.quantity}
                    onChange={e => updateRow(m.id, 'quantity', e.target.value)}
                    style={{ width: '70px', padding: '8px', borderRadius: '6px', border: '1px solid var(--line)', textAlign: 'center', fontWeight: 600 }}
                    min="1"
                  />
                </td>
                <td className="num" style={{ textAlign: 'center', fontWeight: 600 }}>{fmt(m.unitPrice)}</td>
                <td className="num" style={{ textAlign: 'center' }}>
                  <div style={{ fontSize: 16, fontWeight: 700, color: 'var(--accent)', background: 'var(--bg-soft)', padding: 8, borderRadius: 6 }}>{fmt(m.total)}</div>
                </td>
                <td style={{ textAlign: 'center' }}>
                  <button onClick={() => removeRow(m.id)} style={{ padding: '8px 12px', borderRadius: '6px', border: '1px solid var(--neg)', background: 'var(--neg-bg)', color: 'var(--neg)', cursor: 'pointer', fontWeight: 600 }}>حذف</button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {/* Total */}
      <div className="card" style={{ marginBottom: 16 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <div>
            <h3 style={{ margin: 0 }}>الإجمالي</h3>
            <p style={{ margin: '4px 0 0', color: 'var(--ink-3)', fontSize: 12 }}>عدد البنود: {materials.length}</p>
          </div>
          <div style={{ fontSize: 24, fontWeight: 700, color: 'var(--accent)' }} className="num">{fmt(total)} د.ك</div>
        </div>
      </div>

      {/* Buttons */}
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 8 }}>
        <button
          onClick={addRow}
          style={{ padding: '10px', borderRadius: '8px', border: 'none', background: 'var(--info-bg)', color: 'var(--info)', fontWeight: 600, cursor: 'pointer' }}
        >
          ➕ إضافة صف
        </button>
        <button
          onClick={exportExcel}
          style={{ padding: '10px', borderRadius: '8px', border: 'none', background: 'var(--pos-bg)', color: 'var(--pos)', fontWeight: 600, cursor: 'pointer' }}

          📊 تصدير Excel

        <button
          onClick={exportWord}

          📄 تصدير Word

  );
}

function AdminScreen({ onAdminAuth }) {
  // ✅ الوصول محمي بالكامل عبر AuthWrapper — role=admin فقط يصل لهنا
  // تم حذف كود كلمة المرور الميت (dead code) لمنع كشف أي بيانات
  const [lastUpdate, setLastUpdate] = React.useState(localStorage.getItem('lastDataUpdate') || 'لم يتم التحديث');
  const [updateFrequency, setUpdateFrequency] = React.useState(localStorage.getItem('updateFrequency') || 'monthly');
  const [updateLog, setUpdateLog] = React.useState(JSON.parse(localStorage.getItem('updateLog') || '[]'));

  const handleDataUpdate = () => {
    const now = new Date();
    const currentMonth = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
    // ✅ حساب الشهر التالي صح حتى في ديسمبر — يُستخدم في كلا الـ alert
    const [_y, _m] = currentMonth.split('-').map(Number);
    const nextM = _m === 12 ? `${_y+1}-01` : `${_y}-${String(_m+1).padStart(2,'0')}`;
    const storedMonth = localStorage.getItem('lastUpdateMonth'); // ISO فقط

    // ✅ الحماية الشهرية الفعلية — مقارنة ISO بـ ISO
    if (storedMonth === currentMonth) {
      const storedDisplay = localStorage.getItem('lastDataUpdate') || storedMonth;
      alert(`🔒 التحديث مقيّد\n\nتم تحديث البيانات في:\n${storedDisplay}\n\nلا يمكن التحديث أكثر من مرة واحدة بالشهر.\nالشهر القادم: ${nextM}`);
      return;
    }

    // تأكيد قانوني صريح من الأدمن
    const confirmUpdate = window.confirm(
      `⚠️ تأكيد قانوني مطلوب\n\n` +
      `أنت على وشك تسجيل طلب استفسار عن أسعار المنتجات.\n\n` +

      `✓ مرة واحدة كحد أقصى بالشهر\n` +
      `✓ يُسجَّل هذا الطلب برقم مرجعي وتاريخ كامل\n` +
      `✓ البيانات للاستخدام الشخصي/الاستشاري فقط\n` +
      `✓ غير مخصص للنشر التجاري أو إعادة البيع\n\n` +
      `هل تقر بذلك وتؤكد المتابعة؟`
    );

    if (!confirmUpdate) return;

    // سجل قانوني كامل
    const displayTimestamp = now.toLocaleString('ar-KW');
    const isoTimestamp = now.toISOString();
    const refNumber = 'UPD-' + now.getFullYear() + String(now.getMonth()+1).padStart(2,'0') + String(now.getDate()).padStart(2,'0') + '-' + String(now.getHours()).padStart(2,'0') + String(now.getMinutes()).padStart(2,'0');

    const updateRecord = {
      ref: refNumber,

      isoDate: isoTimestamp,

    localStorage.setItem('lastUpdateMonth', currentMonth);

    localStorage.setItem('updateLog', JSON.stringify(newLog));

    alert(`✅ تم التسجيل بنجاح\n\n` +
      `📋 الرقم المرجعي: ${refNumber}\n` +
      `📅 التاريخ: ${displayTimestamp}\n` +

// ── Mind Map Screen for Engineering Cases ──────────────────────────────────
function MindMapScreen() {
  // === STATE ===
  const [plaintiff,    setPlaintiff]    = React.useState('شركة العمائر للمقاولات');
  const [defendant,    setDefendant]    = React.useState('المؤسسة العامة للكهرباء');
  const [caseNum,      setCaseNum]      = React.useState('ق.إ/2024/45');
  const [contractDate, setContractDate] = React.useState('2023-06-15');
  const [workStart,    setWorkStart]    = React.useState('2023-07-01');
  const [activeTab,    setActiveTab]    = React.useState('mindmap');
  const [customEvents, setCustomEvents] = React.useState([]);

  // === HELPERS ===
  function formatDate(s) {
    if (!s) return '';
    const [y,m,d] = s.split('-');
    return `${d}/${m}/${y}`;
  }
  function daysBetween(a, b) {
    if (!a || !b) return '-';
    return Math.floor(Math.abs(new Date(b) - new Date(a)) / 86400000);
  }
  function impFromType(type) {
    if (['عقد','نزاع'].some(w => type.includes(w)))    return { level:'حرج',        color:'#cc2222', bg:'#fff0f0' };
    if (['معاينة','فحص'].some(w => type.includes(w)))  return { level:'عالي جداً',  color:'#2244cc', bg:'#f0f0ff' };
    if (['دفعة','بدء'].some(w => type.includes(w)))    return { level:'عالي',        color:'#227722', bg:'#f0fff0' };
    return { level:'متوسط', color:'#888888', bg:'#f8f8f8' };
  }

  // Custom events CRUD
  function addCustom() { setCustomEvents(prev => [...prev, { id: Date.now(), date:'', label:'', type:'دفعة' }]); }
  function removeCustom(id) { setCustomEvents(prev => prev.filter(e => e.id !== id)); }
  function updateCustom(id, field, val) { setCustomEvents(prev => prev.map(e => e.id === id ? {...e,[field]:val} : e)); }

  // === ALL EVENTS (built-in + custom, sorted by date) ===
  const builtIn = [
    { date: contractDate, label: 'إبرام العقد',        type: 'عقد'     },
    { date: workStart,    label: 'بدء الأعمال',         type: 'بدء'    },
  ];
  const allEvents = [...builtIn, ...customEvents.filter(e => e.date && e.label)]
    .filter(e => e.date)
    .sort((a,b) => new Date(a.date) - new Date(b.date))
    .map((e, idx, arr) => ({
      ...e,
      order: idx + 1,
      daysFromPrev: idx === 0 ? '-' : daysBetween(arr[idx-1].date, e.date),
      imp: impFromType(e.type)
    }));

  // === WORD EXPORT ===
  function exportWord() {
    const rows = allEvents.map(e =>
      `<tr style="background:${e.imp.bg}">
